  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 4(3x − 1)<\u002Fspan><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-size:42px;font-weight:800;padding:16px 34px;border-radius:999px;transform:rotate(-2deg);\">a = (v − u) ÷ t<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Cambridge IGCSE™ · Mathematics 0580<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:20px;max-width:1050px;\"><span style=\"font-size:40px;font-weight:800;color:var(--color-accent-700);\">Chapter 6<\u002Fspan>\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:140px;line-height:.96;margin:0;\">Equations, factors &amp; formulae<\u002Fh1>\n<p style=\"font-size:38px;line-height:1.4;margin:0;max-width:900px;text-wrap:pretty;\">Solving linear and exponential equations, factorising, and changing the subject of a formula.<\u002Fp><\u002Fdiv>\n<p style=\"font-size:30px;font-weight:700;color:var(--color-neutral-800);margin:0;\">Use the arrows to move · press Next step to build each diagram · type into the quiz boxes and press Check<\u002Fp>\n<\u002Fsection>\n<section data-label=\"Lesson objectives\" data-screen-label=\"02 Lesson objectives\" data-speaker-notes=\"These are the aims from the start of the chapter, grouped by the lesson where each is taught, plus the key words.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Lesson objectives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:66px;line-height:1.04;margin:0;text-wrap:pretty;\">In this chapter you will…<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;\"><div style=\"background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:28px 32px;display:flex;gap:28px;align-items:center;\"><span style=\"flex:none;width:130px;height:130px;border-radius:50%;background:var(--color-accent-700);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:50px;\">6.1<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:28px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-800);\">Solving equations<\u002Fspan><p style=\"font-size:31px;line-height:1.32;margin:0;text-wrap:pretty;\">Solve a linear equation, including equations with brackets and fractions; solve equations where the unknown is a power<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:28px 32px;display:flex;gap:28px;align-items:center;\"><span style=\"flex:none;width:130px;height:130px;border-radius:50%;background:var(--color-accent-2-700);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:50px;\">6.2<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:28px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-2-800);\">Factorising<\u002Fspan><p style=\"font-size:31px;line-height:1.32;margin:0;text-wrap:pretty;\">Factorise algebraic expressions by taking out common factors, including by grouping<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:28px 32px;display:flex;gap:28px;align-items:center;\"><span style=\"flex:none;width:130px;height:130px;border-radius:50%;background:var(--color-accent-700);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:50px;\">6.3<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:28px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-800);\">Rearranging formulae<\u002Fspan><p style=\"font-size:31px;line-height:1.32;margin:0;text-wrap:pretty;\">Rearrange a formula to change the subject<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:28px 32px;display:flex;gap:28px;align-items:center;\"><span style=\"flex:none;width:130px;height:130px;border-radius:50%;background:var(--color-accent-2-700);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:36px;\">Words<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:28px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-2-800);\">Key words<\u002Fspan><p style=\"font-size:31px;line-height:1.32;margin:0;text-wrap:pretty;\">factorisation · linear equation · solution · subject<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"flex:none;font-size:31px;line-height:1.4;margin:0;text-wrap:pretty;color:var(--color-neutral-800);max-width:1500px;\">Equations and formulae let you record a problem quickly and work with it. They are used to find areas and volumes, cooking times, car performance and the cost of insulating a house.<\u002Fp>\n<\u002Fsection>\n<section data-label=\"Prior knowledge\" data-screen-label=\"03 Prior knowledge\" data-speaker-notes=\"Check these skills from earlier chapters before starting: inverse operations, collecting like terms, expanding brackets, the highest common factor, the laws of indices and adding fractions.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Prior knowledge<\u002Fspan><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);white-space:nowrap;\">Before you start<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:66px;line-height:1.04;margin:0;text-wrap:pretty;\">What you need to remember<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Inverse operations<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">+ undoes −, × undoes ÷, squaring undoes a square root.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Like terms (Ch 2)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">5x + 3x − 2x = 6x. Only terms with the same letters combine.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Expanding (Ch 2)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">4(3x − 1) = 12x − 4 and −2(5 − x) = −10 + 2x.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">HCF (Ch 1)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">The highest common factor of 36 and 24 is 12.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Laws of indices (Ch 2)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">(3²)ˣ = 3²ˣ and 81 = 3⁴, 32 = 2⁵.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Fractions (Ch 5)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">To add ⅔ + ⅙, use the lowest common denominator 6.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Warm-up\" data-screen-label=\"04 Warm-up\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Quick check ily:var(--font-heading);font-weight:400;font-size:60px;line-height:1.04;margin:0;text-wrap:pretty;\">Chapter 6 checklist<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;\"><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent-2);\"><\u002Fspan><span style=\"text-wrap:pretty;\">A variable is a letter or symbol that can represent many values.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent);\"><\u002Fspan><span style=\"text-wrap:pretty;\">A linear equation has no variable with a power greater than one.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent-2);\"><\u002Fspan><span style=\"text-wrap:pretty;\">Solving an equation means finding the value of the variable.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent);\"><\u002Fspan><span style=\"text-wrap:pretty;\">Always do the same thing to both sides of an equation.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent-2);\"><\u002Fspan><span style=\"text-wrap:pretty;\">Factorising is the reverse of expanding brackets.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.3;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:var(--color-accent);\"><\u002Fspan><span style=\"text-wrap:pretty;\">A formula can be rearranged to make a different variable the subject.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px;min-height:0;\"><div style=\"flex:none;display:flex;gap:18px;align-items:center;font-size:34px;font-weight:700;line-height:1.3;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:18px 24px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;border:4px solid var(--color-accent-2-700);\"><\u002Fspan><span style=\"text-wrap:pretty;\">solve a linear equation<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:center;font-size:34px;font-weight:700;line-height:1.3;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:18px 24px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;border:4px solid var(--color-accent-2-700);\"><\u002Fspan><span style=\"text-wrap:pretty;\">factorise an algebraic expression by taking out any common factors<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:center;font-size:34px;font-weight:700;line-height:1.3;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:18px 24px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;border:4px solid var(--color-accent-2-700);\"><\u002Fspan><span style=\"text-wrap:pretty;\">rearrange a formula to change the subject<\u002Fspan><\u002Fdiv><p style=\"flex:none;font-size:29px;line-height:1.4;margin:0;text-wrap:pretty;color:var(--color-neutral-800);\">Self assessment: list three things you did well. What could you improve? Which earlier skills did you use?<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Well done\" data-screen-label=\"49 Well done\" data-speaker-notes=\"Closing slide. You can now solve linear and exponential equations, factorise expressions, and change the subject of a formula.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;background:var(--color-accent);padding:100px 120px;display:flex;flex-direction:column;justify-content:space-between;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;right:-160px;top:-200px;width:900px;height:900px;border-radius:50%;background:var(--color-accent-400);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:320px;bottom:-260px;width:580px;height:580px;border-radius:50%;background:var(--color-accent-2-400);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:140px;bottom:160px;width:180px;height:180px;border-radius:50%;background:var(--color-accent-700);\"><\u002Fdiv>\n<span style=\"font-size:32px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;\">Chapter 6 complete<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:24px;max-width:1150px;\"><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:160px;line-height:1.02;margin:0;\">Well done!<\u002Fh2><p style=\"font-size:40px;line-height:1.4;margin:0;text-wrap:pretty;\">You can now solve linear and exponential equations, factorise expressions and change the subject of a formula.<\u002Fp><\u002Fdiv>\n<span style=\"font-size:30px;font-weight:700;\">Cambridge IGCSE™ Mathematics 0580 · Chapter 6 · Equations, factors &amp; formulae<\u002Fspan>\n<\u002Fsection>\n\n<\u002Fx-import>\n<a data-nav=\"\" href=\"../chapters.html\" style=\"position:fixed;top:clamp(6px,0.9vw,18px);left:clamp(6px,0.9vw,18px);z-index:2147483600;display:flex;align-items:center;gap:clamp(4px,0.5vw,10px);padding:clamp(6px,0.6vw,12px) clamp(12px,1.25vw,24px) clamp(6px,0.6vw,12px) clamp(8px,0.9vw,18px);opacity:.75;border-radius:999px;background:color-mix(in oklch, var(--color-bg) 55%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);font-family:var(--font-body);font-weight:800;font-size:clamp(12px,0.95vw,18px);text-decoration:none;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:1.2em;height:1.2em;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>All chapters<\u002Fa>\n<button data-nav=\"\" aria-label=\"Previous slide\" sc-camel-on-click=\"{{ prevSlide }}\" style=\"position:fixed;left:clamp(6px,0.9vw,18px);top:50%;transform:translateY(-50%);z-index:2147483600;width:clamp(40px,3.6vw,72px);height:clamp(40px,3.6vw,72px);opacity:.75;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:50%;height:50%;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button data-nav=\"\" aria-label=\"Next slide\" sc-camel-on-click=\"{{ nextSlide }}\" style=\"position:fixed;right:clamp(6px,0.9vw,18px);top:50%;transform:translateY(-50%);z-index:2147483600;width:clamp(40px,3.6vw,72px);height:clamp(40px,3.6vw,72px);opacity:.75;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:50%;height:50%;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst STEPS = {\"gsA\":4,\"gsB\":4,\"fm\":4,\"bal1\":3,\"we1a\":4,\"we1b\":4,\"we1cd\":4,\"we1e\":4,\"we2a\":3,\"we2bc\":5,\"p61a\":1,\"p61b\":1,\"p61c\":1,\"fac1\":4,\"we3ab\":4,\"we3cd\":4,\"we3e\":4,\"we3f\":4,\"p62a\":1,\"p62b\":1,\"p62c\":1,\"cons\":3,\"consA\":1,\"sub1\":4,\"we4\":4,\"p63a\":1,\"p63b\":1,\"pend\":3,\"pq13\":1,\"pq47\":1,\"pq8\":4,\"pq9\":6,\"pq10\":5,\"pq1113\":1};\nconst QUIZ = [\"-4\",\"12\",\"4\",\"6\",\"6\",\"5\",\"2\",\"4\",\"6\",\"4, 3\",\"2\",\"2\",\"4\",\"11\",\"49\",\"17\"];\nconst nums = s => (String(s || '').replace(/[−–]/g, '-').match(/-?\\d+(?:\\.\\d+)?/g) || []).map(Number);\nfunction isRight(v, ans) { const a = nums(ans).sort((x, y) => x - y), u = nums(v).sort((x, y) => x - y); if (!u.length) return null; return u.length === a.length && a.every((x, i) => Math.abs(x - u[i]) < 0.051); }\nconst mn = n => String(n).replace('-', '−');\nconst xt = k => k === 1 ? 'x' : k === -1 ? '−x' : mn(k) + 'x';\nfunction side(x, c) { if (!x && !c) return '0'; if (!x) return mn(c); if (!c) return xt(x); return xt(x) + (c < 0 ? ' − ' + (-c) : ' + ' + c); }\nconst PUZ = [[5, -2, 3, 6], [7, 3, 2, 18], [4, 9, 1, 21], [6, -5, 2, 11], [9, 4, 4, -6], [3, -7, -2, 8]];\nconst FAC = [['18mn − 30m', ['3m', '6m', '6mn'], 1, '6m|3n,−5|18mn,−30m|6m(3n − 5)'], ['15x + 12y', ['3', '5', '3xy'], 0, '3|5x,4y|15x,12y|3(5x + 4y)'], ['36p²q − 24pq²', ['6pq', '12pq', '12p²q'], 1, '12pq|3p,−2q|36p²q,−24pq²|12pq(3p − 2q)'], ['14m²n² + 4m³n³', ['2mn', 'm²n²', '2m²n²'], 2, '2m²n²|7,2mn|14m²n²,4m³n³|2m²n²(7 + 2mn)'], ['36x³ + 24x⁵', ['12x³', '6x³', '12x⁵'], 0, '12x³|3,2x²|36x³,24x⁵|12x³(3 + 2x²)'], ['10x² + 15x', ['5', '5x', 'x'], 1, '5x|2x,3|10x²,15x|5x(2x + 3)']];\nconst SUB = { u: ['u>+at>u + at|v>−at>v − at', 'u = v − at', 'u was built by adding at, so subtract at from both sides.'], a: ['a>×t>at>+u>u + at|v>−u>v − u>÷t>(v − u)/t', 'a = (v − u) ÷ t', 'a was multiplied by t, then u was added. Undo: subtract u, then divide by t.'], t: ['t>×a>at>+u>u + at|v>−u>v − u>÷a>(v − u)/a', 't = (v − u) ÷ a', 't was multiplied by a, then u was added. Undo: subtract u, then divide by a.'] };\nconst bgStart = i => { const [a, b, c, d] = PUZ[i]; return { lx: a, lc: b, rx: c, rc: d, op: '', fb: 'Choose an operation to apply to both sides.', ok: false }; };\nclass Component extends DCLogic {\n  state = { st: {}, qv: {}, qr: {}, bi: 0, bs: bgStart(0), fi: 0, fp: null, sub: 'a' };\n  setStep(k, v) { this.setState(p => ({ st: { ...p.st, [k]: v } })); }\n  renderVals() {\n    const S = this.state, we = {};\n    for (const k in STEPS) {\n      const n = STEPS[k], s = S.st[k] || 0;\n      const o = { step: s, next: () => this.setStep(k, Math.min(n, s + 1)), reset: () => this.setStep(k, 0), toggle: () => this.setStep(k, s ? 0 : n), label: s ? 'Hide the answers' : 'Reveal the answers' };\n      for (let i = 1; i <= n; i++) { o['o' + i] = s >= i ? 1 : 0; o['t' + i] = s >= i ? 'none' : 'translateY(22px) scale(.96)'; }\n      we[k] = o;\n    }\n    const qz = {};\n    QUIZ.forEach((ans, i) => {\n      const r = S.qr[i];\n      const check = () => this.setState(p => { const res = isRight(p.qv[i], ans); return { qr: { ...p.qr, [i]: res === true ? 'ok' : res === null ? 'empty' : 'no' } }; });\n      qz['q' + i] = { val: S.qv[i] || '', check,\n        onInput: e => { const v = e.target.value; this.setState(p => ({ qv: { ...p.qv, [i]: v }, qr: { ...p.qr, [i]: undefined } })); },\n        onKey: e => { e.stopPropagation(); if (e.key === 'Enter') check(); },\n        show: () => this.setState(p => ({ qr: { ...p.qr, [i]: 'show' } })),\n        fb: r === 'ok' ? '✓ Correct!' : r === 'no' ? '✗ Not quite — try again' : r === 'empty' ? 'Type an answer first' : r === 'show' ? 'Answer: ' + ans.replace(/-/g, '−') : '',\n        fbCol: r === 'ok' || r === 'show' ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)' };\n    });\n    const b = S.bs, setB = nb => this.setState({ bs: { ...b, ...nb } });\n    const bg = { eq: side(b.lx, b.lc) + ' = ' + side(b.rx, b.rc), val: side(b.lx, b.lc) + '=' + side(b.rx, b.rc) + (b.op ? '@' + b.op : ''), fb: b.fb, fbCol: b.ok ? 'var(--color-accent-2-700)' : 'var(--color-accent-800)',\n      l1: b.rx ? (b.rx > 0 ? 'Subtract ' + xt(b.rx) + ' from both sides' : 'Add ' + xt(-b.rx) + ' to both sides') : 'x terms collected ✓',\n      l2: b.lc ? (b.lc > 0 ? 'Subtract ' + b.lc + ' from both sides' : 'Add ' + (-b.lc) + ' to both sides') : 'Numbers collected ✓',\n      l3: b.lx !== 1 ? 'Divide both sides by ' + mn(b.lx) : 'Solved ✓',\n      op1: () => { if (!b.rx) return setB({ fb: 'There is no x term on the right any more.' }); const lx = b.lx - b.rx; setB({ lx, rx: 0, op: (b.rx > 0 ? '−' : '+') + xt(Math.abs(b.rx)), fb: 'Both sides changed, so the scales stay balanced.' }); },\n      op2: () => { if (!b.lc) return setB({ fb: 'There is no number on the left any more.' }); setB({ rc: b.rc - b.lc, lc: 0, op: (b.lc > 0 ? '−' : '+') + Math.abs(b.lc), fb: 'Good. Keep going.' }); },\n      op3: () => { if (b.lx === 1) return; if (b.rx || b.lc) return setB({ fb: 'Collect the x terms and the numbers first, then divide.' }); const x = b.rc / b.lx, [p, q, r, s] = PUZ[S.bi]; setB({ rc: x, lx: 1, op: '÷' + mn(b.lx), ok: true, fb: 'Solved: x = ' + mn(x) + '. Check: ' + mn(p * x + q) + ' = ' + mn(r * x + s) + ' ✓' }); },\n      next: () => { const bi = (S.bi + 1) % PUZ.length; this.setState({ bi, bs: bgStart(bi) }); }, reset: () => this.setState({ bs: bgStart(S.bi) }) };\n    const F = FAC[S.fi], fok = S.fp === F[2];\n    const fac = { expr: F[0], o0: F[1][0], o1: F[1][1], o2: F[1][2], val: F[3], step: fok ? 4 : 1, count: (S.fi + 1) + ' of ' + FAC.length,\n      fb: S.fp == null ? '' : fok ? '✓ Yes! ' + F[0] + ' = ' + F[3].split('|')[3] : '✗ ' + F[1][S.fp] + ' is not the highest common factor. Is it a factor of every term? Is there a bigger one?',\n      fbCol: fok ? 'var(--color-accent-2-700)' : 'var(--color-accent-800)',\n      p0: () => this.setState({ fp: 0 }), p1: () => this.setState({ fp: 1 }), p2: () => this.setState({ fp: 2 }), next: () => this.setState({ fi: (S.fi + 1) % FAC.length, fp: null }) };\n    const sv = SUB[S.sub];\n    const sb = { val: sv[0], res: sv[1], how: sv[2], pu: () => this.setState({ sub: 'u' }), pa: () => this.setState({ sub: 'a' }), pt: () => this.setState({ sub: 't' }) };\n    const deck = () => document.querySelector('deck-stage');\n    return { we, qz, bg, fac, sb, prevSlide: () => deck() && deck().prev(), nextSlide: () => deck() && deck().next() };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
