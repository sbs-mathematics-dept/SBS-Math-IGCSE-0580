  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"de6fb989-103c-4dd2-822d-488ceacfb2b0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"1b3923ab-fd86-4154-8501-180acc76e424\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>:root{--font-heading:\"Figtree\",system-ui,sans-serif;--font-heading-weight:800;}body{font-weight:500;}[style*=\"font-heading\"],h1,h2,.btn{font-weight:800 !important;letter-spacing:-0.02em;}html,body{margin:0;background:var(--color-bg);}@media print{[data-nav]{display:none !important;}}a{color:var(--color-accent-700);}a:hover{color:var(--color-accent-800);}<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"128a1861-1b33-4033-a710-b2a9ca625bbe#/deck-stage.js\" no-rail=\"\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Title\" data-screen-label=\"01 Title\" data-speaker-notes=\"Chapter 18 of Cambridge IGCSE 0580 Extended: Curved graphs. We start with the lesson objectives and prior knowledge, then work through lessons 18.1 to 18.7 in book order, finishing with exam-style practice. Every graph is drawn step by step from blank graph paper.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:100px 120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;\">\n<div style=\"position:absolute;right:-160px;top:-180px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<div style=\"position:absolute;right:300px;bottom:-240px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-200);\"><\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 420 320\" style=\"position:absolute;right:140px;top:200px;width:460px;height:350px;overflow:visible;\"><path d=\"M20 20 Q 210 560 400 20\" style=\"fill:none;stroke:var(--color-accent);stroke-width:14;stroke-linecap:round\"><\u002Fpath><line x1=\"210\" y1=\"0\" x2=\"210\" y2=\"320\" style=\"stroke:var(--color-accent-2-700);stroke-width:5;stroke-dasharray:14 12\"><\u002Fline><circle cx=\"210\" cy=\"290\" r=\"16\" style=\"fill:var(--color-accent-2-700)\"><\u002Fcircle><\u002Fsvg>\n<span style=\"position:relative;font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Cambridge IGCSE™ · Mathematics 0580 Extended · Year 11<\u002Fspan>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px;max-width:1150px;\"><span style=\"font-size:34px;font-weight:700;color:var(--color-accent-700);\">Chapter 18<\u002Fspan>\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:150px;line-height:.98;margin:0;\">Curved graphs<\u002Fh1>\n<p style=\"font-size:34px;line-height:1.4;margin:0;max-width:980px;text-wrap:pretty;\">Parabolas, hyperbolas, cubics, exponentials, gradients and differentiation, with exam technique for Papers 2 and 4.<\u002Fp><\u002Fdiv>\n<p style=\"position:relative;font-size:26px;color:var(--color-neutral-700);margin:0;\">Use the arrows to move · press Next step to draw each graph · type into the quiz boxes and press Check<\u002Fp>\n<\u002Fsection>\n<section data-label=\"Lesson objectives\" data-screen-label=\"02 Lesson objectives\" data-speaker-notes=\"These are the ten aims from the start of the chapter, grouped by the lesson where each one is taught.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Lesson objectives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;text-wrap:pretty;\">In this chapter you will…<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">18.1<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Quadratic graphs<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Construct a table of values to draw parabolas; sketch and interpret parabolas<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">18.2<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Reciprocal graphs<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Construct a table of values to draw hyperbolas<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">18.3<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Solving with graphs<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Interpret curved graphs; use graphs to find approximate solutions to quadratic equations<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">18.4<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Simultaneous equations<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Use graphs to find approximate solutions to associated equations<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">18.5<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Other non-linear graphs<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Construct tables of values for axⁿ, a/x, a/x² and abˣ + c; recognise, sketch and interpret graphs of functions<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">18.6<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Gradient of a curve<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Estimate the gradients of curves by drawing tangents<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">18.7<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Derivatives<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Differentiate functions to find gradients and stationary (turning) points<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">Exam<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Paper 2 &amp; 4 practice<\u002Fspan><p style=\"font-size:27px;line-height:1.35;margin:0;text-wrap:pretty;\">Answer full exam-style questions with confidence<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"How this chapter is examined\" data-screen-label=\"03 How this chapter is examined\" data-speaker-notes=\"Extended candidates sit Paper 2 without a calculator and Paper 4 with a calculator. Curved graphs appear on both. The typical long question is: complete a table, plot the curve, solve an equation by drawing a line, and estimate a gradient with a tangent.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam focus<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">0580 Extended<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">How curved graphs are examined<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Paper 2 · no calculator<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Sketching parabolas and cubics from their features, completing the square, differentiating and finding turning points. Exact values and clean algebra matter.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Paper 4 · calculator<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">The long graph question: complete a table of values, plot a smooth curve, draw a line to solve an equation, and draw a tangent to estimate a gradient.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Table<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Every missing value, with brackets around negatives<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Plot<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Each point within half a small square, then a smooth curve<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Line<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Rearrange so one side matches the curve; draw the other side<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Tangent<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Long ruler line touching at one point; big triangle; use the scales<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:27px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Look at the marks in brackets. [1] means write the answer down; [3] or more means the examiner expects working. Write every method step so you can earn method marks even if the final answer slips.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Prior knowledge\" data-screen-label=\"04 Prior knowledge\" data-speaker-notes=\"Before starting, check these skills from earlier chapters: substituting negative numbers, finding the gradient of a straight line, solving quadratics by factorising, the formula and completing the square, and the laws of indices.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Prior knowledge<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Before you start<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">What you need to remember<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Substituting negatives<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Put brackets round negatives: x = −3 in x² − 2x gives (−3)² − 2(−3) = 9 + 6 = 15.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Gradient of a line<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Gradient = y-change ÷ x-change. Through (1, 2) and (3, 8) it is 6 ÷ 2 = 3.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">y = mx + c<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">m is the gradient and c is the y-intercept. Parallel lines have equal gradients.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Solving quadratics<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Factorise, use x = (−b ± √(b² − 4ac)) ÷ 2a, or complete the square (Chapter 14).<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Indices<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">x⁰ = 1, x¹ = x, x⁻¹ = 1/x, x⁻² = 1/x², x^½ = √x.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Simultaneous equations<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Two straight lines meet at the solution (Chapter 14). Substitution also works.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Warm-up\" data-screen-label=\"05 Warm-up\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Quick check<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Prior knowledge<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Check your understanding<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 1<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Find the value of x² − 2x when x = −3.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q0.val }}\" sc-camel-on-input=\"{{ qz.q0.onInput }}\" sc-camel-on-key-down=\"{{ qz.q0.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q0.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q0.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q0.fbCol }};\">{{ qz.q0.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 2<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Find the gradient of the line through (1, 2) and (3, 8).<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q1.val }}\" sc-camel-on-input=\"{{ qz.q1.onInput }}\" sc-camel-on-key-down=\"{{ qz.q1.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q1.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q1.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q1.fbCol }};\">{{ qz.q1.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 3<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Solve x² − 5x + 6 = 0.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q2.val }}\" sc-camel-on-input=\"{{ qz.q2.onInput }}\" sc-camel-on-key-down=\"{{ qz.q2.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q2.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q2.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q2.fbCol }};\">{{ qz.q2.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 4<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Write 2⁻¹ as a decimal.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q3.val }}\" sc-camel-on-input=\"{{ qz.q3.onInput }}\" sc-camel-on-key-down=\"{{ qz.q3.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q3.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q3.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q3.fbCol }};\">{{ qz.q3.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Getting started: the penguin dive\" data-screen-label=\"06 Getting started: the penguin dive\" data-speaker-notes=\"Getting started question 1. The graph shows a penguin diving from an iceberg into the ocean. Draw it step by step, then answer the questions. Point A is the start on the iceberg, B is where it enters the water, C is the deepest point, and D is where it surfaces.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Getting started<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Chapter 18<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">A penguin dives from an iceberg<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:26px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">Explain what happens from A to B, B to C and C to D.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">From what height did the penguin dive?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">How long did it take to enter the water?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">What is the greatest depth reached?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">How long was it under the surface?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">f<\u002Fb><span style=\"text-wrap:pretty;\">What would happen if the graph continued?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.penA.o1 }};transform:{{ we.penA.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">A→B falls through the air; B→C dives deeper under water; C→D swims back up to the surface.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">6 m<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">about 1.2 s<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">about 3.6 m below the surface<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">about 6.3 − 1.2 ≈ 5.1 s<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">f<\u002Fb><span style=\"text-wrap:pretty;\">It levels off at height 0 (swimming on the surface) or rises if it jumps out. Any reasoned answer.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pen.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.penA.toggle }}\">{{ we.penA.label }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"pen\" step=\"{{ we.pen.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Exam command words\" data-screen-label=\"07 Exam command words\" data-speaker-notes=\"Every exam question starts with a command word. It tells you how much to write and whether a graph must be accurate or just a sketch.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam coach<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">0580 Extended<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Read the command word first<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Write down<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">The answer should need little or no working. Read it off a graph or table.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Find / Work out<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Show the key steps. Method marks are given for correct working.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Calculate<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">A numerical answer from working, usually to 3 significant figures.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Show that<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">The answer is given. Write every step clearly to reach it exactly.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Draw / Plot<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Accurate graph on the grid: plotted points and a smooth curve.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Sketch<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Correct shape and position. Label intercepts and turning points; no grid needed.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Estimate<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Use a tangent or graph reading. A range of answers is accepted.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Explain<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Give a reason in words using the mathematics.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Exact form<\u002Fspan><div style=\"font-size:25px;line-height:1.4;text-wrap:pretty;\">Leave surds and fractions, such as 6 + √22. Do not round.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Review of quadratic graphs (the parabola)\" data-screen-label=\"08 18.1 Review of quadratic graphs (the parabola)\" data-speaker-notes=\"Lesson 18.1 reviews quadratic graphs, called parabolas. In Chapter 10 you met straight-line graphs; now the highest power of x is 2.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 18.1<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Review of quadratic graphs (the parabola)<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">construct a table of values to draw graphs called parabolas<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">sketch and interpret parabolas<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find the axis of symmetry and the turning point<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 y = x² and y = −x²\" data-screen-label=\"09 18.1 y = x² and y = −x²\" data-speaker-notes=\"The simplest quadratic graph is y = x squared. Complete the table, plot the points and join them with a smooth curve. Then do the same for y = negative x squared. The negative sign turns the graph upside down.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Parabolas<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Plotting y = x² and y = −x²<\u002Fh2><div style=\"display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));border-radius:var(--radius-lg);overflow:hidden;border:2px solid var(--color-accent-200);font-size:25px;line-height:1.25;\"><div style=\"padding:8px 10px;text-align:left;white-space:nowrap;background:var(--color-accent-100);font-weight:700;fon .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Number the scales: x from −3 to 3, y from −9 to 9.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.x2.o3 }};transform:{{ we.x2.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Plot each (x, y) from the y = x² row.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.x2.o4 }};transform:{{ we.x2.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">Join them with a smooth curve and label it.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.x2.o5 }};transform:{{ we.x2.t5 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">5<\u002Fspan><span style=\"text-wrap:pretty;\">Plot the y = −x² row.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.x2.o6 }};transform:{{ we.x2.t6 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">6<\u002Fspan><span style=\"text-wrap:pretty;\">Join with a smooth curve: it faces down.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Parabola<\u002Fb>  The graph of a quadratic relationship. Positive x² term: a ‘valley’ ∪. Negative x² term: a ‘hill’ ∩.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.x2.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.x2.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"x2\" step=\"{{ we.x2.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Axis of symmetry and turning point\" data-screen-label=\"10 18.1 Axis of symmetry and turning point\" data-speaker-notes=\"The axis of symmetry divides the parabola into two mirror-image halves. For y = x squared and y = negative x squared it is the y-axis, x = 0. The turning point is where the graph changes direction.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Key ideas<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Parabolas<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Symmetry and the turning point<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.sym.o1 }};transform:{{ we.sym.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">The axis of symmetry splits the parabola into two mirror halves. Here it is the y-axis, x = 0.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.sym.o2 }};transform:{{ we.sym.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">For y = x² the lowest point is (0, 0).<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.sym.o3 }};transform:{{ we.sym.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">For y = −x² the highest point is also (0, 0).<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:34px;\">Turning point<\u002Fspan><p style=\"font-size:26px;line-height:1.38;margin:0;text-wrap:pretty;\">The point where the graph changes direction, also called the vertex.
