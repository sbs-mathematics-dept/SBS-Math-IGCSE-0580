you draw? Give k.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q18.val }}\" sc-camel-on-input=\"{{ qz.q18.onInput }}\" sc-camel-on-key-down=\"{{ qz.q18.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q18.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q18.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q18.fbCol }};\">{{ qz.q18.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 Finding the gradient of a curve\" data-screen-label=\"57 18.6 Finding the gradient of a curve\" data-speaker-notes=\"Lesson 18.6. A curve never has a single gradient like a straight line. You find the gradient at a point by drawing a tangent.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 18.6<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Finding the gradient of a curve<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">estimate the gradient of a curve by drawing a tangent<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">calculate the gradient of a tangent from a right-angled triangle<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">interpret a gradient as a rate of change<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 The gradient changes\" data-screen-label=\"58 18.6 The gradient changes\" data-speaker-notes=\"This graph of height against distance shows a mountain biker’s route. Some parts have a steep positive gradient, some are level and some have a negative gradient. You cannot find the gradient of a whole curve, only at a point.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 1000px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Introduction<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Gradients<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.05;margin:0;text-wrap:pretty;\">A curve has no single gradient<\u002Fh2><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\">Some parts of the trail have a steep positive gradient, some a gradual one, some are level and others have a negative gradient.<\u002Fp><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:28px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Key idea<\u002Fb>  The gradient of a curve at a point is the gradient of the tangent to the curve at that point.<\u002Fdiv><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Look again at calculating gradients in Chapter 10: gradient = y-change ÷ x-change.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"bike\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 How to draw a tangent\" data-screen-label=\"59 18.6 How to draw a tangent\" data-speaker-notes=\"How to draw the tangent. Mark the point on the curve. Place your ruler against the curve so it touches only at that point. Draw the line with a pencil. Then make a right-angled triangle to work out its gradient.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Method<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Gradients<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.05;margin:0;text-wrap:pretty;\">Drawing a tangent<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:34px;\">Tangent<\u002Fspan><p style=\"font-size:26px;line-height:1.38;margin:0;text-wrap:pretty;\">A straight line that touches a curve at one point without crossing it there.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tanhow.o1 }};transform:{{ we.tanhow.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Mark a point A on the curve.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tanhow.o2 }};transform:{{ we.tanhow.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Place your ruler against the curve so it touches only at A.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tanhow.o3 }};transform:{{ we.tanhow.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the tangent with a pencil.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tanhow.o4 }};transform:{{ we.tanhow.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">Mark P and Q on it, draw the triangle PNQ and find NQ ÷ PN using the axis scales.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:24px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  Rising left to right: positive gradient. Falling left to right: negative gradient. If an extended tangent meets the curve again elsewhere, that is not a problem.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.tanhow.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.tanhow.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"tanhow\" step=\"{{ we.tanhow.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 Worked example 21\" data-screen-label=\"60 18.6 Worked example 21\" data-speaker-notes=\"Worked example 21. Find the gradient of y = 5x − x² at A (1, 4) and at B (3, 6). At A the tangent rises: gradient 6 over 2 = 3. At B it falls: −3 over 3 = −1.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 21<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Gradients<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Gradients of y = 5x − x²<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:28px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w21.o1 }};transform:{{ we.w21.t1 }};transition:opacity .5s, transform .5s;\">Tangent at A(1, 4)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:25px;text-wrap:pretty;opacity:{{ we.w21.o1 }};transform:{{ we.w21.t1 }};transition:opacity .5s, transform .5s;\">touches only at A<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w21.o2 }};transform:{{ we.w21.t2 }};transition:opacity .5s, transform .5s;\">gradient = NQ ÷ PN = 6 ÷ 2 = 3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:25px;text-wrap:pretty;opacity:{{ we.w21.o2 }};transform:{{ we.w21.t2 }};transition:opacity .5s, transform .5s;\">rising: positive<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w21.o3 }};transform:{{ we.w21.t3 }};transition:opacity .5s, transform .5s;\">Tangent at B(3, 6)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:25px;text-wrap:pretty;opacity:{{ we.w21.o3 }};transform:{{ we.w21.t3 }};transition:opacity .5s, transform .5s;\">touches only at B<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w21.o4 }};transform:{{ we.w21.t4 }};transition:opacity .5s, transform .5s;\">gradient = MR ÷ QM = −3 ÷ 3 = −1<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:25px;text-wrap:pretty;opacity:{{ we.w21.o4 }};transform:{{ we.w21.t4 }};transition:opacity .5s, transform .5s;\">falling: negative<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Measure NQ and PN using the scales on the axes, not by counting squares. Choose P and Q a whole number of x-units apart to make the division easy.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w21.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w21.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w21\" step=\"{{ we.w21.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 Worked example 22: rate of change\" data-screen-label=\"61 18.6 Worked example 22: rate of change\" data-speaker-notes=\"Worked example 22. The graph shows the height of a tree against its age. The rate of growth at 4 years is the gradient of the curve at x = 4. Draw the tangent at A and use a large triangle.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 22<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Rates of change<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">How fast was the tree growing at 4 years?<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tree.o1 }};transform:{{ we.tree.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Mark A on the curve at x = 4.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tree.o2 }};transform:{{ we.tree.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the tangent at A with a ruler, as long as possible.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.tree.o3 }};transform:{{ we.tree.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Triangle: PN = 8 years, NQ = 22.5 m.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:18px 26px;font-size:29px;line-height:1.45;text-wrap:pretty;\">Gradient = NQ ÷ PN = 22.5 ÷ 8 ≈ 2.8<br>The tree was growing at about <b>2.8 metres per year<\u002Fb>.<\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  The gradient gives a rate of change. Its units are (y-units) per (x-unit): metres per year here.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.tree.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.tree.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"tree\" step=\"{{ we.tree.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 Exam coach and practice\" data-screen-label=\"62 18.6 Exam coach and practice\" data-speaker-notes=\"Exam technique for tangent questions and the answers to Exercise 18.10. Tangent answers are estimates, so examiners accept a range of values.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam coach<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Tangent questions in the exam<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;\"><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Draw a long tangent with a ruler that touches at exactly one point. Use a big triangle (at least half the grid wide). Read both lengths from the axis scales. Check the sign: falling means negative. Give the units if there is a context.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;min-height:0;\"><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Exercise 18.10<\u002Fb><\u002Fp><div style=\"display:flex;flex-direction:column;gap:8px;font-size:26px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1a<\u002Fb><span style=\"text-wrap:pretty;\">y = x²: gradient at (2, 4) and at (−1, 1).<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1b<\u002Fb><span style=\"text-wrap:pretty;\">Gradient at (1.5, 2.25) is 3. Where is it −3?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2<\u002Fb><span style=\"text-wrap:pretty;\">Village population: gradient at (1950, 170). What does it represent?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">y = x³ + 1: gradient at A(1, 2).<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.p1810.o1 }};transform:{{ we.p1810.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:26px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">1a<\u002Fb><span style=\"text-wrap:pretty;\">4 and −2 (the gradient is twice the x-coordinate)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">1b<\u002Fb><span style=\"text-wrap:pretty;\">(−1.5, 2.25), by symmetry<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">2<\u002Fb><span style=\"text-wrap:pretty;\">about −4.5 people per year: the rate at which the population was falling in 1950<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">about 3<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.p1810.toggle }}\">{{ we.p1810.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.6 Quick check\" data-screen-label=\"63 18.6 Quick check\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Quick check<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.6 · Gradients<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Check your understanding<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 20<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">A tangent passes through (1, 3) and (4, 15). Find its gradient.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q19.val }}\" sc-camel-on-input=\"{{ qz.q19.onInput }}\" sc-camel-on-key-down=\"{{ qz.q19.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q19.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q19.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q19.fbCol }};\">{{ qz.q19.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 21<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">A tangent passes through (0, 8) and (2, 2). Find its gradient.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q20.val }}\" sc-camel-on-input=\"{{ qz.q20.onInput }}\" sc-camel-on-key-down=\"{{ qz.q20.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q20.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q20.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q20.fbCol }};\">{{ qz.q20.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 22<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Distance (m) is plotted against time (s). A tangent has gradient 12. Give the speed in m/s.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q21.val }}\" sc-camel-on-input=\"{{ qz.q21.onInput }}\" sc-camel-on-key-down=\"{{ qz.q21.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q21.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q21.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q21.fbCol }};\">{{ qz.q21.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Derivatives of functions\" data-screen-label=\"64 18.7 Derivatives of functions\" data-speaker-notes=\"Lesson 18.7. As well as drawing a tangent you can calculate the gradient at any point using the equation of the curve.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 18.7<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Derivatives of functions<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">differentiate functions of the form axⁿ<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find the gradient and the equation of a tangent<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find stationary points and decide if they are maxima or minima<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Investigation: gradients of y = x²\" data-screen-label=\"65 18.7 Investigation: gradients of y = x²\" data-speaker-notes=\"Investigation. Move the point along y = x squared. The gradient of the tangent is always twice the x-coordinate. For y = x cubed the gradient is 3 x squared.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Investigation<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Derivatives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Gradients of tangents to y = x²<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:700;color:var(--color-neutral-700);\">x = {{ tt.x }}<\u002Fspan><input type=\"range\" min=\"-2.5\" max=\"2.5\" step=\"0.5\" value=\"{{ tt.x }}\" sc-camel-on-input=\"{{ tt.onX }}\" style=\"width:100%;height:34px;accent-color:var(--color-accent);\"><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:18px 26px;font-size:32px;line-height:1.45;text-wrap:pretty;\">Gradient of the tangent = <b>{{ tt.g }}<\u002Fb><br><span style=\"color:var(--color-neutral-700);\">= 2 × {{ tt.x }}<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">What do you notice?<\u002Fb>  On y = x² the gradient is always 2x. On y = x³ tangents at (1, 1), (2, 8) and (−1, −1) have gradients 3, 12 and 3: the gradient is 3x².<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"trytan\" value=\"{{ tt.x }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Differentiation\" data-screen-label=\"66 18.7 Differentiation\" data-speaker-notes=\"The gradient functions 2x and 3x squared are derivatives. The process is differentiation. Multiply by the power and reduce the power by 1. Worked example 23.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 800px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 23<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Derivatives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Multiply by the power, reduce the power by 1<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Derivative of function<\u002Fb>  The gradient function, written dy/dx. If y = x² then dy/dx = 2x.<\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Differentiation<\u002Fb>  The process used to find the derivative.<\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:28px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  If y = axⁿ then dy/dx = anxⁿ⁻¹. It works for any power, even negative or fractional.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w23.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w23.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:30px;min-height:0;\"><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:36px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w23.o1 }};transform:{{ we.w23.t1 }};transition:opacity .5s, transform .5s;\">a  y = x⁷<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:33px;text-wrap:pretty;opacity:{{ we.w23.o1 }};transform:{{ we.w23.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 7x⁶<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w23.o2 }};transform:{{ we.w23.t2 }};transition:opacity .5s, transform .5s;\">b  y = x⁸<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:33px;text-wrap:pretty;opacity:{{ we.w23.o2 }};transform:{{ we.w23.t2 }};transition:opacity .5s, transform .5s;\">dy/dx = 8x⁷<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w23.o3 }};transform:{{ we.w23.t3 }};transition:opacity .5s, transform .5s;\">c  y = 4x⁵<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:33px;text-wrap:pretty;opacity:{{ we.w23.o3 }};transform:{{ we.w23.t3 }};transition:opacity .5s, transform .5s;\">dy/dx = 4 × 5x⁴ = 20x⁴<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w23.o4 }};transform:{{ we.w23.t4 }};transition:opacity .5s, transform .5s;\">d  y = −6x³<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:33px;text-wrap:pretty;opacity:{{ we.w23.o4 }};transform:{{ we.w23.t4 }};transition:opacity .5s, transform .5s;\">dy/dx = 3 × (−6x²) = −18x²<\u002Fdiv><\u002Fdiv><p style=\"font-size:26px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Writing x² as 2x¹ shows the power has dropped by 1.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Gradient at a point\" data-screen-label=\"67 18.7 Gradient at a point\" data-speaker-notes=\"Worked example 24. The derivative gives the gradient where the x-coordinate is x. Substitute the x-value. Exercise 18.11 question 3 works backwards from a gradient to the point.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 24 · Exercise 18.11 Q3<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Derivatives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.05;margin:0;text-wrap:pretty;\">Substitute x into dy/dx<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:50px;\"><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>WE24<\u002Fb>  Gradient of y = 4x³ at (2, 32).<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:30px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o1 }};transform:{{ we.w24.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 12x²<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o1 }};transform:{{ we.w24.t1 }};transition:opacity .5s, transform .5s;\">multiply by the power, subtract 1<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o2 }};transform:{{ we.w24.t2 }};transition:opacity .5s, transform .5s;\">at x = 2: 12 × 2² = 48<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o2 }};transform:{{ we.w24.t2 }};transition:opacity .5s, transform .5s;\">substitute the x-coordinate<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o2 }};transform:{{ we.w24.t2 }};transition:opacity .5s, transform .5s;\">gradient = 48<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o2 }};transform:{{ we.w24.t2 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q3<\u002Fb>  Where does y = 3x² have gradient 18?<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:30px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o3 }};transform:{{ we.w24.t3 }};transition:opacity .5s, transform .5s;\">dy/dx = 6x<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o3 }};transform:{{ we.w24.t3 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o4 }};transform:{{ we.w24.t4 }};transition:opacity .5s, transform .5s;\">6x = 18 ⇒ x = 3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o4 }};transform:{{ we.w24.t4 }};transition:opacity .5s, transform .5s;\">set the gradient equal to 18<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w24.o4 }};transform:{{ we.w24.t4 }};transition:opacity .5s, transform .5s;\">y = 3(3)² = 27 ⇒ (3, 27)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w24.o4 }};transform:{{ we.w24.t4 }};transition:opacity .5s, transform .5s;\">use the curve for y<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  You always need the x-coordinate. Use dy/dx for gradients and the original equation for y-values.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w24.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w24.reset }}\">Start again<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Sums, differences and special cases\" data-screen-label=\"68 18.7 Sums, differences and special cases\" data-speaker-notes=\"Differentiate each term separately. y = kx differentiates to k, and a constant differentiates to 0 because y = constant is a horizontal line. Brackets must be expanded first.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked examples 25 &amp; 26<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Derivatives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Several terms<\u002Fh2><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:27px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rules<\u002Fb>  y = axᵐ + bxⁿ ⇒ dy/dx = amxᵐ⁻¹ + bnxⁿ⁻¹.<br>y = kx ⇒ dy/dx = k (since x⁰ = 1).<br>y = constant ⇒ dy/dx = 0.<\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Expand brackets before differentiating. Differentiating (2x + 3)² term by term inside the bracket is a common mistake.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w25.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w25.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:32px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w25.o1 }};transform:{{ we.w25.t1 }};transition:opacity .5s, transform .5s;\">y = 4x⁷ + 3x⁶<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:29px;text-wrap:pretty;opacity:{{ we.w25.o1 }};transform:{{ we.w25.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 28x⁶ + 18x⁵<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w25.o2 }};transform:{{ we.w25.t2 }};transition:opacity .5s, transform .5s;\">y = ⁸⁄₃x² − 4x⁵<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:29px;text-wrap:pretty;opacity:{{ we.w25.o2 }};transform:{{ we.w25.t2 }};transition:opacity .5s, transform .5s;\">dy/dx = ¹⁶⁄₃x − 20x⁴<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w25.o3 }};transform:{{ we.w25.t3 }};transition:opacity .5s, transform .5s;\">y = (2x + 3)²<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:29px;text-wrap:pretty;opacity:{{ we.w25.o3 }};transform:{{ we.w25.t3 }};transition:opacity .5s, transform .5s;\">= 4x² + 12x + 9  (expand first)<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w25.o4 }};transform:{{ we.w25.t4 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:29px;text-wrap:pretty;opacity:{{ we.w25.o4 }};transform:{{ we.w25.t4 }};transition:opacity .5s, transform .5s;\">dy/dx = 8x + 12<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Practice: Exercise 18.13\" data-screen-label=\"69 18.7 Practice: Exercise 18.13\" data-speaker-notes=\"The most challenging parts of Exercise 18.13. Parallel means equal gradients; parallel to the x-axis means gradient zero.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.13 · challenging<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Using gradients<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:27px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">Gradient of y = (3x − 2)(4x + 1) at (3, 91).<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">Where is y = 3x² − 4x − 2 parallel to y = −2x + 1?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">6<\u002Fb><span style=\"text-wrap:pretty;\">Where is y = 2x³ − 9x² + 12x parallel to the x-axis?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">7<\u002Fb><span style=\"text-wrap:pretty;\">y = x³ + 3 has two tangents parallel to y = 12x − 1. Find the points.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">8<\u002Fb><span style=\"text-wrap:pretty;\">y = ax³ − 4x + 1 is parallel to y = 50x − 1 at x = 3. a Gradient at x = 4? b Show the tangent at x = −3 is also parallel.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.p1813.o1 }};transform:{{ we.p1813.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:25px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">y = 12x² − 5x − 2, dy/dx = 24x − 5 = 67<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">6x − 4 = −2 ⇒ x = ⅓ ⇒ (⅓, −3⅔)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">6<\u002Fb><span style=\"text-wrap:pretty;\">6x² − 18x + 12 = 0 ⇒ x = 1, 2 ⇒ (1, 5), (2, 4)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:25px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">7<\u002Fb><span style=\"text-wrap:pretty;\">3x² = 12 ⇒ x = ±2 ⇒ (2, 11), (−2, −5)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">8<\u002Fb><span style=\"text-wrap:pretty;\">27a − 4 = 50 ⇒ a = 2. a: 6(16) − 4 = 92. b: 6(9) − 4 = 50 ✓<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.p1813.toggle }}\">{{ we.p1813.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Equation of a tangent\" data-screen-label=\"70 18.7 Equation of a tangent\" data-speaker-notes=\"Worked example 27. Find the equation of the tangent to y = 3x² − 4x + 1 at x = 2. Find the y-coordinate from the curve, the gradient from dy/dx, then use y = mx + c.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 27<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Tangents<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Tangent to y = 3x² − 4x + 1 at x = 2<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:27px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w27.o1 }};transform:{{ we.w27.t1 }};transition:opacity .5s, transform .5s;\">y = 3(2)² − 4(2) + 1 = 5<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w27.o1 }};transform:{{ we.w27.t1 }};transition:opacity .5s, transform .5s;\">the point is (2, 5)<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">dy/dx = 6x − 4 = 8<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">gradient at x = 2<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">5 = 8 × 2 + c ⇒ c = −11<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">substitute (2, 5) into y = 8x + c<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">y = 8x − 11<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w27.o2 }};transform:{{ we.w27.t2 }};transition:opacity .5s, transform .5s;\">equation of the tangent<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Normal<\u002Fb>  The normal is perpendicular to the tangent: its gradient is −1 ÷ (tangent gradient).<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w27.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w27.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w27\" step=\"{{ we.w27.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Practice: Exercise 18.14\" data-screen-label=\"71 18.7 Practice: Exercise 18.14\" data-speaker-notes=\"The most challenging parts of Exercise 18.14: where tangents meet the axes and each other.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.14 · challenging<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Tangent problems<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:27px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1d<\u002Fb><span style=\"text-wrap:pretty;\">Tangent to y = 3x³ − 2x + 1 at x = 1.5.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2<\u002Fb><span style=\"text-wrap:pretty;\">y = 2x² + 3x − 2. The tangent at x = 4 meets the x-axis at A. Find A.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">y = −3x³ + x − 4. The tangent at x = 1 meets the x-axis at A and the y-axis at B. Find the area of triangle OAB.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">4<\u002Fb><span style=\"text-wrap:pretty;\">Tangents to y = x³ − 3x at x = −1 and x = 4 meet at C. Find C.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.p1814.o1 }};transform:{{ we.p1814.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:25px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">1d<\u002Fb><span style=\"text-wrap:pretty;\">point (1.5, 8.125), gradient 18.25 ⇒ y = 18.25x − 19.25<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">2<\u002Fb><span style=\"text-wrap:pretty;\">(4, 42), gradient 19 ⇒ y = 19x − 34 ⇒ A(34/19, 0)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:25px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">(1, −6), gradient −8 ⇒ y = −8x + 2 ⇒ A(¼, 0), B(0, 2) ⇒ area = ½ × ¼ × 2 = ¼<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">4<\u002Fb><span style=\"text-wrap:pretty;\">at x = −1: y = 2 (gradient 0); at x = 4: y = 45x − 128 ⇒ 45x − 128 = 2 ⇒ C(26/9, 2)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.p1814.toggle }}\">{{ we.p1814.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Stationary and turning points\" data-screen-label=\"72 18.7 Stationary and turning points\" data-speaker-notes=\"Earlier you found turning points by completing the square. At the lowest point of y = x² − 4x + 1 the tangent is horizontal, so the gradient is zero. Set dy/dx = 0 and solve.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Turning points<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Stationary points<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Where the gradient is zero<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:34px;\">Stationary point<\u002Fspan><p style=\"font-size:26px;line-height:1.38;margin:0;text-wrap:pretty;\">A point where the gradient is zero. If it is also a maximum or a minimum, it is called a turning point.<\u002Fp><\u002Fdiv><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 2x − 4 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">gradient zero at the turning point<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">x = 2, y = 4 − 8 + 1 = −3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">substitute into the original equation<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">minimum (2, −3)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.stat.o1 }};transform:{{ we.stat.t1 }};transition:opacity .5s, transform .5s;\">check: (x − 2)² − 3 ✓<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.stat.o2 }};transform:{{ we.stat.t2 }};transition:opacity .5s, transform .5s;\">gradient −, 0, +<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.stat.o2 }};transform:{{ we.stat.t2 }};transition:opacity .5s, transform .5s;\">falls, flat, rises: a minimum<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.stat.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.stat.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"stat\" step=\"{{ we.stat.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Maximum or minimum?\" data-screen-label=\"73 18.7 Maximum or minimum?\" data-speaker-notes=\"There are three methods: the shape of the graph, the gradient either side of the turning point, and the second derivative. If the second derivative is positive the gradient is increasing and the point is a minimum; if negative it is a maximum.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Three methods<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Stationary points<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Is it a maximum or a minimum?<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">1 · Shape<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">For y = ax² + bx + c: a &gt; 0 gives ∪ and a minimum; a &lt; 0 gives ∩ and a maximum. A cubic with positive x³ has its maximum on the left and minimum on the right.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">2 · Gradient either side<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">For y = x² − 4x + 1 at x = 2: at x = 1.9 dy/dx = −0.2 (down), at x = 2.1 dy/dx = 0.2 (up). Down then up: a minimum.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">3 · Second derivative<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Differentiate again to get d²y/dx², the rate of change of the gradient. Positive ⇒ minimum. Negative ⇒ maximum. For y = x² − 4x + 1, d²y/dx² = 2 &gt; 0: minimum.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Second derivative<\u002Fb>  d²y/dx², found by differentiating dy/dx. It tells you whether the gradient is increasing or decreasing.<\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Method 3 is usually quickest in the exam. Always state your conclusion with the reason, for example “d²y/dx² = −6 &lt; 0 so (0, 1) is a maximum”.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Worked example 28\" data-screen-label=\"74 18.7 Worked example 28\" data-speaker-notes=\"Worked example 28. Find the two turning points of y = 2x³ − 3x² + 1 and explain which is a maximum and which is a minimum.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 28<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Stationary points<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Turning points of y = 2x³ − 3x² + 1<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:27px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 6x² − 6x = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">gradient zero<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">6x(x − 1) = 0 ⇒ x = 0 or 1<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">factorise<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">(0, 1) and (1, 0)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o1 }};transform:{{ we.w28.t1 }};transition:opacity .5s, transform .5s;\">substitute into y<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">d²y/dx² = 12x − 6<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">differentiate again<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">x = 0: −6 &lt; 0 ⇒ maximum<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">method 3<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">x = 1: +6 &gt; 0 ⇒ minimum<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:24px;text-wrap:pretty;opacity:{{ we.w28.o2 }};transform:{{ we.w28.t2 }};transition:opacity .5s, transform .5s;\">method 3<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Method 2 agrees: at x = −0.1 and 0.1 the gradient is +0.66 then −0.54 (maximum); at 0.9 and 1.1 it is −0.54 then +0.66 (minimum).<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w28.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w28.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w28\" step=\"{{ we.w28.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Sketching cubic functions\" data-screen-label=\"75 18.7 Sketching cubic functions\" data-speaker-notes=\"To sketch y = ax³ + bx² + cx + d you need the basic shape from the sign of a, the y-intercept, the x-intercepts from the factor form, and the turning points from differentiation. Exercise 18.15 question 1m and 2.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.15 · Q1m, Q2<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Sketching<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Sketch y = x(2x² − 21x + 72)<\u002Fh2><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Features<\u002Fb>  shape (sign of a) · y-intercept (x = 0) · x-intercepts (factor form) · turning points (dy/dx = 0)<\u002Fdiv><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:25px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.m15.o1 }};transform:{{ we.m15.t1 }};transition:opacity .5s, transform .5s;\">y = 2x³ − 21x² + 72x<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:22px;text-wrap:pretty;opacity:{{ we.m15.o1 }};transform:{{ we.m15.t1 }};transition:opacity .5s, transform .5s;\">expand; a = 2 &gt; 0<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.m15.o1 }};transform:{{ we.m15.t1 }};transition:opacity .5s, transform .5s;\">dy/dx = 6x² − 42x + 72 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:22px;text-wrap:pretty;opacity:{{ we.m15.o1 }};transform:{{ we.m15.t1 }};transition:opacity .5s, transform .5s;\">x² − 7x + 12 = 0 ⇒ x = 3, 4<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.m15.o2 }};transform:{{ we.m15.t2 }};transition:opacity .5s, transform .5s;\">(3, 81) maximum, (4, 80) minimum<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:22px;text-wrap:pretty;opacity:{{ we.m15.o2 }};transform:{{ we.m15.t2 }};transition:opacity .5s, transform .5s;\">d²y/dx² = 12x − 42: −6 at 3, +6 at 4<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.m15.o2 }};transform:{{ we.m15.t2 }};transition:opacity .5s, transform .5s;\">only x-intercept (0, 0)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:22px;text-wrap:pretty;opacity:{{ we.m15.o2 }};transform:{{ we.m15.t2 }};transition:opacity .5s, transform .5s;\">2x² − 21x + 72 has b² − 4ac = 441 − 576 &lt; 0<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Q1 answers: h (−2, 15) max, (2, −17) min · i (0, 3) min, (4, 35) max · n y = x²(3 − x): (0, 0) min, (2, 4) max.<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.m15.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.m15.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"m15\" step=\"{{ we.m15.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.7 Apply: maxima and minima\" data-screen-label=\"76 18.7 Apply: maxima and minima\" data-speaker-notes=\"Exercise 18.15 questions 3, 4 and 5. The letters change but the method is the same: differentiate, set equal to zero, solve and check.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.15 · Q3–5<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.7 · Apply<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Optimisation problems<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:25px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">h = 7t − 5t². Find dh/dt and the greatest height.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">4<\u002Fb><span style=\"text-wrap:pretty;\">p = d³ − 12d² + 45d (thousand). Highest population in the first four days?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">Box from a 2 m × 1 m sheet, x m squares cut from the corners. a Show V = x(2 − 2x)(1 − 2x). b Why x &lt; 0.5? c x for maximum volume.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.box.o1 }};transform:{{ we.box.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:23px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\
