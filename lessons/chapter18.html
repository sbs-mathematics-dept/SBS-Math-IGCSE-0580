y:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2a<\u002Fb><span style=\"text-wrap:pretty;\">Use y = 10ˣ to find 10^0.3 and 10^−0.1.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2b<\u002Fb><span style=\"text-wrap:pretty;\">Draw a line to solve 10ˣ = 8 − 5x.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">P = 2ᵗ: after 1 hour? When over 40? After 6 hours? When over one million?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">Bedbugs: 1000, 2000, 4000, … each month. When 10 000? After 6 months?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.exp10.o1 }};transform:{{ we.exp10.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Read up from x = 0.3.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.exp10.o2 }};transform:{{ we.exp10.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Draw y = 8 − 5x and read the crossing.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.exp10A.o1 }};transform:{{ we.exp10A.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">2a<\u002Fb><span style=\"text-wrap:pretty;\">10^0.3 ≈ 2;  10^−0.1 ≈ 0.8<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">2b<\u002Fb><span style=\"text-wrap:pretty;\">x ≈ 0.67<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">3<\u002Fb><span style=\"text-wrap:pretty;\">2 cells; t ≈ 5.3 h; 64; 2²⁰ ≈ 1 048 576, so about 20 hours<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">about 3.3 months; 64 000<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.exp10.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.exp10A.toggle }}\">{{ we.exp10A.label }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"exp10\" step=\"{{ we.exp10.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.5 Sketching y = abˣ + q\" data-screen-label=\"55 18.5 Sketching y = abˣ + q\" data-speaker-notes=\"Exercise 18.9 question 6, Investigation. In the standard form y = a b to the x plus q, the asymptote is y = q and the y-intercept is a + q.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Investigation · Q6<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.5 · Exponentials<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.05;margin:0;text-wrap:pretty;\">Sketching y = abˣ + q<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Asymptote<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">The horizontal line y = q. The graph never crosses it.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">y-intercept<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">Put x = 0: b⁰ = 1, so y = a + q.<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Direction<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\">a &gt; 0: the curve is above the asymptote. a &lt; 0: it is below and falls to the right for b &gt; 1.<\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>b<\u002Fb>  Sketch and label:  i  y = −3ˣ   ii  y = 3ˣ − 4   iii  y = −2ˣ + 1<\u002Fp><div style=\"opacity:{{ we.abq.o1 }};transform:{{ we.abq.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:26px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">i<\u002Fb><span style=\"text-wrap:pretty;\">asymptote y = 0, y-intercept (0, −1); below the x-axis, falling to the right<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">ii<\u002Fb><span style=\"text-wrap:pretty;\">asymptote y = −4, y-intercept (0, −3); rising to the right, crosses the x-axis near x = 1.26<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">iii<\u002Fb><span style=\"text-wrap:pretty;\">asymptote y = 1, y-intercept (0, 0); below the asymptote, falling to the right<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.abq.toggle }}\">{{ we.abq.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.5 Quick check\" data-screen-label=\"56 18.5 Quick check\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Quick check<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.5 · Other graphs<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Check your understanding<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 17<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">Find y when x = −2 for y = x³ − 4x + 1.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q16.val }}\" sc-camel-on-input=\"{{ qz.q16.onInput }}\" sc-camel-on-key-down=\"{{ qz.q16.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q16.check }}\">Check
