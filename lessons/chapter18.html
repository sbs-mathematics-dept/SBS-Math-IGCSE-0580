s;\">[2] where y = 0<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq3.o5 }};transform:{{ we.pq3.t5 }};transition:opacity .5s, transform .5s;\">d  gradient ≈ 8.75 ÷ 1.4 ≈ 6.3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:21px;text-wrap:pretty;opacity:{{ we.pq3.o5 }};transform:{{ we.pq3.t5 }};transition:opacity .5s, transform .5s;\">[4] tangent at x = 1 (accept a range)<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:23px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Calculus check for d: dy/dx = x²/4 + 6/x² = 6.25 at x = 1. In the exam you must draw the tangent, but this tells you if your estimate is sensible.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq3.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq3.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"pq3\" step=\"{{ we.pq3.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Practice Q4 &amp; Q5: match and model\" data-screen-label=\"82 Practice Q4 &amp; Q5: match and model\" data-speaker-notes=\"Practice question 4 matches equations to six sketches. Question 5 is an exponential decay model, M = 160 over 2 to the t.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Practice questions 4 &amp; 5<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Exam practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.05;margin:0;text-wrap:pretty;\">Recognise graphs; model decay<\u002Fh2><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q4<\u002Fb>  Match: a y = 1 + x − 2x²  b y = 3ˣ  c y = x³ + x² + 1  d y = −16/x²   [8]<\u002Fp><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q5<\u002Fb>  M = 160/2ᵗ. i Find p, q, r for t = 0, 4, 6 [2]. ii Draw M against t [4]. iii Tangent at t = 2 for the rate of change [3]. b The other chemical has m = 160 − M. When are the masses equal? [4]<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:24px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq5.o1 }};transform:{{ we.pq5.t1 }};transition:opacity .5s, transform .5s;\">p = 160, q = 10, r = 2.5<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:21px;text-wrap:pretty;opacity:{{ we.pq5.o1 }};transform:{{ we.pq5.t1 }};transition:opacity .5s, transform .5s;\">substitute<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq5.o2 }};transform:{{ we.pq5.t2 }};transition:opacity .5s, transform .5s;\">plot and join smoothly<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:21px;text-wrap:pretty;opacity:{{ we.pq5.o2 }};transform:{{ we.pq5.t2 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq5.o3 }};transform:{{ we.pq5.t3 }};transition:opacity .5s, transform .5s;\">rate ≈ −61 ÷ 2.2 ≈ −28 g/min<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:21px;text-wrap:pretty;opacity:{{ we.pq5.o3 }};transform:{{ we.pq5.t3 }};transition:opacity .5s, transform .5s;\">tangent at t = 2<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq5.o4 }};transform:{{ we.pq5.t4 }};transition:opacity .5s, transform .5s;\">M = 160 − M ⇒ M = 80 ⇒ t = 1<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:21px;text-wrap:pretty;opacity:{{ we.pq5.o4 }};transform:{{ we.pq5.t4 }};transition:opacity .5s, transform .5s;\">where the curves cross<\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.pq4.o1 }};transform:{{ we.pq4.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">Q4<\u002Fb><span style=\"text-wrap:pretty;\">a vi (∩ parabola) · b ii (exponential) · c i (cubic) · d iv (both branches below the x-axis)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq5.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq4.toggle olumn;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\"><\u002Fb><span style=\"text-wrap:pretty;\">y = (x + 6)/3<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\"><\u002Fb><span style=\"text-wrap:pretty;\">6x² − 9x − 3 = x + 6<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\"><\u002Fb><span style=\"text-wrap:pretty;\">6x² − 10x − 9 = 0<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\"><\u002Fb><span style=\"text-wrap:pretty;\">x = (10 ± √316)/12<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\"><\u002Fb><span style=\"text-wrap:pretty;\">(2.31, 2.77), (−0.65, 1.78)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;min-height:0;\"><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q7<\u002Fb>  y = 3x² + 6x − 1<br>a a(x + p)² + q [3]<br>b line of symmetry [1]<br>c minimum point [1]<\u002Fp><div style=\"opacity:{{ we.pq6.o1 }};transform:{{ we.pq6.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">3(x + 1)² − 4<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">x = −1<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">(−1, −4)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;min-height:0;\"><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q8<\u002Fb>  y = 3x² + 2x + 1<br>a y at x = 2 [2]  b dy/dx [2]<br>c gradient at x = 2 [2]<br>d tangent at x = 2 [3]<br>e where it meets the x-axis [2]<\u002Fp><div style=\"opacity:{{ we.pq6.o1 }};transform:{{ we.pq6.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">17<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">6x + 2<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">14<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">  (x − 3)² at the point with x-coordinate 5.<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o1 }};transform:{{ we.pq9.t1 }};transition:opacity .5s, transform .5s;\">y = (5 − 3)² = 4<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o1 }};transform:{{ we.pq9.t1 }};transition:opacity .5s, transform .5s;\">point (5, 4)<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o2 }};transform:{{ we.pq9.t2 }};transition:opacity .5s, transform .5s;\">dy/dx = 2(x − 3) = 4<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o2 }};transform:{{ we.pq9.t2 }};transition:opacity .5s, transform .5s;\">expand: x² − 6x + 9 ⇒ 2x − 6<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o3 }};transform:{{ we.pq9.t3 }};transition:opacity .5s, transform .5s;\">normal gradient = −¼<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o3 }};transform:{{ we.pq9.t3 }};transition:opacity .5s, transform .5s;\">−1 ÷ 4<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o4 }};transform:{{ we.pq9.t4 }};transition:opacity .5s, transform .5s;\">y − 4 = −¼(x − 5) ⇒ x + 4y = 21<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o4 }};transform:{{ we.pq9.t4 }};transition:opacity .5s, transform .5s;\">equation of the normal<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q10<\u002Fb>  Perimeter 4a; sides x and y.  a y in terms of x [2]  b area [1]  c show the maximum area is a square [4]<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o5 }};transform:{{ we.pq9.t5 }};transition:opacity .5s, transform .5s;\">2x + 2y = 4a ⇒ y = 2a − x<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o5 }};transform:{{ we.pq9.t5 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o6 }};transform:{{ we.pq9.t6 }};transition:opacity .5s, transform .5s;\">A = x(2a − x) = 2ax − x²<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o6 }};transform:{{ we.pq9.t6 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o7 }};transform:{{ we.pq9.t7 }};transition:opacity .5s, transform .5s;\">dA/dx = 2a − 2x = 0 ⇒ x = a<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o7 }};transform:{{ we.pq9.t7 }};transition:opacity .5s, transform .5s;\">then y = 2a − a = a<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.pq9.o8 }};transform:{{ we.pq9.t8 }};transition:opacity .5s, transform .5s;\">d²A/dx² = −2 &lt; 0 ⇒ maximum; x = y, a square<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.pq9.o8 }};transform:{{ we.pq9.t8 }};transition:opacity .5s, transform .5s;\">state the conclusion<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq9.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.pq9.reset }}\">Start again<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Exam checklist\" data-screen-label=\"85 Exam checklist\" data-speaker-notes=\"The summary from the end of the chapter as a checklist. Before the exam make sure you can do each of these, then use the self-assessment questions on your practice answers.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Summary<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Are you able to…<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Exam checklist<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">construct a table of values for quadratic and reciprocal equations<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">plot a parabola from a table of values<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">sketch a parabola using its characteristics<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find turning points by completing the square<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">plot a hyperbola from a table of values<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">use quadratic graphs to solve equations<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">draw cubic graphs and sums of linear and non-linear terms<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">draw the graph of an exponential equation<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">sketch cubic, reciprocal and exponential functions<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">use cubic graphs to solve equations<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">estimate a gradient by drawing a tangent<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">differentiate functions of the form axⁿ<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find the equation of a tangent to a curve<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find turning points and decide if they are maximum or minimum points<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Self-check after every practice paper: Did I follow the instructions? Was my work clear and organised? Did I use my calculator efficiently? Could I interpret results in context? If I made mistakes, can I see what I did wrong?<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Well done\" data-screen-label=\"86 Well done\" data-speaker-notes=\"Closing slide. You can now plot and sketch parabolas, hyperbolas, cubics and exponentials, solve equations with graphs, estimate gradients with tangents, and use differentiation to find gradients, tangents and turning points.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent);padding:100px 120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;\">\n<div style=\"position:absolute;right:-160px;top:-180px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-400);\"><\u002Fdiv>\n<div style=\"position:absolute;right:300px;bottom:-240px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-600);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\">Chapter 18 complete<\u002Fspan>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:24px;max-width:1150px;\"><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:150px;line-height:1.05;margin:0;\">Well done!<\u002Fh2><p style=\"font-size:38px;line-height:1.4;margin:0;text-wrap:pretty;\">You can now draw and sketch curved graphs, solve equations with them, estimate gradients with tangents and use differentiation to find tangents and turning points.<\u002Fp><\u002Fdiv>\n<span style=\"position:relative;font-size:26px;\">Cambridge IGCSE™ Mathematics 0580 · Chapter 18 · Curved graphs<\u002Fspan>\n<\u002Fsection>\n\n<\u002Fx-import>\n<a data-nav=\"\" href=\"../chapters.html\" style=\"position:fixed;top:clamp(6px,0.9vw,18px);left:clamp(6px,0.9vw,18px);z-index:2147483600;display:flex;align-items:center;gap:clamp(4px,0.5vw,10px);padding:clamp(6px,0.6vw,12px) clamp(12px,1.25vw,24px) clamp(6px,0.6vw,12px) clamp(8px,0.9vw,18px);opacity:.75;border-radius:999px;background:color-mix(in oklch, var(--color-bg) 55%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);font-family:var(--font-body);font-weight:800;font-size:clamp(12px,0.95vw,18px);text-decoration:none;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:1.2em;height:1.2em;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>All chapters<\u002Fa>\n<button data-nav=\"\" aria-label=\"Previous slide\" sc-camel-on-click=\"{{ prevSlide }}\" style=\"position:fixed;left:clamp(6px,0.9vw,18px);top:50%;transform:translateY(-50%);z-index:2147483600;width:clamp(40px,3.6vw,72px);height:clamp(40px,3.6vw,72px);opacity:.75;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:50%;height:50%;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button data-nav=\"\" aria-label=\"Next slide\" sc-camel-on-click=\"{{ nextSlide }}\" style=\"position:fixed;right:clamp(6px,0.9vw,18px);top:50%;transform:translateY(-50%);z-index:2147483600;width:clamp(40px,3.6vw,72px);height:clamp(40px,3.6vw,72px);opacity:.75;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:50%;height:50%;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst STEPS = {\"penA\":1,\"pen\":5,\"x2\":6,\"sym\":3,\"fam\":5,\"matchA\":1,\"match\":1,\"w1\":8,\"w2\":8,\"fount\":3,\"fountA\":1,\"sk\":6,\"w5\":6,\"w6\":6,\"w7\":5,\"p183\":1,\"bridgeA\":1,\"bridge\":3,\"r6\":5,\"r12\":4,\"w9\":4,\"p184\":1,\"inv\":1,\"s1\":3,\"w10\":3,\"sl\":2,\"p5\":3,\"p5A\":1,\"w11\":3,\"w12\":2,\"w13\":6,\"w14\":6,\"nosol\":1,\"p186\":1,\"w16\":8,\"w17\":5,\"q3c\":3,\"q3cA\":1,\"w19\":3,\"w20\":4,\"exp10\":2,\"exp10A\":1,\"abq\":1,\"tanhow\":4,\"w21\":4,\"tree\":3,\"p1810\":1,\"w23\":4,\"w24\":4,\"w25\":4,\"p1813\":1,\"w27\":2,\"p1814\":1,\"stat\":2,\"w28\":2,\"m15\":2,\"box\":2,\"pq1A\":1,\"pq1\":3,\"pq2\":1,\"pq3\":5,\"pq5\":4,\"pq4\":1,\"pq6\":1,\"pq9\":8};\nconst QUIZ = [\"15\",\"3\",\"2, 3\",\"0.5\",\"-7\",\"-2\",\"-3, 3\",\"-2\",\"-2\",\"-1.5\",\"4\",\"-4\",\"2, -1\",\"-1, 2\",\"-2, -3\",\"0\",\"1\",\"4\",\"2\",\"4\",\"-3\",\"12\",\"19\",\"5\",\"6, -9\"];\nconst nums = s => (String(s || '').replace(/[−–]/g, '-').match(/-?\\d+(?:\\.\\d+)?/g) || []).map(Number);\nfunction isRight(v, ans) { const a = nums(ans).sort((x, y) => x - y), u = nums(v).sort((x, y) => x - y); if (!u.length) return null; return u.length === a.length && a.every((x, i) => Math.abs(x - u[i]) < 0.051); }\nconst fm = v => String(+(+v).toFixed(2)).replace('-', '−');\nfunction eqStr(terms) { let s = ''; terms.forEach(([k, t]) => { if (k === 0) return; const mag = Math.abs(k), c = (mag === 1 && t) ? '' : fm(mag); s += s ? (k < 0 ? ' − ' : ' + ') + c + t : (k < 0 ? '−' : '') + c + t; }); return 'y = ' + (s || '0'); }\nclass Component extends DCLogic {\n  state = { st: {}, qv: {}, qr: {}, a: 1, b: 2, c: -3, ra: 6, rq: 0, tx: 1 };\n  setStep(k, v) { this.setState(p => ({ st: { ...p.st, [k]: v } })); }\n  renderVals() {\n    const S = this.state, we = {};\n    for (const k in STEPS) {\n      const n = STEPS[k], s = S.st[k] || 0;\n      const o = { step: s, next: () => this.setStep(k, Math.min(n, s + 1)), reset: () => this.setStep(k, 0), toggle: () => this.setStep(k, s ? 0 : n), label: s ? 'Hide the answers' : 'Reveal the answers' };\n      for (let i = 1; i <= n; i++) { o['o' + i] = s >= i ? 1 : 0; o['t' + i] = s >= i ? 'none' : 'translateY(14px)'; }\n      we[k] = o;\n    }\n    const qz = {};\n    QUIZ.forEach((ans, i) => {\n      const r = S.qr[i];\n      const check = () => this.setState(p => { const res = isRight(p.qv[i], ans); return { qr: { ...p.qr, [i]: res === true ? 'ok' : res === null ? 'empty' : 'no' } }; });\n      qz['q' + i] = { val: S.qv[i] || '', check,\n        onInput: e => { const v = e.target.value; this.setState(p => ({ qv: { ...p.qv, [i]: v }, qr: { ...p.qr, [i]: undefined } })); },\n        onKey: e => { e.stopPropagation(); if (e.key === 'Enter') check(); },\n        show: () => this.setState(p => ({ qr: { ...p.qr, [i]: 'show' } })),\n        fb: r === 'ok' ? '✓ Correct!' : r === 'no' ? '✗ Not quite — try again' : r === 'empty' ? 'Type an answer first' : r === 'show' ? 'Answer: ' + ans.replace(/-/g, '−') : '',\n        fbCol: r === 'ok' || r === 'show' ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)' };\n    });\n    const { a, b, c } = S;\n    let qi = 'a = 0 gives a straight line, not a parabola.';\n    if (a !== 0) { const xv = -b / (2 * a), yv = a * xv * xv + b * xv + c; qi = `Axis of symmetry x = −b/2a = ${fm(xv)}. ${a > 0 ? 'Minimum' : 'Maximum'} (${fm(xv)}, ${fm(yv)}).`; }\n    const tq = { a, b, c, eq: eqStr([[a, 'x²'], [b, 'x'], [c, '']]), val: `${a},${b},${c}`, info: qi,\n      onA: e => this.setState({ a: Number(e.target.value) }), onB: e => this.setState({ b: Number(e.target.value) }), onC: e => this.setState({ c: Number(e.target.value) }) };\n    const ra = S.ra, rq = S.rq;\n    const tr = { a: ra, q: rq, val: `${ra},${rq}`, eq: 'y = ' + (ra === 0 ? '0' : fm(ra) + '/x') + (rq ? (rq < 0 ? ' − ' : ' + ') + fm(Math.abs(rq)) : ''),\n      info: ra === 0 ? 'a = 0 gives the straight line y = q.' : `Asymptotes x = 0 and y = ${fm(rq)}. ` + (rq ? `x-intercept at x = −a/q = ${fm(-ra / rq)}.` : 'No x-intercept: the x-axis is an asymptote.'),\n      onA: e => this.setState({ ra: Number(e.target.value) }), onQ: e => this.setState({ rq: Number(e.target.value) }) };\n    const tt = { x: S.tx, g: fm(2 * S.tx), onX: e => this.setState({ tx: Number(e.target.value) }) };\n    const deck = () => document.querySelector('deck-stage');\n    return { we, qz, tq, tr, tt, prevSlide: () => deck() && deck().prev(), nextSlide: () => deck() && deck().next() };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
