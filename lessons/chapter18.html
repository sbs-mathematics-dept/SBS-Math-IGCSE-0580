:var(--color-neutral-700);\">The two highest points are equal (6 at x = 0 and x = 1), so the top of the curve is between them at x = 0.5. Do not draw a flat top.<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w2.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w2.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w2\" step=\"{{ we.w2.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Exam coach: drawing a curve\" data-screen-label=\"15 18.1 Exam coach: drawing a curve\" data-speaker-notes=\"Exam technique for plotting curves. These are the common ways marks are lost on the Paper 4 graph question.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam coach<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Plotting<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Getting full marks when you plot a curve<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Do<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><span>✓ Use a sharp pencil and small neat crosses.<\u002Fspan><span>✓ Plot every point within half a small square.<\u002Fspan><span>✓ Draw one smooth curve through all the points in one stroke.<\u002Fspan><span>✓ Let the curve turn smoothly between the two middle points.<\u002Fspan><span>✓ Label the curve with its equation.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-700);\">Don’t<\u002Fspan><div style=\"font-size:27px;line-height:1.4;text-wrap:pretty;\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><span>✗ Join points with a ruler: curves are never straight segments.<\u002Fspan><span>✗ Draw a flat bottom between two equal y-values.<\u002Fspan><span>✗ Extend the curve beyond the x-values asked for.<\u002Fspan><span>✗ Draw a thick or double (feathered) line.<\u002Fspan><span>✗ Forget negative signs: (−2)² = 4, but −(−2)² = −4.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:27px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Before drawing axes, check the smallest and largest y-values in your table so the scale fits. If a value looks out of line with its neighbours, recalculate it before plotting.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Apply: the fountain\" data-screen-label=\"16 18.1 Apply: the fountain\" data-speaker-notes=\"Exercise 18.2 question 6, Apply your skills. The graph shows the height of a water arc from a fountain. Read the answers from the graph.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.2 · Q6<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Interpreting<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">How high does the water rise?<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:26px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">What was the greatest height reached?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">How long did it take to reach the greatest height?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">For how long was the arc above 2.5 m?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">How far did the water rise in the first second?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">Why does the graph only show positive heights?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.fount.o1 }};transform:{{ we.fount.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Find the turning point.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.fount.o2 }};transform:{{ we.fount.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the line h = 2.5 and read both crossings.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.fount.o3 }};transform:{{ we.fount.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Read up from t = 1.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.fountA.o1 }};transform:{{ we.fountA.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">6 m<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">2 seconds<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">from about 0.5 s to 3.5 s, so about 3 s<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">4.5 m<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">The water cannot go below the pool surface; it lands at h = 0.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.fount.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.fountA.toggle }}\">{{ we.fountA.label }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"fount\" step=\"{{ we.fount.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Sketching y = ax² + c\" data-screen-label=\"17 18.1 Sketching y = ax² + c\" data-speaker-notes=\"Sketching quadratic functions. A sketch shows the general features of the graph but it is not plotted on graph paper. Worked example 3 is y = 2x² and worked example 4 is y = −x² + 4.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked examples 3 &amp; 4<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Sketching<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Sketching without a table<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o1 }};transform:{{ we.sk.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Sign of a: +2, so ∪ shaped.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o2 }};transform:{{ we.sk.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">No constant, so it passes through the origin. That is the only x-intercept, so find another point: x = 1 gives y = 2(1)² = 2.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o3 }};transform:{{ we.sk.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Sketch and label y = 2x².<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o4 }};transform:{{ we.sk.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">y = −x² + 4: a = −1 so ∩ shaped.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o5 }};transform:{{ we.sk.t5 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">5<\u002Fspan><span style=\"text-wrap:pretty;\">y-intercept (0, 4). x-intercepts: −x² + 4 = 0 ⇒ x² = 4 ⇒ x = ±2.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:24px;line-height:1.35;opacity:{{ we.sk.o6 }};transform:{{ we.sk.t6 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:26px;color:var(--color-accent-2-700);min-width:26px;\">6<\u002Fspan><span style=\"text-wrap:pretty;\">Sketch through (−2, 0), (0, 4), (2, 0) and label.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:24px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  Graphs of y = ax² + c are symmetrical about the y-axis and the turning point is on the y-axis, at (0, c).<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.sk.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.sk.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-rows:1fr 1fr;gap:22px;min-height:0;\"><div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:14px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"sk3\" step=\"{{ we.sk.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:14px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"sk4\" step=\"{{ we.sk.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Turning point: x = −b/2a\" data-screen-label=\"18 18.1 Turning point: x = −b/2a\" data-speaker-notes=\"When the equation is in standard form y = ax² + bx + c, the axis of symmetry is x = −b over 2a. This gives the x-coordinate of the turning point. Substitute to find the y-coordinate, which is the minimum or maximum value. Worked example 5: y = x² + 2x − 3.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 5<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Sketching<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Sketch y = x² + 2x − 3<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o1 }};transform:{{ we.w5.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">x² is positive, so ∪ shaped.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o2 }};transform:{{ we.w5.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">y-intercept: x = 0 gives (0, −3).<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o3 }};transform:{{ we.w5.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">x-intercepts: x² + 2x − 3 = 0 ⇒ (x + 3)(x − 1) = 0 ⇒ x = −3 or 1.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o4 }};transform:{{ we.w5.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">Axis of symmetry: x = −b/2a = −2/2(1) = −1.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o5 }};transform:{{ we.w5.t5 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">5<\u002Fspan><span style=\"text-wrap:pretty;\">Substitute x = −1: y = 1 − 2 − 3 = −4. Turning point (−1, −4).<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:25px;line-height:1.35;opacity:{{ we.w5.o6 }};transform:{{ we.w5.t6 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-2-700);min-width:26px;\">6<\u002Fspan><span style=\"text-wrap:pretty;\">Draw a smooth ∪ through all the features and label it.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Minimum<\u002Fb>  The lowest value of y on the graph, at a ∪-shaped turning point.<\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:26px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Maximum<\u002Fb>  The highest value of y on the graph, at a ∩-shaped turning point.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w5.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w5.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w5\" step=\"{{ we.w5.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Worked example 6\" data-screen-label=\"19 18.1 Worked example 6\" data-speaker-notes=\"Worked example 6. Sketch y = −2x² − 4x + 6. a is negative so the graph is a hill shape and the turning point is a maximum.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 6<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Sketching<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Sketch y = −2x² − 4x + 6<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o1 }};transform:{{ we.w6.t1 }};transition:opacity .5s, transform .5s;\">a = −2<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o1 }};transform:{{ we.w6.t1 }};transition:opacity .5s, transform .5s;\">∩ shaped<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o2 }};transform:{{ we.w6.t2 }};transition:opacity .5s, transform .5s;\">y-intercept (0, 6)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o2 }};transform:{{ we.w6.t2 }};transition:opacity .5s, transform .5s;\">put x = 0<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">−2x² − 4x + 6 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">x-intercepts: y = 0<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">x² + 2x − 3 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">divide by −2<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">(x − 1)(x + 3) = 0 ⇒ x = 1, −3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o3 }};transform:{{ we.w6.t3 }};transition:opacity .5s, transform .5s;\">factorise and solve<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o4 }};transform:{{ we.w6.t4 }};transition:opacity .5s, transform .5s;\">x = −b/2a = 4/2(−2) = −1<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o4 }};transform:{{ we.w6.t4 }};transition:opacity .5s, transform .5s;\">axis of symmetry<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o5 }};transform:{{ we.w6.t5 }};transition:opacity .5s, transform .5s;\">y = −2(−1)² − 4(−1) + 6 = 8<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o5 }};transform:{{ we.w6.t5 }};transition:opacity .5s, transform .5s;\">substitute x = −1<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o5 }};transform:{{ we.w6.t5 }};transition:opacity .5s, transform .5s;\">Maximum (−1, 8)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o5 }};transform:{{ we.w6.t5 }};transition:opacity .5s, transform .5s;\">a is negative<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w6.o6 }};transform:{{ we.w6.t6 }};transition:opacity .5s, transform .5s;\">Sketch and label<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w6.o6 }};transform:{{ we.w6.t6 }};transition:opacity .5s, transform .5s;\">all important features<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Dividing by the common factor −2 makes factorising easier, but use the original equation when you substitute to find y.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w6.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w6.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w6\" step=\"{{ we.w6.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Completing the square\" data-screen-label=\"20 18.1 Completing the square\" data-speaker-notes=\"You can find the turning point algebraically by completing the square. Write y = ax² + bx + c in the form a(x + p)² + q. The turning point is (−p, q). Worked example 7: y = x² − 8x + 13.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 7<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Completing the square<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:pretty;\">Turning point of y = x² − 8x + 13<\u002Fh2><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;\">In the form y = a(x + p)² + q the turning point is (−p, q). A square is never negative, so (x + 2)² − 9 has least value −9 when x = −2.<\u002Fp><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w7.o1 }};transform:{{ we.w7.t1 }};transition:opacity .5s, transform .5s;\">y = (x − 4)² − 16 + 13<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w7.o1 }};transform:{{ we.w7.t1 }};transition:opacity .5s, transform .5s;\">half of −8 is −4; (x − 4)² = x² − 8x + 16, so subtract 16<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w7.o2 }};transform:{{ we.w7.t2 }};transition:opacity .5s, transform .5s;\">y = (x − 4)² − 3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w7.o2 }};transform:{{ we.w7.t2 }};transition:opacity .5s, transform .5s;\">turning point (4, −3); axis x = 4<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w7.o3 }};transform:{{ we.w7.t3 }};transition:opacity .5s, transform .5s;\">y-intercept (0, 13)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w7.o3 }};transform:{{ we.w7.t3 }};transition:opacity .5s, transform .5s;\">from the original equation<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w7.o4 }};transform:{{ we.w7.t4 }};transition:opacity .5s, transform .5s;\">(x − 4)² = 3 ⇒ x = 4 ± √3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w7.o4 }};transform:{{ we.w7.t4 }};transition:opacity .5s, transform .5s;\">x = 5.7 or 2.3 (a + and a − root)<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w7.o5 }};transform:{{ we.w7.t5 }};transition:opacity .5s, transform .5s;\">Sketch and label<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w7.o5 }};transform:{{ we.w7.t5 }};transition:opacity .5s, transform .5s;\">∪ through all four features<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w7.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w7.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w7\" step=\"{{ we.w7.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Try it: y = ax² + bx + c\" data-screen-label=\"21 18.1 Try it: y = ax² + bx + c\" data-speaker-notes=\"Interactive. Change a, b and c. The axis of symmetry x = −b/2a and the turning point update live. Notice the y-intercept is always c, and the sign of a decides between a minimum and a maximum.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Try it<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Parabolas<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Change a, b and c<\u002Fh2><div style=\"font-family:var(--font-heading);font-size:46px;\">{{ tq.eq }}<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:700;color:var(--color-neutral-700);\">a = {{ tq.a }}<\u002Fspan><input type=\"range\" min=\"-3\" max=\"3\" step=\"0.5\" value=\"{{ tq.a }}\" sc-camel-on-input=\"{{ tq.onA }}\" style=\"width:100%;height:34px;accent-color:var(--color-accent);\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:700;color:var(--color-neutral-700);\">b = {{ tq.b }}<\u002Fspan><input type=\"range\" min=\"-6\" max=\"6\" step=\"1\" value=\"{{ tq.b }}\" sc-camel-on-input=\"{{ tq.onB }}\" style=\"width:100%;height:34px;accent-color:var(--color-accent);\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:700;color:var(--color-neutral-700);\">c = {{ tq.c }}<\u002Fspan><input type=\"range\" min=\"-6\" max=\"6\" step=\"1\" value=\"{{ tq.c }}\" sc-camel-on-input=\"{{ tq.onC }}\" style=\"width:100%;height:34px;accent-color:var(--color-accent);\"><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:18px 26px;font-size:28px;line-height:1.45;text-wrap:pretty;\">{{ tq.info }}<\u002Fdiv><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">The y-intercept is always (0, c). Positive a gives a minimum, negative a a maximum.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"tryq\" value=\"{{ tq.val }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Practice: axis and turning point\" data-screen-label=\"22 18.1 Practice: axis and turning point\" data-speaker-notes=\"The most challenging parts of Exercise 18.3. Question 2: find the axis of symmetry and the turning point. Question 3: Nadia sketched graphs without labels; work out each equation from the features shown.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 18.3 · challenging<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.1 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Turning points and equations from sketches<\u002Fh2><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;\"><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q2<\u002Fb>  Give the axis of symmetry and the turning point.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:8px;font-size:28px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">y = 4 − 2(x + 3)²<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">f<\u002Fb><span style=\"text-wrap:pretty;\">y = 5 − 8x + 2x²<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">g<\u002Fb><span style=\"text-wrap:pretty;\">y = 1 + 2x − 2x²<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">h<\u002Fb><span style=\"text-wrap:pretty;\">y = −(x + 2)² − 1<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;min-height:0;\"><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\"><b>Q3<\u002Fb>  Find the equation of each of Nadia’s sketches.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:8px;font-size:27px;line-height:1.38;\"><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">∩ shape, x-intercepts −5 and 1, y-intercept 5<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">∩ shape, x-intercepts −2 and 2, y-intercept 4<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">∪ shape, x-intercepts −1 and 4, y-intercept −4<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">∪ shape, x-intercepts −1 and 3, y-intercept −3<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.p183.o1 }};transform:{{ we.p183.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:26px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">x = −3; maximum (−3, 4)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">f<\u002Fb><span style=\"text-wrap:pretty;\">2(x − 2)² − 3: x = 2; minimum (2, −3)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">g<\u002Fb><span style=\"text-wrap:pretty;\">x = −2/2(−2) = 0.5; maximum (0.5, 1.5)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">h<\u002Fb><span style=\"text-wrap:pretty;\">x = −2; maximum (−2, −1)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:26px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">y = −(x + 5)(x − 1) = −x² − 4x + 5<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">y = 4 − x²<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">y = (x + 1)(x − 4) = x² − 3x − 4<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">y = (x + 1)(x − 3) = x² − 2x − 3<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.p183.toggle }}\">{{ we.p183.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.1 Apply: the bridge arch\" data-screen-label=\"23 18.1 Apply: the bridge arch\" data-speaker-notes=\"Exercise 18.3 question 4. ues.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">What is the width of the arch?<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">f<\u002Fb><span style=\"text-wrap:pretty;\">What is the maximum height of the arch?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.bridgeA.o1 }};transform:{{ we.bridgeA.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:24px;line-height:1.4;\"><b style=\"font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">(20, 0), a maximum<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">0 ⩽ x ⩽ 40 (the arch meets the banks at h = −10)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">−10 ⩽ h ⩽ 0<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">see the graph<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">e<\u002Fb><span style=\"text-wrap:pretty;\">40 m<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;alig reciprocal graphs (the hyperbola)\" data-speaker-notes=\"Lesson 18.2. Equations of the form y = a over x are reciprocal equations. Their graphs are hyperbolas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 18.2<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Drawing reciprocal graphs (the hyperbola)<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">construct a table of values to draw graphs called hyperbolas<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find the asymptotes of a reciprocal graph<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">sketch graphs of the form y = a/x + q<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.2 y = 6/x\" data-screen-label=\"26 18.2 y = 6/x\" data-speaker-notes=\"Here is a table of values for y = 6 over x. There is no value for x = 0, so the graph is in two separate parts. Include at least five negative and five positive values of x.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.2 · Hyperbolas<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Plotting y = 6/x<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:34px;\">Hyperbola<\u002Fspan><p style=\"font-size:26px;line-height:1.38;margin:0;text-wrap:pretty;\">The graph of a reciprocal equation y = a/x. It is one graph made of two nd:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:24px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Why two parts?<\u002Fb>  xy = −12 is a constant product. x = 0 would make xy = 0, so there is no point there. a &lt; 0 puts the curves in the 2nd and 4th quadrants; a &gt; 0 puts them in the 1st and 3rd.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.r12.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.r12.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"r12\" step=\"{{ we.r12.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.2 Sketching y = a/x + q\" data-screen-label=\"28 18.2 Sketching y = a/x + q\" data-speaker-notes=\"Sketching graphs of reciprocal functions in the standard form y = a over x plus q. Step 1: the sign of a. Step 2: the x-intercept at x = −a over q. Step 3: the asymptotes x = 0 and y = q. Step 4: sketch. Worked example 9: y = 3 over x + 3.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-t ansform:{{ we.s1.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the axes and scales.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.s1.o2 }};transform:{{ we.s1.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Draw y = x² − 3x − 1.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.s1.o3 }};transform:{{ we.s1.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">The solutions are where y = 0: read the x-values where the curve crosses the x-axis.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:18px 26px;font-size:34px;line-height:1.45;text-wrap:pretty;\">x ≈ −0.3 and x ≈ 3.3<\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:34px;\">Roots<\u002Fspan><p style=\"font-size:26px;line-height:1.38;margin:0;text-wrap:pretty;\">The solutions of an equation such as x² − 3x − 1 = 0. On the graph they are the x-values where the curve crosses the x-axis.<\u002Fp><\u002Fdiv><p style=\"font-size:24px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Use a sharp pencil: you can correct your work more easily and read intersections more accurately.<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.s1.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.s1.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"s1\" step=\"{{ we.s1.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.3 Worked example 10\" data-screen-label=\"35 18.3 Worked example 10\" data-speaker-notes=\"Worked example 10. Use the graph of y = x² − 2x − 7 to solve three equations. For b draw y = 3. For c rearrange x² − 2x = 1 by subtracting 7 from both sides so the left side matches the graph: x² − 2x − 7 = −6.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 10<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.3 · Solving<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Using y = x² − 2x − 7<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w10.o1 }};transform:{{ we.w10.t1 }};transition:opacity .5s, transform .5s;\">a  x² − 2x − 7 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w10.o1 }};transform:{{ we.w10.t1 }};transition:opacity .5s, transform .5s;\">where the curve meets y = 0 (A and B): x ≈ −1.8 and 3.8<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w10.o2 }};transform:{{ we.w10.t2 }};transition:opacity .5s, transform .5s;\">b  x² − 2x − 7 = 3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w10.o2 }};transform:{{ we.w10.t2 }};transition:opacity .5s, transform .5s;\">draw y = 3 (P and Q): x ≈ −2.3 and 4.3<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w10.o3 }};transform:{{ we.w10.t3 }};transition:opacity .5s, transform .5s;\">c  x² − 2x = 1<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w10.o3 }};transform:{{ we.w10.t3 }};transition:opacity .5s, transform .5s;\">subtract 7 from both sides: x² − 2x − 7 = −6<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w10.o3 }};transform:{{ we.w10.t3 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.w10.o3 }};transform:{{ we.w10.t3 }};transition:opacity .5s, transform .5s;\">draw y = −6 (S and T): x ≈ −0.4 and 2.4<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">In summary<\u002Fb>  Read off the x-coordinates of the intersections ght:400;font-size:48px;line-height:1.05;margin:0;text-wrap:pretty;\">Solve x² − 4x − 3 = 0 using y = x² − 2x − 7<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:26px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;\">x² − 4x − 3 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;\">the equation to solve<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.sl.o1 }};transform:{{ we.sl.t1 }};transition:opacity .5s, transform .5s;\">x² − 2x − 7 = 2x − 4<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.sl.o1 }};transform:{{ we.sl.t1 }};transition:opacity .5s, transform .5s;\">add 2x − 4 to both sides so the left matches the graph<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.sl.o1 }};transform:{{ we.sl.t1 }};transition:opacity .5s, transform .5s;\">draw y = 2x − 4<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.sl.o1 }};transform:{{ we.sl.t1 }};transition:opacity .5s, transform .5s;\">the right-hand side is the line to draw<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.sl.o2 }};transform:{{ we.sl.t2 }};transition:opacity .5s, transform .5s;\">x ≈ −0.6 or 4.6<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:23px;text-wrap:pretty;opacity:{{ we.sl.o2 }};transform:{{ we.sl.t2 }};transition:opacity .5s, transform .5s;\">read the x-values where line and curve cross<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Method: (graph equation) − (equation to solve) = the line. Here (x² − -radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Question 13<\u002Fspan><p style=\"font-size:29px;line-height:1.38;margin:0;text-wrap:pretty;\">You have y = x² − 3x. To solve x² − 5x + 1 = 0 you draw y = mx + c. Give m and c.<\u002Fp><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q12.val }}\" sc-camel-on-input=\"{{ qz.q12.onInput }}\" sc-camel-on-key-down=\"{{ qz.q12.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 22px;border-radius:999px;border:2px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:300px;font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:25px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q12.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:25px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q12.show }}\">Show answer<\u002Fbutton><span style=\"font-size:27px;font-weight:700;color:{{ qz.q12.fbCol }};\">{{ qz.q12.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Simultaneous linear and non-linear equations\" data-screen-label=\"39 18.4 Simultaneous linear and non-linear equations\" data-speaker-notes=\"Lesson 18.4. As with two straight lines, a line and a curve meet at the solutions of their simultaneous equations.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 18.4<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Simultaneous linear and non-linear equations<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">use the intersections of a line and a curve to solve simultaneous equations<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">solve them algebraically by substitution<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">give answers in exact form<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Worked example 11\" data-screen-label=\"40 18.4 Worked example 11\" data-speaker-notes=\"Worked example 11. The graphs of y = 2 + x and y = x² − 3x + 4 are drawn on the same axes. The points of intersection give the solutions.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 11<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.4 · Graphically<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:48px;line-height:1.05;margin:0;text-wrap:pretty;\">Where does y = 2 + x meet y = x² − 3x + 4?<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.w11.o1 }};transform:{{ we.w11.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the curve y = x² − 3x + 4.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.w11.o2 }};transform:{{ we.w11.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the line y = 2 + x.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.35;opacity:{{ we.w11.o3 }};transform:{{ we.w11.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:28px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Read the two intersections.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:18px 26px;font-size:30px;line-height:1.45;text-wrap:pretty;\">(0.6, 2.6) and (3.4, 5.4)  so  x = 0.6 and x = 3.4<\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:25px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  You may also be asked for the y-values, so pair each x with its own y: when x = 0.6, y = 2.6 and when x = 3.4, y = 5.4.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w11.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w11.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w11\" step=\"{{ we.w11.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Worked example 12\" data-screen-label=\"41 18.4 Worked example 12\" data-speaker-notes=\"Worked example 12. The diagram shows y = 8 over x and y = x for positive x. a Solve 8 over x = 5.7 by drawing y = 5.7. b Find x so that 8 over x = x, where the line y = x crosses the curve.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 12<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.4 · Graphically<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.05;margin:0;text-wrap:pretty;\">y = 8/x with y = 5.7 and y = x<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:27px;line-height:1.35;opacity:{{ we.w12.o1 }};transform:{{ we.w12.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:29px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">a  Draw y = 5.7. It meets the curve at A, where x ≈ 1.4. So 8/x = 5.7 gives x = 1.4.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:27px;line-height:1.35;opacity:{{ we.w12.o2 }};transform:{{ we.w12.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:29px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">b  The line y = x crosses the curve at B, where x ≈ 2.8. So 8/x = x gives x = 2.8.<\u002Fspan><\u002Fdiv><\u002Fdiv><p style=\"font-size:27px;line-height:1.42;margin:0;text-wrap:pretty;\">Check b: 8/x = x ⇒ x² = 8 ⇒ x = √8 ≈ 2.83 ✓<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w12.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w12.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c18-graph\" kind=\"w12\" step=\"{{ we.w12.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Algebraic solution: worked example 13\" data-screen-label=\"42 18.4 Algebraic solution: worked example 13\" data-speaker-notes=\"Algebraic solutions. Rearrange the linear equation to isolate one variable, substitute into the quadratic and solve. Worked example 13: y = 2x² − x + 3 and 4x − 2y + 10 = 0.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 13<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.4 · Algebraically<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.05;margin:0;text-wrap:pretty;\">Solve y = 2x² − x + 3 [1] and 4x − 2y + 10 = 0 [2]<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:30px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o1 }};transform:{{ we.w13.t1 }};transition:opacity .5s, transform .5s;\">4x − 2y + 10 = 0 ⇒ y = 2x + 5   [3]<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o1 }};transform:{{ we.w13.t1 }};transition:opacity .5s, transform .5s;\">rearrange the linear equation to y = …<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o2 }};transform:{{ we.w13.t2 }};transition:opacity .5s, transform .5s;\">2x + 5 = 2x² − x + 3<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o2 }};transform:{{ we.w13.t2 }};transition:opacity .5s, transform .5s;\">substitute [3] into [1]<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o3 }};transform:{{ we.w13.t3 }};transition:opacity .5s, transform .5s;\">2x² − 3x − 2 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o3 }};transform:{{ we.w13.t3 }};transition:opacity .5s, transform .5s;\">collect everything on one side<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o4 }};transform:{{ we.w13.t4 }};transition:opacity .5s, transform .5s;\">(2x + 1)(x − 2) = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o4 }};transform:{{ we.w13.t4 }};transition:opacity .5s, transform .5s;\">this one factorises<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o5 }};transform:{{ we.w13.t5 }};transition:opacity .5s, transform .5s;\">x = −½ or x = 2<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o5 }};transform:{{ we.w13.t5 }};transition:opacity .5s, transform .5s;\">the x-values of the solutions<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o6 }};transform:{{ we.w13.t6 }};transition:opacity .5s, transform .5s;\">y = 2(−½) + 5 = 4,  y = 2(2) + 5 = 9<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o6 }};transform:{{ we.w13.t6 }};transition:opacity .5s, transform .5s;\">substitute each x into [3]<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w13.o6 }};transform:{{ we.w13.t6 }};transition:opacity .5s, transform .5s;\">x = −½, y = 4  and  x = 2, y = 9<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w13.o6 }};transform:{{ we.w13.t6 }};transition:opacity .5s, transform .5s;\">write the pairs<\u002Fdiv><\u002Fdiv><p style=\"font-size:26px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">You can solve the quadratic using any method you like.<\u002Fp><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w13.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w13.reset }}\">Start again<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Worked example 14: exact form\" data-screen-label=\"43 18.4 Worked example 14: exact form\" data-speaker-notes=\"Worked example 14. Find the points of intersection of 2y = 10x − x² − 2 and x + y = 6 algebraically, giving answers in exact form. The quadratic does not factorise, so use the formula and simplify the surd.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 14<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.4 · Algebraically<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:52px;line-height:1.05;margin:0;text-wrap:pretty;\">2y = 10x − x² − 2 and x + y = 6, in exact form<\u002Fh2><div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:30px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o1 }};transform:{{ we.w14.t1 }};transition:opacity .5s, transform .5s;\">y = 6 − x   [3]<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o1 }};transform:{{ we.w14.t1 }};transition:opacity .5s, transform .5s;\">rearrange the linear equation<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o2 }};transform:{{ we.w14.t2 }};transition:opacity .5s, transform .5s;\">2(6 − x) = 10x − x² − 2<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o2 }};transform:{{ we.w14.t2 }};transition:opacity .5s, transform .5s;\">substitute [3] into [1]<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o3 }};transform:{{ we.w14.t3 }};transition:opacity .5s, transform .5s;\">x² − 12x + 14 = 0<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o3 }};transform:{{ we.w14.t3 }};transition:opacity .5s, transform .5s;\">expand and collect terms<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o4 }};transform:{{ we.w14.t4 }};transition:opacity .5s, transform .5s;\">x = (12 ± √(144 − 56)) ÷ 2 = (12 ± √88) ÷ 2<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o4 }};transform:{{ we.w14.t4 }};transition:opacity .5s, transform .5s;\">quadratic formula<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o5 }};transform:{{ we.w14.t5 }};transition:opacity .5s, transform .5s;\">x = (12 ± 2√22) ÷ 2 = 6 ± √22<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o5 }};transform:{{ we.w14.t5 }};transition:opacity .5s, transform .5s;\">√88 = √4 × √22 = 2√22<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.w14.o6 }};transform:{{ we.w14.t6 }};transition:opacity .5s, transform .5s;\">(6 + √22, −√22) and (6 − √22, √22)<\u002Fdiv><div style=\"color:var(--color-neutral-700);font-size:27px;text-wrap:pretty;opacity:{{ we.w14.o6 }};transform:{{ we.w14.t6 }};transition:opacity .5s, transform .5s;\">y = 6 − x for each; write as coordinates<\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:22px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>“Exact form” means leave the surd. Writing 10.69 instead of 6 + √22 loses the final mark.<\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w14.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:27px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.w14.reset }}\">Start again<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.4 Exam coach: how many solutions?\" data-screen-label=\"44 18.4 Exam coach: how many solutions?\" data-speaker-notes=\"After substituting you get a quadratic. Its discriminant tells you how many times the line meets the curve. Exercise 18.6 question 4: show there is no x satisfying y = −4 and y = x² + 2x + 3.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:gr percase;color:var(--color-accent-2-800);\">Lesson 18.5<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Other non-linear graphs<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:28px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">plot cubic graphs from a table of values<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">use cubic graphs to solve equations<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:34px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">draw graphs with combinations of terms and exponential graphs<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"18.5 Cubic graphs\" data-screen-label=\"48 18.5 Cubic graphs\" data-speaker-notes=\"A cubic equation has x cubed as the highest power. If the coefficient of x cubed is positive the graph rises from bottom left to top right; if it is negative it falls.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 1000px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Plotting cubic graphs<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">18.5 · Cubics<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.05;margin:0;text-wrap:pretty;\">The two main shapes<\u002Fh2><p style=\"font-size:28px;line-height:1.42;margin:0;text-wrap:pretty;\">A cubic equation has a term with an index of three as its highest power, such as y = 2x³, y = −x³ + 2x² + 3 and y = 2x³ − 4x. The simplest is y = x³.<\u002Fp><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:27px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Positive x³ coefficient<\u002Fb>  starts low on the left and ends high on the right.<br><b style=\"color:var(--color-accent-2-800);\">Negative x³ coefficient<\u002Fb>  starts high on the left and ends low on the right.<\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:26px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  In the exam, higher-order equations will not contain more than three terms.<\u002Fdiv><p style=\"font-size:25px;line-height:1.42;margin:0;text-wrap:pretty;color:var(--color-neutral-700);\">Investigation: use a graph plotter to explore y = ax³ + d. a changes the steepness and direction; d moves the graph up or down.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-rows:1fr 1fr;gap:24px;min-height:0;\"><div style=\"background:var(--color-surface);border-radius:calc(var(
