document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"6e9a1c80-7d80-4af8-89da-f19cb01ca4b3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"b8f922ee-ebc7-44be-82e6-db88be9ca260\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>:root{--font-heading:\"Figtree\",system-ui,sans-serif;--font-heading-weight:800;}body{font-weight:500;}[style*=\"font-heading\"],h1,h2,.btn{font-weight:800 !important;letter-spacing:-0.02em;}html,body{margin:0;background:var(--color-bg);}@media print{[data-nav]{display:none !important;}}a{color:var(--color-accent-700);}a:hover{color:var(--color-accent-800);}<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"d70ab308-baa4-49d5-a8aa-58e9da9c8dfd#/deck-stage.js\" no-rail=\"\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Title\" data-screen-label=\"01 Title\" data-speaker-notes=\"Chapter 19 of Cambridge IGCSE 0580 Extended: Symmetry and the properties of circles. We start with the lesson objectives and the prior knowledge you need, then work through lessons 19.1 to 19.4 in order.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;\">\n<div style=\"position:absolute;right:-160px;top:-180px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<div style=\"position:absolute;right:300px;bottom:-240px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-200);\"><\u002Fdiv>\n<div style=\"position:absolute;right:180px;top:200px;width:300px;height:300px;border-radius:50%;border:14px solid var(--color-accent);box-sizing:border-box;\"><\u002Fdiv>\n<span style=\"position:relative;font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Cambridge IGCSE™ · Mathematics 0580 Extended · Year 11<\u002Fspan>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px;max-width:1150px;\">\n<span style=\"font-size:34px;font-weight:700;color:var(--color-accent-700);\">Chapter 19<\u002Fspan>\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:150px;line-height:.95;margin:0;\">Symmetry &amp; circles<\u002Fh1>\n<p style=\"font-size:36px;line-height:1.4;margin:0;max-width:980px;text-wrap:pretty;\">Line &amp; rotational symmetry and the circle theorems, taught lesson by lesson with animated examples.<\u002Fp>\n<\u002Fdiv>\n<p style=\"position:relative;font-size:26px;color:var(--color-neutral-700);margin:0;\">Press → to move · watch the animations · drag the points on the circles · type into the quiz boxes and press Check<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Lesson objectives\" data-screen-label=\"02 Lesson objectives\" data-speaker-notes=\"Objectives: recognise line and rotational symmetry in two and three dimensions; use the symmetry properties of chords and tangents; and calculate unknown angles using the circle theorems, giving reasons.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;\">\n<span style=\"align-self:flex-start;background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Lesson objectives<\u002Fspan>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:80px;line-height:1.05;margin:28px 0 56px;\">In this chapter you will learn how to…<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;flex:1;\">\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:40px 36px;display:flex;flex-direction:column;gap:18px;\"><span style=\"font-family:var(--font-heading);font-size:64px;color:var(--color-accent-700);\">19.1<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Symmetry<\u002Fspan><p style=\"font-size:32px;line-height:1.4;margin:0;\">Find lines of symmetry and order of rotational symmetry<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:40px 36px;display:flex;flex-direction:column;gap:18px;\"><span style=\"font-family:var(--font-heading);font-size:64px;color:var(--color-accent-700);\">19.2<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Symmetry<\u002Fspan><p style=\"font-size:32px;line-height:1.4;margin:0;\">Count planes and axes of symmetry of solids<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:40px 36px;display:flex;flex-direction:column;gap:18px;\"><span style=\"font-family:var(--font-heading);font-size:64px;color:var(--color-accent-2-700);\">19.3<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Symmetry<\u002Fspan><p style=\"font-size:32px;line-height:1.4;margin:0;\">Use the symmetry of chords &amp; tangents<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:40px 36px;display:flex;flex-direction:column;gap:18px;\"><span style=\"font-family:var(--font-heading);font-size:64px;color:var(--color-accent-2-700);\">19.4<\u002Fspan><span style=\"font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);\">Circle theorems<\u002Fspan><p style=\"font-size:30px;line-height:1.4;margin:0;\">Angle in a semicircle = 90°<\u002Fp><p style=\"font-size:30px;line-height:1.4;margin:0;\">Angle at the centre = 2 × angle at circumference<\u002Fp><p style=\"font-size:30px;line-height:1.4;margin:0;\">Cyclic quadrilateral &amp; alternate segment theorems<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Prior knowledge\" data-screen-label=\"03 Prior knowledge\" data-speaker-notes=\"Before we start, check you remember these facts. Every circle problem in this chapter ends with one of them: angle sums, isosceles triangles or Pythagoras.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;\">\n<span style=\"align-self:flex-start;background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Prior knowledge required<\u002Fspan>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:80px;line-height:1.05;margin:28px 0 48px;\">What you need to know already<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 40px;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-700);\">Angle facts<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">Angles on a straight line add to 180°. Angles in a triangle add to 180°. Angles around a point add to 360°.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-700);\">Isosceles triangles<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">Two sides are equal, so the two base angles are equal.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-700);\">Pythagoras' theorem<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">In a right-angled triangle, a² + b² = c², where c is the longest side (the hypotenuse).<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-2-700);\">Parts of a circle<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">Centre, radius, diameter (= 2 × radius), circumference and arc.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-2-700);\">Polygons<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">Names of shapes up to the octagon. A regular polygon has equal sides and equal angles.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:40px;color:var(--color-accent-2-700);\">Transformations<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">Reflecting a shape in a mirror line, and rotating a shape about a point.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Warm-up check\" data-screen-label=\"04 Warm-up\" data-speaker-notes=\"Four quick questions on the prior knowledge. Answers: 70 degrees, 10 cm, 70 degrees, 14 cm.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;\">\n<span style=\"align-self:flex-start;background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Warm-up<\u002Fspan>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:80px;line-height:1.05;margin:28px 0 48px;\">Check your prior knowledge<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;\">\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:36px 40px;display:flex;flex-direction:column;gap:14px;\"><p style=\"font-size:32px;line-height:1.4;margin:0;\"><b>1.<\u002Fb> Two angles of a triangle are 50° and 60°. Find the third angle.<\u002Fp><span style=\"font-size:32px;font-weight:700;color:var(--color-accent-2-700);opacity:{{ we.warm.o1 }};transition:opacity .5s;\">70°<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:36px 40px;display:flex;flex-direction:column;gap:14px;\"><p style=\"font-size:32px;line-height:1.4;margin:0;\"><b>2.<\u002Fb> A right-angled triangle has shorter sides 6 cm and 8 cm. Find the hypotenuse.<\u002Fp><span style=\"font-size:32px;font-weight:700;color:var(--color-accent-2-700);opacity:{{ we.warm.o1 }};transition:opacity .5s;\">√(6² + 8²) = 10 cm<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:36px 40px;display:flex;flex-direction:column;gap:14px;\"><p style=\"font-size:32px;line-height:1.4;margin:0;\"><b>3.<\u002Fb> An isosceles triangle has a top angle of 40°. Find each base angle.<\u002Fp><span style=\"font-size:32px;font-weight:700;color:var(--color-accent-2-700);opacity:{{ we.warm.o1 }};transition:opacity .5s;\">(180° − 40°) ÷ 2 = 70°<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:36px 40px;display:flex;flex-direction:column;gap:14px;\"><p style=\"font-size:32px;line-height:1.4;margin:0;\"><b>4.<\u002Fb> The radius of a circle is 7 cm. What is its diameter?<\u002Fp><span style=\"font-size:32px;font-weight:700;color:var(--color-accent-2-700);opacity:{{ we.warm.o1 }};transition:opacity .5s;\">14 cm<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:16px;margin-top:40px;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.warm.toggle }}\">{{ we.warm.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19.1 Symmetry of 2D shapes\" data-screen-label=\"05 Lesson 19.1\" data-speaker-notes=\"Lesson 19.1: symmetry of two-dimensional shapes. Line symmetry first, then rotational symmetry.\" style=\"background:var(--color-accent);color:var(--color-text);font-family:var(--font-body);padding:0 120px;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;position:relative;\">\n<div style=\"position:absolute;right:-180px;top:-160px;width:780px;height:780px;border-radius:50%;background:var(--color-accent-400);\"><\u002Fdiv>\n<div style=\"position:absolute;right:260px;bottom:-280px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-600);\"><\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px;max-width:1100px;\">\n<span style=\"font-size:28px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\">Lesson 1 of 4<\u002Fspan>\n<div style=\"font-family:var(--font-heading);font-size:230px;line-height:.9;color:var(--color-bg);\">19.1<\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:100px;line-height:1;margin:0;\">Symmetry of 2D shapes<\u002Fh2>\n<p style=\"font-size:36px;line-height:1.4;margin:0;\">Lines &amp; order of rotational symmetry<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19.1 Example 1: Fold &amp; match\" data-screen-label=\"06 19.1 Example 1\" data-speaker-notes=\"First example of lesson 19.1. Watch the right half fold over the dashed line. Because it lands exactly on the left half, the dashed line is a line of symmetry. New words: line symmetry and axis of symmetry.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:80px;overflow:hidden;\">\n<div style=\"display:flex;flex-direction:column;gap:28px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example 1<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.1 · Symmetry of 2D shapes<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:76px;line-height:1.05;margin:0;\">Fold the shape — do the halves match?<\u002Fh2>\n<div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:30px 36px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:44px;\">Line symmetry<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">A shape has line symmetry if you can fold it along a line so one half fits exactly on top of the other.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:30px 36px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:44px;\">Axis of symmetry<\u002Fspan><p style=\"font-size:30px;line-height:1.45;margin:0;\">The line itself that a shape is reflected across. Each point has a matching point the same distance on the other side.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"fold\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19.1 Lines of symmetry\" data-screen-label=\"07 19.1 Lines of symmetry\" data-speaker-notes=\"Each candidate line is tested by reflecting the shape across it. Where the reflection lands on the shape, it is a line of symmetry. The parallelogram has none.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example 2<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.1 · Symmetry of 2D shapes<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:76px;line-height:1.05;margin:28px 0 12px;\">Test every line: reflect and compare<\u002Fh2>\n<p style=\"font-size:30px;line-height:1.4;margin:0 0 36px;color:var(--color-neutral-800);\">A square has 4 lines of symmetry; a circle has infinitely many.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;flex:1;\">\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:8px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"lines\" shape=\"tri\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Equilateral △<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:8px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"lines\" shape=\"square\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Square<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:8px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"lines\" shape=\"rect\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Rectangle<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:8px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"lines\" shape=\"para\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Parallelogram<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19.1 Rotational symmetry\" data-screen-label=\"08 19.1 Rotational symmetry\" data-speaker-notes=\"New words: rotational symmetry and centre of rotation. Watch each shape turn about its centre. The green dot shows the turning. Count how many times the shape fits its dashed outline in one full turn: that is the order.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 1000px;gap:64px;overflow:hidden;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example 3<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;\">Turn the shape — count the matches<\u002Fh2>\n<div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:28px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Rotational symmetry<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">A shape has rotational symmetry if it looks the same more than once as it turns through 360°. The number of matches is the <b>order<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:28px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Centre of rotation<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">The point that stays still when a shape turns. Every other point moves in a circle around it.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;\">\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:30px;display:flex;flex-direction:column;gap:10px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"rotate\" shape=\"tri\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Equilateral △ · order 3<\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:30px;display:flex;flex-direction:column;gap:10px;\"><div style=\"flex:1;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"rotate\" shape=\"square\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-family:var(--font-heading);font-size:34px;text-align:center;\">Square · order 4<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19.1 Regular polygons\" data-screen-label=\"09 19.1 Regular polygons\" data-speaker-notes=\"Two-dimensional symmetry summary. A regular polygon with n sides has n lines of symmetry and rotational symmetry of order n. The animation runs from the triangle up to the octagon.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding:80px 110px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:80px;overflow:hidden;\">\n<div style=\"display:flex;flex-direction:column;gap:28px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--colo
