var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">The perpendicular from the centre cuts a chord in half<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Chord<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">A straight line joining two points on a circle. A diameter is the longest chord.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Perpendicular bisector<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">A line that cuts a segment in half at 90°. The perpendicular bisector of a chord always passes through the centre.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  If OM ⊥ AB, then AM = MB. Triangle OMA is right-angled: use Pythagoras.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"chord\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Try it: Chord explorer\" data-screen-label=\"19 19.3 Try it: Chord explorer\" data-speaker-notes=\"Interactive. Drag the slider to move the chord closer to or further from the centre. The radius stays 7 cm. Half the chord is always the square root of 49 minus d squared. The closer the chord is to the centre, the longer it is; at d equals 0 it is the diameter.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Try it<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;text-wrap:pretty;\">Move the chord — watch Pythagoras<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:14px;\"><span style=\"font-size:26px;font-weight:700;color:var(--color-neutral-700);\">Distance from the centre, d = {{ chord.d }} cm<\u002Fspan><input type=\"range\" min=\"0\" max=\"6.5\" step=\"0.1\" value=\"{{ chord.d }}\" sc-camel-on-input=\"{{ chord.onInput }}\" style=\"width:100%;height:36px;accent-color:var(--color-accent);\"><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:28px 34px;display:flex;flex-direction:column;gap:12px;font-size:32px;line-height:1.4;\"><span>Half chord = √(7² − d²)<\u002Fspan><span>= √(49 − {{ chord.d2 }}) = √{{ chord.h2 }}<\u002Fspan><span>= <b>{{ chord.half }} cm<\u002Fb><\u002Fspan><span style=\"color:var(--color-accent-2-700);\">Chord AB = 2 × {{ chord.half }} = <b>{{ chord.len }} cm<\u002Fb><\u002Fspan><\u002Fdiv><p style=\"font-size:26px;line-height:1.4;margin:0;color:var(--color-neutral-700);\">At d = 0 the chord passes through the centre: it is the diameter, 14 cm.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"chord\" value=\"{{ chord.d }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Worked example 1: Chord length\" data-screen-label=\"20 19.3 Worked example 1: Chord length\" data-speaker-notes=\"Worked example 1. A chord is 3 cm from the centre of a circle of radius 7 cm. Press Next step to build the solution. The perpendicular bisects the chord; half the chord is root 40; the chord is 12.65 cm.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 1<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Chord length with Pythagoras<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">A chord is <b>3 cm<\u002Fb> from the centre of a circle of radius <b>7 cm<\u002Fb>. Find the length of the chord AB.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we1.o1 }};transform:{{ we.we1.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Draw OM ⊥ AB. The perpendicular from the centre bisects the chord, so AM = MB.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we1.o2 }};transform:{{ we.we1.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Triangle OMA is right-angled at M, with hypotenuse OA = 7 cm.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we1.o3 }};transform:{{ we.we1.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">AM = √(7² − 3²) = √40 = 6.32 cm<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we1.o4 }};transform:{{ we.we1.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\"><b>AB = 2 × √40 = 12.65 cm<\u002Fb> (2 d.p.)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we1.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we1.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"we1\" step=\"{{ we.we1.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Example 2: Equal chords\" data-screen-label=\"21 19.3 Example 2: Equal chords\" data-speaker-notes=\"Equal chords are equidistant from the centre, and chords that are the same distance from the centre are equal. Watch the two chords change length together: their distances from the centre stay equal.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example 2<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Equal chords are the same distance from the centre<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Equidistant<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">The same distance away. Distance from the centre to a chord is measured along the perpendicular.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  Equal chords are equidistant from the centre. Chords equidistant from the centre are equal.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"equal\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Worked example 2: Distance from the centre\" data-screen-label=\"22 19.3 Worked example 2: Distance from the centre\" data-speaker-notes=\"Worked example 2. Chord CD is 14 cm in a circle of radius 11 cm. Half the chord is 7 cm. OY is root 72, 8.49 cm. Any other 14 cm chord in this circle is also 8.49 cm from the centre.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 2<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">How far is the chord from the centre?<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">Chord CD is <b>14 cm<\u002Fb> long in a circle of radius <b>11 cm<\u002Fb>. Find its distance OY from the centre.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we2.o1 }};transform:{{ we.we2.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Draw OY ⊥ CD, so CY = YD = ½ × 14 = 7 cm.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we2.o2 }};transform:{{ we.we2.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Triangle OYD is right-angled at Y, with hypotenuse OD = 11 cm.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we2.o3 }};transform:{{ we.we2.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\"><b>OY = √(11² − 7²) = √72 = 8.49 cm<\u002Fb> (2 d.p.)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we2.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we2.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"we2\" step=\"{{ we.we2.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Example 3: Two tangents from a point\" data-screen-label=\"23 19.3 Example 3: Two tangents from a point\" data-speaker-notes=\"A tangent touches a circle at exactly one point. From an external point P, the two tangents to a circle are equal in length, and the line OP bisects the angle between them. Each radius meets its tangent at 90 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Example 3<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Two tangents from a point are equal<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Tangent<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">A straight line that touches a circle at exactly one point, called the point of contact.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  From an external point P: PA = PB, and OP bisects ∡APB. Each radius meets its tangent at 90°.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"tangents\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.3 Worked example 3: Tangents &amp; Pythagoras\" data-screen-label=\"24 19.3 Worked example 3: Tangents &amp; Pythagoras\" data-speaker-notes=\"Worked example 3. Equal tangents give x equals 25 cm. The radius is perpendicular to the tangent, so OM is root of 25 squared plus 12 squared, root 769, 27.73 cm.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 3<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.3 · Symmetry properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Tangents &amp; Pythagoras<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">MN and MP are tangents from M. PM = <b>25 cm<\u002Fb> and the radius is <b>12 cm<\u002Fb>. Find x = NM and y = OM.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we3.o1 }};transform:{{ we.we3.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Tangents from the same point are equal: <b>x = NM = 25 cm<\u002Fb>.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we3.o2 }};transform:{{ we.we3.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">The radius meets the tangent at 90°, so ∡ONM = 90°.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we3.o3 }};transform:{{ we.we3.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Triangle ONM is right-angled with shorter sides 12 cm and 25 cm.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we3.o4 }};transform:{{ we.we3.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\"><b>y = OM = √(25² + 12²) = √769 = 27.73 cm<\u002Fb> (2 d.p.)<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we3.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we3.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"we3\" step=\"{{ we.we3.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Angle properties of circles\" data-screen-label=\"25 Lesson 19.4\" data-speaker-notes=\"Lesson 19.4: angle properties of circles. Angle in a semicircle, angle at the centre, angles in the same segment, cyclic quadrilaterals, tangent and radius, and the alternate segment theorem.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2);padding:0 120px;display:flex;align-items:center;position:relative;\">\n<div style=\"position:absolute;right:-180px;top:-160px;width:780px;height:780px;border-radius:50%;background:var(--color-accent-2-400);\"><\u002Fdiv>\n<div style=\"position:absolute;right:260px;bottom:-280px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-600);\"><\u002Fdiv>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px;max-width:1100px;\">\n<span style=\"font-size:28px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\">Lesson 4 of 4<\u002Fspan>\n<div style=\"font-family:var(--font-heading);font-size:230px;line-height:.9;color:var(--color-bg);\">19.4<\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:100px;line-height:1.05;margin:0;text-wrap:pretty;\">Angle properties of circles<\u002Fh2>\n<p style=\"font-size:36px;line-height:1.4;margin:0;\">The circle theorems<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Example 1: Angle in a semicircle\" data-screen-label=\"26 19.4 Example 1: Angle in a semicircle\" data-speaker-notes=\"First example of lesson 19.4. AB is a diameter. Any angle at the circumference standing on the diameter is a right angle. Drag point C around the circle: the reading stays at 90 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 1<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;text-wrap:pretty;\">The angle in a semicircle is 90°<\u002Fh2><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  If AB is a diameter and C is on the circle, then ∡ACB = 90°.<\u002Fdiv><p style=\"font-size:26px;line-height:1.4;margin:0;color:var(--color-neutral-700);\">Drag C around the circle. The angle stays 90°.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"semicircle\" interactive=\"1\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Example 2: Angle at the centre\" data-screen-label=\"27 19.4 Example 2: Angle at the centre\" data-speaker-notes=\"The angle subtended at the centre by an arc is twice the angle subtended at the circumference by the same arc. Drag P along the top of the circle: the ratio stays at 2.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 2<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Angle at the centre = 2 × angle at the circumference<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Subtended angle<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">The angle made at a point by lines drawn from the two ends of an arc or chord.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  ∡AOB = 2 × ∡APB when both stand on the same arc AB.<\u002Fdiv><p style=\"font-size:26px;line-height:1.4;margin:0;color:var(--color-neutral-700);\">Drag P. The ratio stays at 2.00.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"centre\" interactive=\"1\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Example 3: Angles in the same segment\" data-screen-label=\"28 19.4 Example 3: Angles in the same segment\" data-speaker-notes=\"Angles at the circumference subtended by the same arc, in the same segment, are equal. Drag P: Q moves too, and both angles stay equal.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 3<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;text-wrap:pretty;\">Angles in the same segment are equal<\u002Fh2><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  Angles at the circumference standing on the same arc AB, in the same segment, are equal: ∡APB = ∡AQB.<\u002Fdiv><p style=\"font-size:26px;line-height:1.4;margin:0;color:var(--color-neutral-700);\">Drag P around the top of the circle.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"segment\" interactive=\"1\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Example 4: Cyclic quadrilateral\" data-screen-label=\"29 19.4 Example 4: Cyclic quadrilateral\" data-speaker-notes=\"A cyclic quadrilateral has all four vertices on a circle. Its opposite angles add to 180 degrees. Watch the vertices slide around the circle: a plus c and b plus d stay at 180.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 4<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Opposite angles of a cyclic quadrilateral add to 180°<\u002Fh2><div style=\"background:var(--color-accent-100);border-radius:var(--radius-lg);padding:26px 32px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:40px;\">Cyclic quadrilateral<\u002Fspan><p style=\"font-size:28px;line-height:1.45;margin:0;\">A quadrilateral with all four vertices on the circumference of a circle.<\u002Fp><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  a + c = 180° and b + d = 180°.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"cyclic\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Proof: Exterior angle of a cyclic quadrilateral\" data-screen-label=\"30 19.4 Proof: Exterior angle of a cyclic quadrilateral\" data-speaker-notes=\"Proof. On the straight line, x plus angle BCD is 180. In the cyclic quadrilateral, a plus angle BCD is also 180. So x equals a: the exterior angle of a cyclic quadrilateral equals the interior opposite angle.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 5 · Proof<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Exterior angle = interior opposite angle<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">ABCD is a cyclic quadrilateral. Side DC is extended to E. Prove that x = a.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.ext.o1 }};transform:{{ we.ext.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">x + ∡BCD = 180°  (angles on the straight line DCE)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.ext.o2 }};transform:{{ we.ext.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">a + ∡BCD = 180°  (opposite angles of a cyclic quadrilateral)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.ext.o3 }};transform:{{ we.ext.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Therefore <b>x = a<\u002Fb>. The exterior angle equals the interior opposite angle. ∎<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.ext.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.ext.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"exterior\" step=\"{{ we.ext.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Worked example 4: Centre &amp; cyclic quadrilateral\" data-screen-label=\"31 19.4 Worked example 4: Centre &amp; cyclic quadrilateral\" data-speaker-notes=\"Worked example 4. The angle at the centre is 130, so the angle at the circumference x is 65. ABCD is cyclic, so y is 180 minus 65, 115 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 4<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Two theorems in one diagram<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">O is the centre and ∡AOC = <b>130°<\u002Fb>. Find x = ∡ABC and y = ∡ADC.<\u002Fdiv><div style=\"display:flex;flex-directio ion>\n<section data-label=\"19.4 Example 5: Tangent and radius\" data-screen-label=\"32 19.4 Example 5: Tangent and radius\" data-speaker-notes=\"A tangent is perpendicular to the radius at the point of contact. Drag T around the circle: the tangent turns with it and the angle stays 90 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Theorem 6<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1.05;margin:0;text-wrap:pretty;\">A tangent meets the radius at 90°<\u002Fh2><div style=\"background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:26px 32px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Rule<\u002Fb>  The tangent at T is perpendicular to the radius OT.<\u002Fdiv><p style=\"font-size:26px;line-height:1.4;margin:0;color:var(--color-neutral-700);\">Drag T around the circle.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"tangent\" interactive=\"1\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Worked example 5: Tangent &amp; angle\" data-screen-label=\"33 19.4 Worked example 5: Tangent &amp; angle\" data-speaker-notes=\"Worked example 5. OC is a radius meeting tangent CB, so angle OCB is 90. In triangle OCB, y is 180 minus 90 minus 30, 60 degrees. Two tangents subtend equal angles at the centre, so x equals 60 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 5<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Tangent–radius angles<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">BA and BC are tangents from B, with ∡OBC = <b>30°<\u002Fb>. Find y = ∡COB and x = ∡AOB.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we4.o1 }};transform:{{ we.we4.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Radius ⊥ tangent, so ∡OCB = 90°.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we4.o2 }};transform:{{ we.we4.t2 }};transition:opacity .5 var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Tangents from C are equal, so triangle ABC is isosceles.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we6.o2 }};transform:{{ we.we6.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">∡CAB = ∡CBA = (180° − 40°) ÷ 2 = 70°<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we6.o3 }};transform:{{ we.we6.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Alternate segment theorem: <b>x = ∡ADB = 70°<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we6.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we6.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;display:flex;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"we6\" step=\"{{ we.we6.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Worked example 7: Prove CD is a diameter\" data-screen-label=\"36 19.4 Worked example 7: Prove CD is a diameter\" data-speaker-notes=\"Worked example 7, a proof. Angle BCT is 120. In triangle BTC, angle BTC is 30. By the alternate segment theorem angle TDC is 30. In triangle TCD, angle CTD is 90, so CD is a diameter.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 7 · Proof<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Prove that CD is a diameter<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">TA is a tangent at T. B, C and D lie on a straight line. Use the angles shown.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we7.o1 }};transform:{{ we.we7.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">∡BCT = 180° − 60° = 120°  (angles on the straight line BCD)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we7.o2 }};transform:{{ we.we7.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">In △BTC: ∡BTC = 180° − 30° − 120° = 30°<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we7.o3 }};transform:{{ we.we7.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">∡TDC = ∡BTC = 30°  (alternate segment theorem)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we7.o4 }};transform:{{ we.we7.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">In △TCD: ∡CTD = 180° − 60° − 30° = 90°, the angle in a semicircle, so <b>CD is a diameter<\u002Fb>. ∎<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we7.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we7.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border-radius:calc(var(--radius-lg) * 2);padding:32px;display:flex;align-items:center;justify-content:center;\"><img src=\"8c2408a4-c559-47b1-be07-04ab84c919f7\" alt=\"Tangent TA with secant BCD\" style=\"max-width:100%;max-height:100%;object-fit:contain;display:block;\"><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Worked example 8: Prove 2x − y = 90°\" data-screen-label=\"37 19.4 Worked example 8: Prove 2x − y = 90°\" data-speaker-notes=\"Worked example 8, a harder proof. Angle CTD is 90 because CD is a diameter. Angle TDC is 90 minus x. By the alternate segment theorem angle BTC is 90 minus x. The angles in triangle BCT give 2x minus y equals 90.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 8 · Proof<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Show that 2x − y = 90°<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">O is the centre and BT is a tangent at T. x = ∡TCD and y = ∡TBC. Show that 2x − y = 90°.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we8.o1 }};transform:{{ we.we8.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">∡CTD = 90°  (CD passes through O: angle in a semicircle)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we8.o2 }};transform:{{ we.we8.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">∡TDC = 180° − 90° − x = 90° − x  (angles in △CTD)<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we8.o3 }};transform:{{ we.we8.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">∡BTC = ∡TDC = 90° − x  (alternate segment); ∡BCT = 180° − x<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.we8.o4 }};transform:{{ we.we8.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">△BCT: y + (180° − x) + (90° − x) = 180°, so <b>2x − y = 90°<\u002Fb>. ∎<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we8.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we8.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border-radius:calc(var(--radius-lg) * 2);padding:32px;display:flex;align-items:center;justify-content:center;\"><img src=\"85c54a2a-b99e-448c-89a5-289d37882f3c\" alt=\"Tangent BT with diameter CD\" style=\"max-width:100%;max-height:100%;object-fit:contain;display:block;\"><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"19.4 Challenge: Two circles\" data-screen-label=\"38 19.4 Challenge: Two circles\" data-speaker-notes=\"A stretch exam question. Use the alternate segment theorem in each circle and the angles at D. x works out to 103 degrees.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:80px 110px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:72px;\">\n<div style=\"display:flex;flex-direction:column;gap:26px;\"><div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Challenge<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">19.4 · Angle properties of circles<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Two circles on one tangent line<\u002Fh2><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 30px;font-size:30px;line-height:1.45;text-wrap:pretty;\">Two circles touch line AB at T and S and meet at D. Find x.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;\"><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.two.o1 }};transform:{{ we.two.t1 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Left circle, alternate segment at T: the 37° and 60° angles give ∡EDT = 60°.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.two.o2 }};transform:{{ we.two.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Right circle, alternate segment at S: the 80° angle gives ∡TDC = 43°.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:baseline;font-size:29px;line-height:1.4;opacity:{{ we.two.o3 }};transform:{{ we.two.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-700);min-width:28px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Angles at D: <b>x = 60° + 43° = 103°<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.two.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"font-size:28px;padding:16px 36px;border-radius:999px;\" sc-camel-on-click=\"{{ we.two.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border-radius:calc(var(--radius-lg) * 2);padding:32px;display:flex;align-items:center;justify-content:center;\"><img src=\"9d1252ef-d1d8-4005-92c1-de08fd0a27e4\" alt=\"Two circles touching line AB\" style=\"max-width:100%;max-height:100%;object-fit:contain;display:block;\"><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Explore: Circle Theorems Lab\" data-screen-label=\"39 Circle Theorems Lab\" data-speaker-notes=\"Explore the SBS Mathematics Department's Circle Theorems Lab. Drag the points to see each theorem update live. If the embedded view does not load on your network, use the Open in new tab button.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:56px 80px;display:flex;flex-direction:column;gap:24px;\">\n<div style=\"display:flex;align-items:center;gap:24px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Live lab<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">SBS Mathematics · Circle Theorems<\u002Fh2><a href=\"https://sbs-mathematics-dept.github.io/SBS-Math-IGCSE-0580/labs/circle-theorems.html\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"margin-left:auto;font-size:26px;padding:14px 32px;border-radius:999px;white-space:nowrap;\">Open in new tab ↗<\u002Fa><\u002Fdiv>\n<div style=\"flex:1;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);overflow:hidden;\"><iframe src=\"https://sbs-mathematics-dept.github.io/SBS-Math-IGCSE-0580/labs/circle-theorems.html\" title=\"Circle Theorems Lab\" loading=\"lazy\" style=\"width:100%;height:100%;border:0;display:block;\"><\u002Fiframe><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Memory card: Circle theorems\" data-screen-label=\"40 Memory card\" data-speaker-notes=\"All the circle theorems on one card, each with its moving diagram. Semicircle is ninety. Centre is double. Same segment equal. Cyclic quad opposite angles 180. Tangent meets radius at 90. Two tangents equal. Perpendicular from centre bisects a chord. Alternate segment.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:56px 90px;display:flex;flex-direction:column;gap:24px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Memory card<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">All the circle theorems<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Every theorem at a glance<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;flex:1;min-height:0;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"semicircle\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">1.<\u002Fspan> Angle in a semicircle = 90°<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"centre\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">2.<\u002Fspan> Angle at centre = 2 × angle at circumference<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"segment\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">3.<\u002Fspan> Angles in the same segment are equal<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"cyclic\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">4.<\u002Fspan> Cyclic quad: opposite angles = 180°<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"tangent\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">5.<\u002Fspan> Tangent meets radius at 90°<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"tangents\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">6.<\u002Fspan> Two tangents from a point are equal<\u002Fspan><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:0;\"><div style=\"flex:1;display:flex;min-height:0;\"><x-import component-from-global-scope=\"c19-anim\" kind=\"chord\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><span style=\"font-size:24px;font-weight:700;line-height:1.3;text-wrap:pretty;\"><span style=\"color:var(--color-accent-700);\">7.<\u002Fspan> ⊥ from centre bisects a chord<\u002Fspan><\u002Fdiv><div style=\"background:var(--color- t-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Quiz · Mixed<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Questions 16–18<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:22px;flex:1;\">\n<sc-for list=\"{{ qs.s6 }}\" as=\"q\" hint-placeholder-count=\"3\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 34px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;\"><div style=\"display:flex;gap:20px;align-items:baseline;\"><span style=\"font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);white-space:nowrap;\">{{ q.num }}<\u002Fspan><p style=\"font-size:32px;line-height:1.35;margin:0;text-wrap:pretty;\">{{ q.text }}<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input class=\"input\" value=\"{{ q.val }}\" sc-camel-on-input=\"{{ q.onInput }}\" sc-camel-on-key-down=\"{{ q.onKey }}\" placeholder=\"Your answer\" style=\"font-size:28px;padding:12px 24px;border-radius:999px;width:320px;border:2px solid var(--color-accent-300);background:var(--color-bg);font-family:var(--font-body);\"><button class=\"btn btn-primary\" style=\"font-size:26px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ q.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"font-size:26px;padding:12px 26px;border-radius:999px;\" sc-camel-on-click=\"{{ q.show }}\">Show answer<\u002Fbutton><span style=\"font-size:28px;font-weight:700;color:{{ q.fbCol }};\">{{ q.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Cheat sheet\" data-screen-label=\"48 Cheat sheet\" data-speaker-notes=\"The one-page cheat sheet. All the circle theorems, the problem steps and the symmetry rules in one place for revision.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:64px 100px;display:flex;flex-direction:column;gap:28px;\">\n<div style=\"display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Cheat sheet<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--color-neutral-700);white-space:nowrap;\">Chapter 19 on one page<\u002Fspan><\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Everything on one page<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;flex:1;\">\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:34px 38px;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);\">Circle theorems<\u002Fspan><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Angle in a semicircle = 90°<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Centre = 2 × circumference<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Same segment → equal<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Cyclic quad: opposite angles = 180°<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Exterior angle = interior opposite<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Tangent ⊥ radius<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Alternate segment: tangent–chord = angle in alternate segment<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:34px 38px;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);\">Problem steps<\u002Fspan><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\"><b>Chord<\u002Fb>  Drop ⊥ from O → half the chord → Pythagoras.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\"><b>Tangent<\u002Fb>  Mark 90° at the point of contact → equal tangents give an isosceles triangle → solve.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\"><b>Two tangents are equal<\u002Fb>; ⊥ from the centre bisects a chord; equal chords are equidistant.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:34px 38px;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);\">Symmetry<\u002Fspan><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Line symmetry = fold &amp; match.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Rotational order = matches in one 360° turn.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Regular <i>n<\u002Fi>-gon: <i>n<\u002Fi> lines, order <i>n<\u002Fi>.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Plane of symmetry = 3D mirror cut.<\u002Fp><p style=\"font-size:28px;line-height:1.4;margin:0;text-wrap:pretty;\">Cuboid 3 · cylinder ∞ · sphere ∞<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Well done\" data-screen-label=\"49 Well done\" data-speaker-notes=\"Closing slide. You can now recognise symmetry in 2D and 3D and use all the circle theorems. Keep practising with the spinner, the chord explorer, the drag-the-point theorems, the Circle Theorems Lab and the quiz.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent);padding:100px 120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;\">\n<div style=\"position:absolute;right:-160px;top:-180px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-400);\"><\u002Fdiv>\n<div style=\"position:absolute;right:300px;bottom:-240px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-600);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\">Chapter 19 complete<\u002Fspan>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:24px;max-width:1100px;\"><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:150px;line-height:1.05;margin:0;text-wrap:pretty;\">Well done!<\u002Fh2><p style=\"font-size:38px;line-height:1.4;margin:0;text-wrap:pretty;\">You can now recognise symmetry in 2D and 3D and use all the circle theorems. Keep practising with the spinner, the chord explorer, the Circle Theorems Lab and the quiz.<\u002Fp><\u002Fdiv>\n<span style=\"position:relative;font-size:26px;\">Cambridge IGCSE™ Mathematics 0580 · Chapter 19 · Symmetry &amp; circles<\u002Fspan>\n<\u002Fsection>\n<\u002Fx-import>\n<a data-nav=\"\" href=\"../chapters.html\" style=\"position:fixed;top:18px;left:18px;z-index:2147483600;display:flex;align-items:center;gap:10px;padding:12px 24px 12px 18px;border-radius:999px;background:color-mix(in oklch, var(--color-bg) 55%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);font-family:var(--font-body);font-weight:800;font-size:18px;text-decoration:none;box-shadow:var(--shadow-sm);\" style-hover=\"background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>All chapters<\u002Fa>\n<button data-nav=\"\" aria-label=\"Previous slide\" sc-camel-on-click=\"{{ prevSlide }}\" style=\"position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:2147483600;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button data-nav=\"\" aria-label=\"Next slide\" sc-camel-on-click=\"{{ nextSlide }}\" style=\"position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:2147483600;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STEPS = { warm: 1, ex: 1, solids: 1, we1: 4, we2: 3, we3: 4, we4: 4, ext: 3, we5: 3, we6: 3, we7: 4, we8: 4, two: 3 };\nconst SHAPES = [['Triangle', 'tri', 3], ['Square', 'square', 4], ['Pentagon', 'pent', 5], ['Hexagon', 'hex', 6], ['Rectangle', 'rect', 2], ['Parallelogram', 'para', 2], ['Isosceles', 'iso', 1]];\nconst QUIZ = [\n  ['What is the order of rotational symmetry of a regular hexagon?', ['6']],\n  ['How many lines of symmetry does a regular pentagon have?', ['5']],\n  ['How many planes of symmetry does a cuboid (all edges different) have?', ['3']],\n  ['A chord is 5 cm from the centre of a circle of radius 13 cm. Find the chord length (cm).', ['24']],\n  ['A chord of length 16 cm is drawn in a circle of radius 10 cm. How far is it from the centre (cm)?', ['6']],\n  ['The perpendicular from the centre to a chord always does what to the chord? (one word)', ['bisects', 'bisect', 'cuts in half', 'halves', 'cuts it in half']],\n  ['A tangent from P is 8 cm; the radius is 6 cm. Find OP, the distance to the centre (cm).', ['10']],\n  ['Two tangents are drawn from a point M. One is 9 cm long. How long is the other (cm)?', ['9']],\n  ['A tangent meets the radius at the point of contact. What is that angle (degrees)?', ['90']],\n  ['AB is a diameter and C is on the circle. What is ∡ACB (degrees)?', ['90']],\n  ['The angle at the circumference on an arc is 35°. Find the angle at the centre on the same arc.', ['70']],\n  ['The angle at the centre is 140°. Find the angle at the circumference on the same arc.', ['70']],\n  ['One angle of a cyclic quadrilateral is 85°. Find its opposite angle (degrees).', ['95']],\n  ['Two angles stand on the same arc, in the same segment. One is 48°. Find the other (degrees).', ['48']],\n  ['The interior opposite angle of a cyclic quadrilateral is 110°. Find the exterior angle (degrees).', ['110']],\n  ['The angle between a tangent and a chord is 62°. Find the angle in the alternate segment (degrees).', ['62']],\n  ['Two tangents from P meet at 50°. Find the angle AOB at the centre of the kite OAPB (degrees).', ['130']],\n  ['Which theorem says an angle drawn on the diameter is 90°? (name it in a few words)', ['semicircle', 'angle in a semicircle', 'angle in semicircle', 'thales']]\n];\nfunction isRight(v, ans) {\n  const s = String(v || '').toLowerCase().replace(/[°º]|degrees?|cm/g, '').trim();\n  if (!s) return null;\n  if (/^\\d/.test(ans[0])) { const n = parseFloat(s); return !isNaN(n) && Math.abs(n - Number(ans[0])) < 0.051; }\n  return ans.some(a => s.includes(a));\n}\nclass Component extends DCLogic {\n  state = { st: {}, qv: {}, qr: {}, shape: 'square', sp: 0, d: 3 };\n  setStep(k, v) { this.setState(p => ({ st: { ...p.st, [k]: v } })); }\n  renderVals() {\n    const S = this.state, we = {};\n    for (const k in STEPS) {\n      const n = STEPS[k], s = S.st[k] || 0;\n      const o = { step: s, more: s < n, next: () => this.setStep(k, Math.min(n, s + 1)), reset: () => this.setStep(k, 0),\n        toggle: () => this.setStep(k, s ? 0 : n), label: s ? 'Hide the answers' : 'Reveal the answers', anim: s ? '' : '0' };\n      for (let i = 1; i <= n; i++) { o['o' + i] = s >= i ? 1 : 0; o['t' + i] = s >= i ? 'none' : 'translateY(14px)'; }\n      we[k] = o;\n    }\n    we.solids.label = we.solids.step ? 'Hide' : 'Reveal planes of symmetry';\n    const quiz = QUIZ.map(([text, ans], i) => {\n      const r = S.qr[i];\n      const check = () => this.setState(p => ({ qr: { ...p.qr, [i]: isRight(p.qv[i], ans) === true ? 'ok' : (isRight(p.qv[i], ans) === null ? 'empty' : 'no') } }));\n      return { num: 'Question ' + (i + 1), text, val: S.qv[i] || '',\n        onInput: e => { const v = e.target.value; this.setState(p => ({ qv: { ...p.qv, [i]: v }, qr: { ...p.qr, [i]: undefined } })); },\n        onKey: e => { if (e.key === 'Enter') check(); }, check,\n        show: () => this.setState(p => ({ qr: { ...p.qr, [i]: 'show' } })),\n        fb: r === 'ok' ? '✓ Correct!' : r === 'no' ? '✗ Not quite — try again' : r === 'empty' ? 'Type an answer first' : r === 'show' ? 'Answer: ' + ans[0] + (/^\\d/.test(ans[0]) ? '' : '') : '',\n        fbCol: r === 'ok' || r === 'show' ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)' };\n    });\n    const qs = {}; for (let k = 0; k < 6; k++) qs['s' + (k + 1)] = quiz.slice(k * 3, k * 3 + 3);\n    const sh = SHAPES.find(x => x[1] === S.shape), n = sh[2];\n    const spin = { shape: S.shape, step: S.sp, order: S.sp >= n ? String(n) : '?',\n      msg: S.sp === 0 ? 'Each press turns the shape by 360° ÷ order. Count how many presses bring it back to the start — that is the order of rotational symmetry.' : S.sp < n ? 'It fits its outline again. Keep turning until the green dot is back where it started.' : S.sp === n ? (n === 1 ? 'Only a full 360° turn brings it back: order 1, so no rotational symmetry.' : 'Back to the start after ' + n + ' steps — order ' + n + '.') : 'You have gone past one full turn. Press Reset to count again.',\n      rotate: () => this.setState(p => ({ sp: p.sp + 1 })), reset: () => this.setState({ sp: 0 }),\n      shapes: SHAPES.map(([label, key]) => ({ label, pick: () => this.setState({ shape: key, sp: 0 }), bg: key === S.shape ? 'var(--color-accent)' : 'var(--color-bg)', col: key === S.shape ? 'var(--color-bg)' : 'var(--color-text)' })) };\n    const d = S.d, half = Math.sqrt(49 - d * d);\n    const chord = { d: d.toFixed(1), half: half.toFixed(2), len: (2 * half).toFixed(2), d2: (d * d).toFixed(2), h2: (49 - d * d).toFixed(2),\n      onInput: e => this.setState({ d: Number(e.target.value) }) };\n    const deck = () => document.querySelector('deck-stage');\n    return { we, qs, spin, chord, prevSlide: () => deck() && deck().prev(), nextSlide: () => deck() && deck().next() };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
