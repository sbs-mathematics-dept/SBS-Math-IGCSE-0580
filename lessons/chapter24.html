stify-content:center;background:color-mix(in oklch, var(--color-bg) 45%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid color-mix(in oklch, var(--color-text) 18%, transparent);color:var(--color-text);cursor:pointer;padding:0;box-shadow:var(--shadow-sm);\" style-hover=\"opacity:1;background:color-mix(in oklch, var(--color-bg) 85%, transparent);\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:50%;height:50%;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst STEPS = {\"gs1\":1,\"gs23\":2,\"we1\":4,\"e241a\":4,\"e241b\":2,\"dcp\":2,\"lt5\":1,\"we2\":2,\"we3\":3,\"q17\":3,\"q18\":3,\"e242q4\":5,\"e242q5\":4,\"freq\":1,\"vsv\":4,\"we4\":4,\"we5\":7,\"e243q1\":5,\"e243q2\":4,\"e243b\":5,\"e243c\":13,\"e243q7\":4,\"e243q8\":4,\"restrict\":2,\"we6\":3,\"we6c\":2,\"cond\":4,\"we8\":4,\"e244q1\":4,\"e244q2\":3,\"e244b\":8,\"e244q5\":5,\"e244q6\":3,\"e244c\":3,\"e244d\":4,\"e244e\":4,\"e244q13\":4,\"pq1\":2,\"pq24\":7,\"pq3\":3,\"pq5\":4,\"pq6\":3,\"pq7\":3};\nconst PAL = ['var(--color-accent-200)','var(--c22-teal-l)','var(--c22-pink-l)','var(--c22-yellow-l)','var(--c22-purple-l)','var(--c22-blue-l)','var(--color-accent-2-200)'];\nconst SUP = s => String(s).replace(/[-0-9]/g, c => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]);\nconst QUIZ = [\"1/2\",\"1/6\",\"1/3\",\"0.7\",\"1/4\",\"0.16\",\"8\",\"1/12\",\"1/2\",\"1/5\",\"9/10\",\"8\",\"3/10\",\"1/10\",\"1/4\",\"1/6\"];\nconst nums = s => (String(s || '').replace(/[−–]/g, '-').match(/-?\\d+(?:\\.\\d+)?/g) || []).map(Number);\nfunction isRight(v, ans) { const a = nums(ans).sort((x, y) => x - y), u = nums(v).sort((x, y) => x - y); if (!u.length) return null; return u.length === a.length && a.every((x, i) => Math.abs(x - u[i]) < 0.051); }\nconst r3 = v => { if (v === 0) return '0'; const d = Math.max(0, 2 - Math.floor(Math.log10(Math.abs(v)))); return String(+v.toFixed(d)); };\nclass Component extends DCLogic {\n  state = { st: {}, qv: {}, qr: {}, br: 3, bb: 2, brep: 0 };\n  setStep(k, v) { this.setState(p => ({ st: { ...p.st, [k]: v } })); }\n  renderVals() {\n    const S = this.state, we = {};\n    for (const k in STEPS) {\n      const n = STEPS[k], s = S.st[k] || 0;\n      const o = { step: s, next: () => this.setStep(k, Math.min(n, s + 1)), reset: () => this.setStep(k, 0), toggle: () => this.setStep(k, s ? 0 : n), label: s ? 'Hide the answers' : 'Reveal the answers' };\n      for (let i = 1; i <= n; i++) { o['o' + i] = s >= i ? 1 : 0; o['t' + i] = s >= i ? 'none' : 'translateY(22px) scale(.96)'; }\n      we[k] = o;\n    }\n    const qz = {};\n    QUIZ.forEach((ans, i) => {\n      const r = S.qr[i];\n      const check = () => this.setState(p => { const res = isRight(p.qv[i], ans); return { qr: { ...p.qr, [i]: res === true ? 'ok' : res === null ? 'empty' : 'no' } }; });\n      qz['q' + i] = { val: S.qv[i] || '', check,\n        onInput: e => { const v = e.target.value; this.setState(p => ({ qv: { ...p.qv, [i]: v }, qr: { ...p.qr, [i]: undefined } })); },\n        onKey: e => { e.stopPropagation(); if (e.key === 'Enter') check(); },\n        show: () => this.setState(p => ({ qr: { ...p.qr, [i]: 'show' } })),\n        fb: r === 'ok' ? '✓ Correct!' : r === 'no' ? '✗ Not quite — try again' : r === 'empty' ? 'Type an answer first' : r === 'show' ? 'Answer: ' + ans.replace(/-/g, '−') : '',\n        fbCol: r === 'ok' || r === 'show' ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)' };\n    });\n    const R = S.br, Bn = S.bb, rep = S.brep, n = R + Bn, n2 = rep ? n : n - 1, same = rep ? R * R + Bn * Bn : R * (R - 1) + Bn * (Bn - 1), g = (x, y) => { while (y) [x, y] = [y, x % y]; return x; }, gg = g(same, n * n2);\n    const tv = { r: R, b: Bn, rep, val: R + ',' + Bn + ',' + rep, repLab: rep ? 'With replacement' : 'Without replacement',\n      msg: 'P(same colour) = ' + same + '/' + (n * n2) + (gg > 1 && same ? ' = ' + same / gg + '/' + (n * n2) / gg : ''),\n      onR: e => this.setState({ br: Number(e.target.value) }), onB: e => this.setState({ bb: Number(e.target.value) }), onRep: () => this.setState(p => ({ brep: p.brep ? 0 : 1 })) };\n    const deck = () => document.querySelector('deck-stage');\n    return { we, qz, tv, prevSlide: () => deck() && deck().prev(), nextSlide: () => deck() && deck().next() };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
