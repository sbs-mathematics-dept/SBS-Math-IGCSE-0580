document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box- ral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 :var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Lesson objectives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.04;margin:0;text-wrap:pretty;\">In this chapter you will…<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;gap:24px;align-items:center;\"><span style=\"flex:none;width:116px;height:116px;border-radius:50%;background:var(--color-accent-600);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;\">24.1<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-800);\">Tree diagrams<\u002Fspan><p style=\"font-size:30px;line-height:1.3;margin:0;text-wrap:pretty;\">Use tree diagrams to show all possible outcomes of combined events<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;gap:24px;align-items:center;\"><span style=\"flex:none;width:116px;height:116px;border-radius:50%;background:var(--c22-teal);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;\">24.2<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-2-800);\">Probability from trees<\u002Fspan><p style=\"font-size:30px;line-height:1.3;margin:0;text-wrap:pretty;\">Calculate the probability of simple combined events using tree diagrams<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;gap:24px;align-items:center;\"><span style=\"flex:none;width:116px;height:116px;border-radius:50%;background:var(--c22-pink);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;\">24.3<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-800);\">Venn diagrams<\u002Fspan><p style=\"font-size:30px;line-height:1.3;margin:0;text-wrap:pretty;\">Show outcomes and calculate probabilities using Venn diagrams<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;gap:24px;align-items:center;\"><span style=\"flex:none;width:116px;height:116px;border-radius:50%;background:var(--c22-purple);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;\">24.4<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:27px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-2-800);\">Conditional probability<\u002Fspan><p style=\"font-size:30px;line-height:1.3;margin:0;text-wrap:pretty;\">Use tree diagrams, Venn diagrams and two-way tables to calculate conditional probability<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--c22-yellow-l);border-radius:var(--radius-lg);padding:18px 28px;font-size:32px;line-height:1.4;\"><b>Key word<\u002Fb>  conditional probability<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Prior knowledge\" data-screen-label=\"03 Prior knowledge\" data-speaker-notes=\"Check these skills before you start: probability from Chapter 8, sets and Venn diagrams from Chapter 9, and multiplying and adding fractions.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Prior knowledge<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">Before you start<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.04;margin:0;text-wrap:pretty;\">What you need to remember<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Probability (Ch 8)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">P(event) = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">favourable outcomes<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">total outcomes<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Independent events<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">P(A and then B) = P(A) × P(B)<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Mutually exclusive<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">Cannot happen together: P(A or B) = P(A) + P(B)<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Venn diagrams (Ch 9)<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">ℰ is the universal set. A ∩ B is in both; A ∪ B is in either or both.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Complement<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">P(not A) = 1 − P(A); A′ is everything outside A.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Fractions<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\"><span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">2<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">3<\u002Fspan><\u002Fspan> × <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">3<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">4<\u002Fspan><\u002Fspan> = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">6<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">12<\u002Fspan><\u002Fspan> = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">2<\u002Fspan><\u002Fspan> · <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">4<\u002Fspan><\u002Fspan> + <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">4<\u002Fspan><\u002Fspan> = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">2<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Warm-up\" data-screen-label=\"04 Warm-up\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:1 :flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q2.val }}\" sc-camel-on-input=\"{{ qz.q2.onInput }}\" sc-camel-on-key-down=\"{{ qz.q2.onKey }}\" placeholder=\"Your answer\" style=\"font-size:30px;padding:12px 22px;border-radius:999px;border:3px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:260px;font-family:var(--font-body);font-weight:700;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q2.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 22px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q2.show }}\">Show answer<\u002Fbutton><span style=\"font-size:29px;font-weight:800;color:{{ qz.q2.fbCol }};\">{{ qz.q2.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 30px;display:flex;flex-direction:column;gap:12px;\"><span style=\"font-size:24px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);\">Question 4<\u002Fspan><p style=\"flex:none;font-size:33px;line-height:1.36;margin:0;text-wrap:pretty;\">P(rain) = 0.3. Find P(no rain).<\u002Fp><div style=\"flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q3.val }}\" sc-camel-on-input=\"{{ qz.q3.onInput }}\" sc-camel-on-key-down=\"{{ qz.q3.onKey }}\" placeholder=\"Your answer\" style=\"font-size:30px;padding:12px 22px;border-radius:999px;border:3px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:260px;font-family:var(--font-body);font-weight:700;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q3.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 22px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q3.show }}\">Show answer<\u002Fbutton><span style=\"font-size:29px;font-weight:800;color:{{ qz.q3.fbCol }};\">{{ qz.q3.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Probability and risk\" data-screen-label=\"05 Probability and risk\" data-speaker-notes=\"The probability of heads when you toss one coin is 0.5. What about heads only when you toss two, three or 20 coins? Probability matters in real life, especially for understanding risk. If a gene doubles your chance of a disease, ask what the chance was to begin with: 2 in 1 000 000 instead of 1 in 1 000 000 has doubled, but is still very low.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Probability and risk<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">Chapter 24<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:58px;line-height:1.04;margin:0;text-wrap:pretty;\">Why combined events matter<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;\"><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Tossing coins<\u002Fspan><div style=\"font-size:32px;line-height:1.38;text-wrap:pretty;\">P(heads) with one coin is 0.5. What is the probability of getting only heads when you toss two, three or 20 coins at the same time?<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Relative risk<\u002Fspan><div style=\"font-size:32px;line-height:1.38;text-wrap:pretty;\">A gene doubles your chance of a disease. If the chance was 1 in 1 000 000, it is now 2 in 1 000 000: doubled, but still very low.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-200);border-radius:var(--radius-lg);padding:16px 26px;font-size:30px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-800);\">Tip  <\u002Fb>In this chapter you use diagrams to show every possible outcome and to calculate the probability of combined events.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Getting started Q1\" data-screen-label=\"06 Getting started Q1\" data-speaker-notes=\"Getting started question 1. A is not correct: sunny and not sunny are not equally likely. B is not correct: guessing gives 10 correct on average, but it is not certain. C is correct: there are 360 ways to get four different numbers but only 1 way to get four sixes. D is not correct: each toss is independent, so tails still has probability 0.5.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Getting started<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">Question 1<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.04;margin:0;text-wrap:pretty;\">True or not?<\u002Fh2><div style=\"flex:none;background:var(--c22-yellow-l);border:3px solid var(--c22-yellow-d);border-radius:var(--radius-lg);padding:14px 24px;display:flex;flex-direction:column;gap:10px;font-weight:700;\"><b style=\"font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-800);\">Question<\u002Fb><div style=\"font-size:31px;line-height:1.4;text-wrap:pretty;\">1 Here are four statements about probability.<\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,1280px),1fr));gap:8px 16px;margin-top:4px;\"><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--color-accent-600);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">a<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\">Read each statement carefully and decide whether it is correct or not.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--c22-teal);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">b<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\"><span style=\"white-space:nowrap;\">Explain your decisions to a partner.<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;\"><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:10px;\"><b style=\"font-size:28px;color:var(--color-accent-800);\">Statement A<\u002Fb><p style=\"font-size:26px;line-height:1.35;margin:0;text-wrap:pretty;\">Tomorrow it will either be sunny or not sunny. The probability that it will be sunny is 0.5.<\u002Fp><div style=\"font-size:25px;line-height:1.3;font-weight:800;color:var(--color-accent-2-800);background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:8px 14px;opacity:{{ we.gs1.o1 }};transform:{{ we.gs1.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">Not correct: the two outcomes are not equally likely.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:10px;\"><b style=\"font-size:28px;color:var(--color-accent-800);\">Statement B<\u002Fb><p style=\"font-size:26px;line-height:1.35;margin:0;text-wrap:pretty;\">In a true or false test with 20 questions, you are certain to get 10 correct if you just guess.<\u002Fp><div style=\"font-size:25px;line-height:1.3;font-weight:800;color:var(--color-accent-2-800);background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:8px 14px;opacity:{{ we.gs1.o1 }};transform:{{ we.gs1.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">Not correct: 10 is the average, not a certainty.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:10px;\"><b style=\"font-size:28px;color:var(--color-accent-800);\">Statement C<\u002Fb><p style=\"font-size:26px;line-height:1.35;margin:0;text-wrap:pretty;\">If you roll a fair dice four times, you are more likely to get four different numbers than four sixes in a row.<\u002Fp><div style=\"font-size:25px;line-height:1.3;font-weight:800;color:var(--color-accent-2-800);background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:8px 14px;opacity:{{ we.gs1.o1 }};transform:{{ we.gs1.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">Correct: <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">360<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">1296<\u002Fspan><\u002Fspan> compared with <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">1296<\u002Fspan><\u002Fspan>.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:10px;\"><b style=\"font-size:28px;color:var(--color-accent-800);\">Statement D<\u002Fb><p style=\"font-size:26px;line-height:1.35;margin:0;text-wrap:pretty;\">If you toss a coin five times and the first four tosses are heads, your next toss is more likely to be tails.<\u002Fp><div style=\"font-size:25px;line-height:1.3;font-weight:800;color:var(--color-accent-2-800);background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:8px 14px;opacity:{{ we.gs1.o1 }};transform:{{ we.gs1.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">Not correct: each toss is independent, P(tails) = 0.5.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:16px 38px;border-radius:999px;\" sc-camel-on-click=\"{{ we.gs1.toggle }}\">{{ we.gs1.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Getting started Q2–Q3\" data-screen-label=\"07 Getting started Q2–Q3\" data-speaker-notes=\"Getting started questions 2 and 3. a is the universal set, b is set A, c is the intersection A and B, d is the region outside both sets, and e is set B. n of A is the number of elements in A. A union B is everything in A or B or both. A intersection B is what is in both.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 96px;display:grid;grid-template-columns:minmax(0,1fr) 627px;gap:48px;\">\n<div data-deco=\"\" style=\"p ng<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.04;margin:0;text-wrap:pretty;\">Hard work beats talent<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;\"><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Reflection<\u002Fspan><div style=\"font-size:30px;line-height:1.38;text-wrap:pretty;\">Research findings suggest that to be successful at maths in school, natural talent is much less important than working hard, preparing well and having confidence.<br><br>• What does this suggest about perseverance and struggle?<br>• How can you use this finding to improve your own results?<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">LINK: health and medicine<\u002Fspan><div style=\"font-size:30px;line-height:1.38;text-wrap:pretty;\">The probability that medical tests are accurate is very high, but it is rarely 100%, and an incorrect test result can have really serious implications.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Investigation: frequency trees\" data-screen-label=\"23 Investigation: frequency trees\" data-speaker-notes=\"Investigation. Frequency trees show actual frequencies, not probabilities. Out of 83 patients, 31 thought they had a cold and 52 thought they had COVID-19. Of the 52, only 32 had COVID-19, so 20 had a cold. Of the 31, 13 had COVID-19, so 18 had a cold. The probability that someone who thinks they have COVID-1 ;right:300px;bottom:-280px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:180px;top:330px;width:150px;height:150px;border-radius:50%;background:var(--color-accent-2-500);\"><\u002Fdiv><span data-deco=\"\" style=\"position:absolute;right:120px;top:120px;font-family:var(--font-heading);font-size:260px;line-height:1;color:var(--color-accent-700);\">24.3<\u002Fspan>\n<span style=\"font-size:34px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);\">Lesson 24.3<\u002Fspan>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:120px;line-height:1;margin:0;max-width:1150px;text-wrap:pretty;\">Calculating probability from Venn diagrams<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:1100px;\"><span style=\"font-size:32px;font-weight:800;color:var(--color-accent-800);\">In this lesson you will<\u002Fspan><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">read n(A), A ∩ B and A ∪ B from a Venn diagram<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent-2);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">turn counts into probabilities<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">use ‘and’, ‘or’ and ‘neither’ as clues<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Probability from a Venn diagram\" data-screen-label=\"26 Probability from a Venn diagram\" data-speaker-notes=\"This Venn diagram shows a survey about programme A and programme B. The universal set is the sample space: 40 plus 30 plus 20 plus 10 is 100 people. n of A is 40 plus 30, which is 70, so P of A is 70 over 100, 0.7. Remember to include the intersection. A intersection B is the elements in both: P of A and B is 30 over 100, 0.3. The word and is a clue for the intersection. A union B is everything in either set: 90 over 100, 0.9. The word or is a clue for the union. Neither, or is not, means the complement: P of neither is 1 minus P of A union B.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 96px;display:grid;grid-template-columns:minmax(0,1fr) 594px;gap:48px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:22px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Probability from a Venn diagram<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">24.3<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:48px;line-height:1.04;margin:0;text-wrap:pretty;\">Count, then divide by the total<\u002Fh2><div style=\"flex:none;background:var(--c22-yellow-l);border:3px solid var(--c22-yellow-d);border-radius:var(--radius-lg);padding:14px 24px;display:flex;flex-direction:column;gap:10px;font-weight:700;\"><b style=\"font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-800);\">Question<\u002Fb><div style=\"font-size:31px;line-height:1.4;text-wrap:pretty;\">The Venn diagram shows how many people in a survey watch programme A and programme B. A person is chosen at random. Find:<\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,397px),1fr));gap:8px 16px;margin-top:4px;\"><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--color-accent-600);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">a<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\"><span style=\"white-space:nowrap;\">P(A)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--c22-teal);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">b<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\"><span style=\"white-space:nowrap;\">P(A ∩ B)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--c22-pink);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">c<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\"><span style=\"white-space:nowrap;\">P(A ∪ B)<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;background:var(--color-surface);border-radius:var(--radius-lg);padding:4px 14px;min-height:50px;\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:var(--c22-purple);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;\">d<\u002Fspan><span style=\"font-size:31px;line-height:1.3;\"><span style=\"white-space:nowrap;\">P(neither A nor B)<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"flex:none;font-size:27px;line-height:1.4;margin:0;text-wrap:pretty;\">Total (the sample space ℰ): 40 + 30 + 20 + 10 = 100 people.<\u002Fp><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:34px;row-gap:10px;align-items:center;font-size:38px;line-height:1.3;\"><div style=\"font-weight:800;white-space:nowrap;opacity:{{ we.vsv.o1 }};transform:{{ we.vsv.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">a  P(A) = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">70<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">100<\u002Fspan><\u002Fspan> = 0.7<\u002Fdiv><div style=\"color:var(--color-accent-2-800);font-size:32px;font-weight:700;text-wrap:pretty;opacity:{{ we.vsv.o1 }};transform:{{ we.vsv.t1 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">include the overlap<\u002Fdiv><div style=\"font-weight:800;white-space:nowrap;opacity:{{ we.vsv.o2 }};transform:{{ we.vsv.t2 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">b  P(A ∩ B) = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">30<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">100<\u002Fspan><\u002Fspan> = 0.3<\u002Fdiv><div style=\"color:var(--color-accent-2-800);font-size:32px;font-weight:700;text-wrap:pretty;opacity:{{ we.vsv.o2 }};transform:{{ we.vsv.t2 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">‘and’<\u002Fdiv><div style=\"font-weight:800;white-space:nowrap;opacity:{{ we.vsv.o3 }};transform:{{ we.vsv.t3 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">c  P(A ∪ B) = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">90<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">100<\u002Fspan><\u002Fspan> = 0.9<\u002Fdiv><div style=\"color:var(--color-accent-2-800);font-size:32px;font-weight:700;text-wrap:pretty;opacity:{{ we.vsv.o3 }};transform:{{ we.vsv.t3 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">‘or’<\u002Fdiv><div style=\"font-weight:800;white-space:nowrap;opacity:{{ we.vsv.o4 }};transform:{{ we.vsv.t4 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">d  P(neither) = 1 − 0.9 = 0.1<\u002Fdiv><div style=\"color:var(--color-accent-2-800);font-size:32px;font-weight:700;text-wrap:pretty;opacity:{{ we.vsv.o4 }};transform:{{ we.vsv.t4 }};transition:opacity .55s, transform .6s cubic-bezier(.34,1.56,.64,1);\">‘neither’<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-200);border-radius:var(--radius-lg);padding:16px 26px;font-size:25px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-800);\">Tip  <\u002Fb>1 − P(A ∪ B) is the same as P(A ∪ B)′, the complement of A ∪ B.<\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:16px 38px;border-radius:999px;\" sc-camel-on-click=\"{{ we.vsv.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:16px 38px;border-radius:999px;\" sc-camel-on-click=\"{{ we.vsv.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c24-fig\" kind=\"vsv\" step=\"{{ we.vsv.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Venn vocabulary\" data-screen-label=\"27 Venn vocabulary\" data-speaker-notes=\"n of A means the number of elements in set A. P of A means the probability that an element is in set A. A intersection B is the elements shared by A and B. A union B is the elements in either set, with none repeated. The complement A dash is everything not in A.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Vocabulary<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">24.3<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.04;margin:0;text-wrap:pretty;\">Set language for probability<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;\"><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">n(A)<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">The number of elements in set A<\u002Fspan><\u002Fdiv><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">P(A)<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">The probability an element is in A: <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">n(A)<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">n(ℰ)<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">ℰ<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">The universal set: in probability, the whole sample space<\u002Fspan><\u002Fdiv><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">A ∩ B<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">Intersection: in both A and B. P(A and B) = P(A ∩ B)<\u002Fspan><\u002Fdiv><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">A ∪ B<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">Union: in A or B or both. P(A or B) = P(A ∪ B)<\u002Fspan><\u002Fdiv><div style=\"flex:1;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">A′<\u002Fspan><span style=\"font-size:28px;line-height:1.36;text-wrap:pretty;\">Complement: everything not in A<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-200);border-radius:var(--radius-lg);padding:16px 26px;font-size:29px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-800);\">Tip  <\u002Fb>In Chapter 9 the numbers in a Venn diagram could be the elements themselves or the number of elements. In probability you usually work with the number of elements.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Worked example 4\" data-screen-label=\"28 Worked example 4\" data-speaker-notes=\"Worked example 4. Define the sets: n of the universal set is 25, n of F is 18 and n of V is 15. 18 plus 15 is 33, but only 25 people were surveyed, so 33 minus 25, which is 8, liked both. Fill in the intersection first: 8. Then fruit only is 18 minus 8, 10, and vegetables only is 15 minus 8, 7. P of both is 8 over 25, 0.32. P of F or V is 25 over 25, which is 1.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 96px;display:grid;grid-template-columns:minmax(0,1fr) 627px;gap:48px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:22px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;paddi -2-700);\">Question 12<\u002Fspan><p style=\"flex:none;font-size:33px;line-height:1.36;margin:0;text-wrap:pretty;\">30 people: 18 in A, 20 in B, all in at least one. How many in both?<\u002Fp><div style=\"flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;\"><input value=\"{{ qz.q11.val }}\" sc-camel-on-input=\"{{ qz.q11.onInput }}\" sc-camel-on-key-down=\"{{ qz.q11.onKey }}\" placeholder=\"Your answer\" style=\"font-size:30px;padding:12px 22px;border-radius:999px;border:3px solid var(--color-accent-300);background:var(--color-bg);color:var(--color-text);width:260px;font-family:var(--font-body);font-weight:700;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q11.check }}\">Check<\u002Fbutton><button class=\"btn btn-ghost\" style=\"flex:none;white-space:nowrap;font-size:27px;padding:12px 22px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q11.show }}\">Show answer<\u002Fbutton><span style=\"font-size:29px;font-weight:800;color:{{ qz.q11.fbCol }};\">{{ qz.q11.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"24.4 Conditional probability\" data-screen-label=\"38 24.4 Conditional probability\" data-speaker-notes=\"Lesson 24.4. When the probability of an event depends on an earlier outcome, the probability is conditional.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;background:var(--color-accent-200);padding:96px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;right:-200px;top:-220px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:300px;bottom:-280px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:180px;top:330px;width:150px;height:150px;border-radius:50%;background:var(--color-accent-2-500);\"><\u002Fdiv><span data-deco=\"\" style=\"position:absolute;right:120px;top:120px;font-family:var(--font-heading);font-size:260px;line-height:1;color:var(--color-accent-700);\">24.4<\u002Fspan>\n<span style=\"font-size:34px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800);\">Lesson 24.4<\u002Fspan>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:120px;line-height:1;margin:0;max-width:1150px;text-wrap:pretty;\">Conditional probability<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:1100px;\"><span style=\"font-size:32px;font-weight:800;color:var(--color-accent-800);\">In this lesson you will<\u002Fspan><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">tell independent and dependent events apart<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent-2);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">use P(B given A) = P(A and B) ÷ P(A)<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:18px;align-items:flex-start;font-size:38px;line-height:1.32;\"><span style=\"width:22px;height:22px;margin-top:14px;border-radius:50%;background:var(--color-accent);flex:none;\"><\u002Fspan><span style=\"display:block;flex:1;min-width:0;text-wrap:pretty;\">use trees, Venn diagrams and two-way tables<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Conditional probability\" data-screen-label=\"39 Conditional probability\" data-speaker-notes=\"If the probability of an event depends on the outcome of a previous event, the probability is conditional. P of B given that A has happened is the conditional probability of B happening given that A has already happened. Roll two dice: the first lands on 6. The second dice is not affected, so the events are independent and P of B given A is P of B, one sixth. With an apple, an orange and a banana, choosing the apple first leaves only the orange and banana: the second choice depends on the first.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 104px;display:flex;flex-direction:column;gap:26px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;white-space:nowrap;\">Vocabulary<\u002Fspan><span style=\"flex:none;white-space:nowrap;font-size:26px;font-weight:700;color:var(--color-accent-2-800);min-width:0;\">24.4<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.04;margin:0;text-wrap:pretty;\">Does the first event change the second?<\u002Fh2><div style=\"flex:none;background:var(--color-accent-2-100);border:4px solid var(--color-accent-2-500);border-radius:var(--radius-lg);padding:14px 26px;display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:var(--font-heading);font-size:40px;line-height:1.1;color:var(--color-accent-2-800);\">conditional probability<\u002Fspan><span style=\"font-size:31px;line-height:1.36;text-wrap:pretty;\">The probability that an event happens, given that another event has already happened: P(B given A)<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"flex:none;background:var(--color-accent-100);border:3px solid var(--color-accent-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-800);\">Independent events<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">Two dice: the first lands on 6. The second dice is not affected.<br><b>P(B given A) = P(B)<\u002Fb>, so P(second 6) = <span style=\"display:inline-flex;flex:none;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.82em;margin:0 3px;\"><span style=\"border-bottom:3px solid currentColor;padding:0 5px;white-space:nowrap;\">1<\u002Fspan><span style=\"padding:0 5px;white-space:nowrap;\">6<\u002Fspan><\u002Fspan>.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-300);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);\">Dependent events<\u002Fspan><div style=\"font-size:31px;line-height:1.38;text-wrap:pretty;\">An apple, an orange and a banana: choose two. If you take the apple first, only the orange and banana are left. The second choice depends on the first.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-200);border-radius:var(--radius-lg);padding:16px 26px;font-size:28px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-800);\">Tip  <\u002Fb>Questions with conditional probability often say ‘without replacement’ or ‘one after the other’. On a tree diagram, check whether the probabilities change after the first event.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"The rule\" data-screen-label=\"40 The rule\" data-speaker-notes=\"To find the probability of B given that A has happened, use the rule: P of B given A equals P of A and B divided by P of A. With Venn diagrams this is P of A intersection B over P of A. Given that A has happened, A becomes the new sample space, and you count only the part of B that is inside A.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;position:relative;isolation:isolate;padding:64px 96px;display:grid;grid-template-columns:minmax(0,1fr) 627px;gap:48px;\">\n<div data-deco=\"\" style=\"position:absolute;z-index:-1;left:-120px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:44px;bottom:36px;width:46px;height:46px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div data-deco=\"\" style=\"position:absolute;z-index:-1;right:104px;bottom:52px;width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:22px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;\"><span style=\"background:var(--color-accent-700);color:var(--color-bg);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:10px 26px;border-radius:999px;whit
