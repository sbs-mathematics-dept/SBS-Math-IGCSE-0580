gn-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">write direct and inverse proportion with ∝ and a constant k<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">find k and use the formula to find unknowns<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">work with squares, cubes and square roots<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.6 Writing proportion with k\" data-screen-label=\"52 21.6 Writing proportion with k\" data-speaker-notes=\"P is directly proportional to Q is written P ∝ Q, which means P = kQ. P is inversely proportional to Q means PQ = k, or P = k/Q, written P ∝ 1/Q. Exam questions often say “varies as” or “varies inversely as”.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Proportion in algebra<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.6 · Algebra<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">The ∝ symbol and the constant k<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;\"><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Direct<\u002Fspan><div style=\"font-size:33px;line-height:1.4;text-wrap:pretty;\">P ∝ Q<br>P = kQ<br>P ÷ Q = k is constant<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Inverse<\u002Fspan><div style=\"font-size:33px;line-height:1.4;text-wrap:pretty;\">P ∝ 1/Q<br>P = k/Q<br>P × Q = k is constant<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:31px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · ∝<\u002Fb>  means “is proportional to”. “Varies as” means directly proportional; “varies inversely as” means inversely proportional.<\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:30px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:28px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Four steps: 1 write y = k × (…) · 2 substitute the given pair · 3 solve for k and write the formula · 4 use the formula. Step 3 is worth a mark on its own.<\u002Fdiv><\u002Fdiv>\n<div style= n-click=\"{{ we.pq1011.toggle }}\">{{ we.pq1011.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Exam checklist\" data-screen-label=\"64 Exam checklist\" data-speaker-notes=\"The summary from the end of the chapter as a checklist. Use the self-assessment questions on your practice answers: did you show working, is it clearly laid out, would you get part marks?\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Summary<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">Are you able to…<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">Exam checklist<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;\"><div style=\"display:flex;gap:14px;align-items:baseline;font-size:31px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">simplify ratios and find missing values in equivalent ratios<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline;font-size:31px;line-height:1.35;\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--color-accent-2-700);transform:translateY(6px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">divide quantities in a given ratio<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items te(p => ({ st: { ...p.st, [k]: v } })); }\n  renderVals() {\n    const S = this.state, we = {};\n    for (const k in STEPS) {\n      const n = STEPS[k], s = S.st[k] || 0;\n      const o = { step: s, next: () => this.setStep(k, Math.min(n, s + 1)), reset: () => this.setStep(k, 0), toggle: () => this.setStep(k, s ? 0 : n), label: s ? 'Hide the answers' : 'Reveal the answers' };\n      for (let i = 1; i <= n; i++) { o['o' + i] = s >= i ? 1 : 0; o['t' + i] = s >= i ? 'none' : 'translateY(14px)'; }\n      we[k] = o;\n    }\n    const qz = {};\n    QUIZ.forEach((ans, i) => {\n      const r = S.qr[i];\n      const check = () => this.setState(p => { const res = isRight(p.qv[i], ans); return { qr: { ...p.qr, [i]: res === true ? 'ok' : res === null ? 'empty' : 'no' } }; });\n      qz['q' + i] = { val: S.qv[i] || '', check,\n        onInput: e => { const v = e.target.value; this.setState(p => ({ qv: { ...p.qv, [i]: v }, qr: { ...p.qr, [i]: undefined } })); },\n        onKey: e => { e.stopPropagation(); if (e.key === 'Enter') check(); },\n        show: () => this.setState(p => ({ qr: { ...p.qr, [i]: 'show' } })),\n        fb: r === 'ok' ? '✓ Correct!' : r === 'no' ? '✗ Not quite — try again' : r === 'empty' ? 'Type an answer first' : r === 'show' ? 'Answer: ' + ans.replace(/-/g, '−') : '',\n        fbCol: r === 'ok' || r === 'show' ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)' };\n    });\n    const T = S.T, A = S.sa, Bv = S.sb, n = A + Bv, u = T / n, f2 = v => String(+v.toFixed(2));\n    const blocks = Array.from({ length: n }, (_, i) => ({ bg: i < A ? 'var(--color-accent-300)' : 'var(--color-accent-2-300)' }));\n    const sh = { T, a: A, b: Bv, blocks, eq: 'Share ' + T + ' in the ratio ' + A + ' : ' + Bv, l1: A + ' + ' + Bv + ' = ' + n + ' parts', l2: T + ' ÷ ' + n + ' = ' + f2(u) + ' per part', l3: 'First ' + A + ' × ' + f2(u) + ' = ' + f2(A * u) + ' · Second ' + Bv + ' × ' + f2(u) + ' = ' + f2(Bv * u),\n      onT: e => this.setState({ T: Number(e.target.value) }), onA: e => this.setState({ sa: Number(e.target.value) }), onB: e => this.setState({ sb: Number(e.target.value) }) };\n    const pm = S.pm, pk = S.pk, info = { d: 'Direct: y = kx is a straight line through the origin. Double x and y doubles.', i: 'Inverse: y = k/x. Double x and y halves; xy stays constant.', q: 'y ∝ x²: double x and y is multiplied by 4. A curve through the origin.', r: 'y ∝ 1/x²: double x and y is divided by 4. Never touches the axes.' }[pm];\n    const pr = { k: pk, val: pm + ',' + pk, info, onK: e => this.setState({ pk: Number(e.target.value) }), setD: () => this.setState({ pm: 'd' }), setI: () => this.setState({ pm: 'i' }), setQ: () => this.setState({ pm: 'q' }), setR: () => this.setState({ pm: 'r' }) };\n    const deck = () => document.querySelector('deck-stage');\n    return { we, qz, sh, pr, prevSlide: () => deck() && deck().prev(), nextSlide: () => deck() && deck().next() };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
