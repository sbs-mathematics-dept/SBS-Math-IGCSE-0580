document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:100px 120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;\">\n<div style=\"position:absolute;right:-160px;top:-180px;width:860px;height:860px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<div style=\"position:absolute;right:300px;bottom:-240px;width:560px;height:560px;border-radius:50%;background:var(--color-accent-2-200);\"><\u002Fdiv>\n<div style=\"position:absolute;right:170px;top:260px;display:flex;gap:12px;\"><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent);\"><\u002Fdiv><div style=\"width:18px;\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent-2);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent-2);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent-2);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent-2);\"><\u002Fdiv><div style=\"width:62px;height:150px;border-radius:18px;background:var(--color-accent-2);\"><\u002Fdiv><\u002Fdiv>\n<span style=\"position:relative;font-size:31px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Cambridge IGCSE™ · Mathematics 0580 Extended · Year 11<\u002Fspan>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:20px;max-width:1100px;\"><span style=\"font-size:38px;font-weight:700;color:var(--color-accent-700);\">Chapter 21<\u002Fspan>\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:132px;line-height:.98;margin:0;\">Ratio, rate &amp; proportion<\u002Fh1>\n<p style=\"font-size:38px;line-height:1.4;margin:0;max-width:980px;text-wrap:pretty;\">Ratios, scales, speed, travel graphs and proportion, with exam technique for Papers 2 and 4.<\u002Fp><\u002Fdiv>\n<p style=\"position:relative;font-size:31px;color:var(--color-neutral-800);margin:0;\">Use the arrows to move · press Next step to build each diagram · type into the quiz boxes and press Check<\u002Fp>\n<\u002Fsection>\n<section data-label=\"Lesson objectives\" data-screen-label=\"02 Lesson objectives\" data-speaker-notes=\"These are the aims from the start of the chapter, grouped by the lesson where each is taught.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Lesson objectives<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">In this chapter you will…<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;\"><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">21.1<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Working with ratio<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Record relationships using ratio notation; find one quantity when the other is given; divide amounts in a given ratio<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">21.2<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Ratio and scale<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Make sense of scales on maps, models and plans<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">21.3<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Rates<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Read and interpret rates; calculate average speed<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">21.4<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Kinematic graphs<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Use, interpret and solve problems with distance–time and speed–time graphs<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">21.5<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Proportion<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Understand direct and inverse proportion; solve problems involving proportionate amounts<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">21.6<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Proportion in algebra<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Use algebra to express direct and inverse proportion<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-700);\">Exam<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Paper 2 &amp; 4 practice<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">Answer full exam-style questions with confidence<\u002Fp><\u002Fdiv><div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:26px 28px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--font-heading);font-size:44px;color:var(--color-accent-2-700);\">Words<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800);\">Key words<\u002Fspan><p style=\"font-size:28px;line-height:1.3;margin:0;text-wrap:pretty;\">ratio · rate · speed · direct proportion · inverse proportion<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"How this chapter is examined\" data-screen-label=\"03 How this chapter is examined\" data-speaker-notes=\"Ratio and proportion questions appear on both Extended papers. Paper 2 has no calculator, so sharing, scales and proportion constants must be done by hand. Paper 4 often has a long travel-graph or speed–time question.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam focus<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">0580 Extended<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:62px;line-height:1.05;margin:0;text-wrap:pretty;\">How ratio, rate and proportion are examined<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;\"><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Paper 2 · no calculator<\u002Fspan><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">Simplify ratios, share amounts, convert map scales, set up y = kx or y = k/x and find unknowns. Numbers are chosen to work out cleanly.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Paper 4 · calculator<\u002Fspan><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">Multi-part context questions: best buys, speed and time conversions, reading and drawing travel graphs, acceleration and distance from the area under a speed–time graph.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;\"><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Units<\u002Fspan><div style=\"font-size:30px;line-height:1.4;text-wrap:pretty;\">Make both quantities the same unit before writing a ratio<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Order<\u002Fspan><div style=\"font-size:30px;line-height:1.4;text-wrap:pretty;\">Write the ratio in the order the words give<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Time<\u002Fspan><div style=\"font-size:30px;line-height:1.4;text-wrap:pretty;\">15 min = 0.25 h, never 0.15 h<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">k first<\u002Fspan><div style=\"font-size:30px;line-height:1.4;text-wrap:pretty;\">Find the constant k before answering anything else<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:32px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:28px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Look at the marks in brackets. [1] means write the answer down; [3] or more means the examiner expects working. Write every method step so you can earn method marks even if the final answer slips.<\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"Prior knowledge\" data-screen-label=\"04 Prior knowledge\" data-speaker-notes=\"Check these skills from earlier chapters before starting: simplifying fractions and common factors, converting units, multiplying and dividing decimals, reading line graphs, gradients of straight lines and solving simple equations.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Prior knowledge<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">Before you start<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:64px;line-height:1.05;margin:0;text-wrap:pretty;\">What you need to remember<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;\"><div style=\"flex:none;background:var(--color-surface);border-radius:var(--radius-lg);padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:var(--font-heading);font-size:34px;color:var(--color-accent-700);\">Common factors (Ch 1)<\u002Fspan><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">Divide both numbers by their HCF x-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:34px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 21.2<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Ratio and scale<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:33px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">write scales in the form 1 : n and n : 1<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">convert lengths on maps, models and plans to real lengths<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">convert real lengths to scaled lengths<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.2 Scale and the form 1 : n\" data-screen-label=\"20 21.2 Scale and the form 1 : n\" data-speaker-notes=\"A scale of 1 to 33 means a length on the model is multiplied by 33 to get the real length in the same units. Scales are given in the form 1 to n, or n to 1 for enlargements. Divide both parts by the number you want to be 1.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked examples 5–7<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.2 · Scale<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Scale is a ratio: drawing : real<\u002Fh2><p style=\"flex:none;font-size:31px;line-height:1.42;margin:0;text-wrap:pretty;\">The Louvre Abu Dhabi roof model was 6 m wide at 1 : 33. Real dome = 6 × 33 = 198 m.<\u002Fp><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:33px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we57.o1 }};transform:{{ we.we57.t1 }};transition:opacity .5s, transform .5s;\">5 : 1000 = 1 : 200<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we57.o1 }};transform:{{ we.we57.t1 }};transition:opacity .5s, transform .5s;\">WE5: divide both by 5<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we57.o2 }};transform:{{ we.we57.t2 }};transition:opacity .5s, transform .5s;\">4 mm : 50 cm = 4 : 500<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we57.o2 }};transform:{{ we.we57.t2 }};transition:opacity .5s, transform .5s;\">WE6: same units first<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we57.o2 }};transform:{{ we.we57.t2 }};transition:opacity .5s, transform .5s;\">= 1 : 125<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we57.o2 }};transform:{{ we.we57.t2 }};transition:opacity .5s, transform .5s;\">divide by 4<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we57.o3 }};transform:{{ we.we57.t3 }};transition:opacity .5s, transform .5s;\">22 : 4 = 5.5 : 1<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we57.o3 }};transform:{{ we.we57.t3 }};transition:opacity .5s, transform .5s;\">WE7: n : 1 may give a decimal<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:30px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Enlargements<\u002Fb>  Diagrams of tiny things (cells, insects) are bigger than real life: the scale is n : 1 with n &gt; 1.<\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we57.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we57.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;justify-content:center;gap:34px;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:44px;\">\n    <div style=\"display:flex;align-items:flex-end;gap:30px;\"><div style=\"width:60px;height:60px;border-radius:12px;background:var(--color-accent-300);border:3px solid var(--color-accent-600);\"><\u002Fdiv><div style=\"flex:1;height:200px;border-radius:24px;background:var(--color-accent-2-300);border:3px solid var(--color-accent-2-600);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--color-accent-2-800);\">real: × n<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-size:48px;\">drawing : real = 1 : n<\u002Fdiv>\n    <div style=\"font-size:33px;line-height:1.5;\">Drawing → real: <b>multiply<\u002Fb> by n<br>Real → drawing: <b>divide<\u002Fb> by n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.2 Worked examples 8 &amp; 9\" data-screen-label=\"21 21.2 Worked examples 8 &amp; 9\" data-speaker-notes=\"Worked example 8: on a 1 to 25 000 map, 5 cm represents 125 000 cm, which is 1.25 km. Worked example 9: a 480 m dam wall on a 1 to 12 000 map is 0.04 m, which is 4 cm. Use the unit ladder to convert.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked examples 8 &amp; 9<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.2 · Scale<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">Map distance ⇄ real distance<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:33px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we89.o1 }};transform:{{ we.we89.t1 }};transition:opacity .5s, transform .5s;\">5 cm × 25 000 = 125 000 cm<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we89.o1 }};transform:{{ we.we89.t1 }};transition:opacity .5s, transform .5s;\">WE8a: map → real, multiply<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we89.o2 }};transform:{{ we.we89.t2 }};transition:opacity .5s, transform .5s;\">125 000 ÷ 100 000 = 1.25 km<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we89.o2 }};transform:{{ we.we89.t2 }};transition:opacity .5s, transform .5s;\">WE8b: 1 km = 100 000 cm<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we89.o3 }};transform:{{ we.we89.t3 }};transition:opacity .5s, transform .5s;\">480 m ÷ 12 000 = 0.04 m<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we89.o3 }};transform:{{ we.we89.t3 }};transition:opacity .5s, transform .5s;\">WE9: real → map, divide<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we89.o3 }};transform:{{ we.we89.t3 }};transition:opacity .5s, transform .5s;\">0.04 m × 100 = 4 cm<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we89.o3 }};transform:{{ we.we89.t3 }};transition:opacity .5s, transform .5s;\">convert to cm<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:30px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:28px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>The answer comes out in the same unit you put in. Convert at the end with the unit ladder, and check the size is sensible: a 1.25 km walk, a 4 cm line.<\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we89.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we89.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;justify-content:center;gap:16px;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:44px;\"><div style=\"display:flex;align-items:center;gap:24px;margin-left:0px;\"><div style=\"width:150px;height:76px;border-radius:999px;background:var(--color-accent-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:38px;\">km<\u002Fdiv><span style=\"font-size:33px;font-weight:700;color:var(--color-neutral-800);\">× 1000 ↓<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:24px;margin-left:60px;\"><div style=\"width:150px;height:76px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:38px;\">m<\u002Fdiv><span style=\"font-size:33px;font-weight:700;color:var(--color-neutral-800);\">× 100 ↓<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:24px;margin-left:120px;\"><div style=\"width:150px;height:76px;border-radius:999px;background:var(--color-accent-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:38px;\">cm<\u002Fdiv><span style=\"font-size:33px;font-weight:700;color:var(--color-neutral-800);\">× 10 ↓<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:24px;margin-left:180px;\"><div style=\"width:150px;height:76px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:38px;\">mm<\u002Fdiv><span style=\"font-size:33px;font-weight:700;color:var(--color-neutral-800);\"><\u002Fspan><\u002Fdiv><p style=\"font-size:31px;margin:12px 0 0;color:var(--color-neutral-800);\">Going down the ladder multiply; going up divide. 1 km = 100 000 cm.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.2 Worked example 10 and Exercise 21.4\" data-screen-label=\"22 21.2 Worked example 10 and Exercise 21.4\" data-speaker-notes=\"Worked example 10: a flea drawn at 12 to 1 is 25 mm long on the diagram, so the real flea is 25 divided by 12, which is 2.08 mm. Then the most challenging parts of Exercise 21.4.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">WE10 · Exercise 21.4<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.2 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Enlargements and scale problems<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;\"><div style=\"display:flex;flex-direction:column;gap:10px;min-height:0;\"><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:33px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we10.o1 }};transform:{{ we.we10.t1 }};transition:opacity .5s, transform .5s;\">diagram : real = 12 : 1<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we10.o1 }};transform:{{ we.we10.t1 }};transition:opacity .5s, transform .5s;\">an enlargement<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we10.o1 }};transform:{{ we.we10.t1 }};transition:opacity .5s, transform .5s;\">25 : x = 12 : 1<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we10.o1 }};transform:{{ we.we10.t1 }};transition:opacity .5s, transform .5s;\"><\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we10.o2 }};transform:{{ we.we10.t2 }};transition:opacity .5s, transform .5s;\">x = 25 ÷ 12 = 2.08 mm<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we10.o2 }};transform:{{ we.we10.t2 }};transition:opacity .5s, transform .5s;\">real flea, 2 d.p.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;min-height:0;\"><div style=\"flex:none;display:flex;flex-direction:column;gap:8px;font-size:31px;line-height:1.38;\"><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1f<\u002Fb><span style=\"text-wrap:pretty;\">Write 9 mm to 150 km in the form 1 : n.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">3d<\u002Fb><span style=\"text-wrap:pretty;\">Map 1 : 50 000. How long is 75.5 km on the map?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">An insect drawn at 5 : 1 is 2.75 cm long. Real length in mm?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">6<\u002Fb><span style=\"text-wrap:pretty;\">An 8.2 mm component is drawn 9.84 cm long. What scale?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">9a<\u002Fb><span style=\"text-wrap:pretty;\">Floor plan 1 : 150. What does 1 cm represent?<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.p214.o1 }};transform:{{ we.p214.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"flex:none;background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:31px;line-height:1.4;\"><b style=\"font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">1f<\u002Fb><span style=\"text-wrap:pretty;\">9 : 150 000 000 = 1 : 16 666 667 (to the nearest whole number)<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">3d<\u002Fb><span style=\"text-wrap:pretty;\">7 550 000 cm ÷ 50 000 = 151 cm<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">5<\u002Fb><span style=\"text-wrap:pretty;\">27.5 mm ÷ 5 = 5.5 mm<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">6<\u002Fb><span style=\"text-wrap:pretty;\">98.4 : 8.2 = 12 : 1<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">9a<\u002Fb><span style=\"text-wrap:pretty;\">150 cm = 1.5 m<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.we10.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.p214.toggle }}\">{{ we.p214.label }}<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.2 Exam coach: map areas\" data-screen-label=\"23 21.2 Exam coach: map areas\" data-speaker-notes=\"Exam questions sometimes ask for an area on a map. Areas scale by the square of the length scale. On a 1 to 25 000 map, 1 cm represents 250 m, so 1 square centimetre represents 250 squared square metres.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam coach<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.2 · Scale<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Areas scale by the square<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:32px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.marea.o1 }};transform:{{ we.marea.t1 }};transition:opacity .5s, transform .5s;\">1 : 25 000 ⇒ 1 cm ↔ 25 000 cm = 250 m<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.marea.o1 }};transform:{{ we.marea.t1 }};transition:opacity .5s, transform .5s;\">convert the length first<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.marea.o2 }};transform:{{ we.marea.t2 }};transition:opacity .5s, transform .5s;\">1 cm² ↔ 250 m × 250 m = 62 500 m²<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.marea.o2 }};transform:{{ we.marea.t2 }};transition:opacity .5s, transform .5s;\">square the length<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.marea.o3 }};transform:{{ we.marea.t3 }};transition:opacity .5s, transform .5s;\">a lake of 3 cm² ↔ 187 500 m²<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.marea.o3 }};transform:{{ we.marea.t3 }};transition:opacity .5s, transform .5s;\">= 0.1875 km²<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-700);color:var(--color-bg);border-radius:var(--radius-lg);padding:18px 28px;font-size:31px;line-height:1.45;text-wrap:pretty;\"><b style=\"letter-spacing:.08em;text-transform:uppercase;font-size:28px;display:block;margin-bottom:4px;\">Exam coach<\u002Fb>Never multiply an area by the scale number itself. Convert one length, then square it.<\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.marea.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.marea.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:center;gap:50px;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:40px;\"><div style=\"width:110px;height:110px;border-radius:14px;background:var(--color-accent-300);border:3px solid var(--color-accent-600);display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:800;\">1 cm²<\u002Fdiv><span style=\"font-size:60px;\">→<\u002Fspan><div style=\"width:330px;height:330px;border-radius:30px;background:var(--color-accent-2-300);border:3px solid var(--color-accent-2-600);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:800;gap:8px;opacity:{{ we.marea.o2 }};transition:opacity .5s;\"><span>250 m × 250 m<\u002Fspan><span>62 500 m²<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.2 Quick check\" data-screen-label=\"24 21.2 Quick check\" data-speaker-notes=\"Quick check. Type an answer and press Check or Enter. Separate several answers with commas.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Quick check<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.2 · Scale<\u002Fspan><\u002Fdiv><h2 style=\"font-fa \u002Fbutton><button class=\"btn btn-ghost\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:12px 24px;border-radius:999px;\" sc-camel-on-click=\"{{ qz.q9.show }}\">Show answer<\u002Fbutton><span style=\"font-size:32px;font-weight:700;color:{{ qz.q9.fbCol }};\">{{ qz.q9.fb }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.3 Rates\" data-screen-label=\"25 21.3 Rates\" data-speaker-notes=\"Lesson 21.3. A rate compares two different quantities, usually as an amount of one per one unit of the other, and always with both units.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;background:var(--color-accent-2-200);padding:100px 120px;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;\">\n<div style=\"position:absolute;right:-200px;top:-200px;width:820px;height:820px;border-radius:50%;background:var(--color-accent-2-300);\"><\u002Fdiv><div style=\"position:absolute;right:260px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:var(--color-accent-200);\"><\u002Fdiv>\n<span style=\"position:relative;font-size:34px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800);\">Lesson 21.3<\u002Fspan>\n<h2 style=\"position:relative;font-family:var(--font-heading);font-weight:400;font-size:112px;line-height:1;margin:0;max-width:1300px;text-wrap:pretty;\">Rates<\u002Fh2>\n<div style=\"position:relative;display:flex;flex-direction:column;gap:12px;max-width:1150px;\"><span style=\"font-size:33px;font-weight:700;color:var(--color-accent-2-800);\">In this lesson you will<\u002Fspan><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">read and interpret rates<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">write rates in their simplest form<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">calculate average speed, distance and time<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.3 What is a rate?\" data-screen-label=\"26 21.3 What is a rate?\" data-speaker-notes=\"A rate compares two different quantities, such as 750 millilitres per bottle, 60 kilometres per hour or 100 people per square kilometre. In simplest form the first quantity is per one unit of the second. Worked example 11: 492 people in 12 square kilometres is 41 people per square kilometre.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked example 11<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.3 · Rates<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:54px;line-height:1.05;margin:0;text-wrap:pretty;\">One quantity per one unit of another<\u002Fh2><div style=\"flex:none;background:var(--color-accent-100);border-radius:var(--radius-lg);padding:16px 26px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:28px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">New word<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:38px;\">Rate<\u002Fspan><p style=\"flex:none;font-size:31px;line-height:1.38;margin:0;text-wrap:pretty;\">A comparison of two different quantities, usually one quantity per one unit of the other. Both units are given, e.g. km/h (the / means “per”).<\u002Fp><\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:33px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we11.o1 }};transform:{{ we.we11.t1 }};transition:opacity .5s, transform .5s;\">492 people in 12 km²<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we11.o1 }};transform:{{ we.we11.t1 }};transition:opacity .5s, transform .5s;\">not simplest: per 12<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we11.o2 }};transform:{{ we.we11.t2 }};transition:opacity .5s, transform .5s;\">492 ÷ 12 = 41<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we11.o2 }};transform:{{ we.we11.t2 }};transition:opacity .5s, transform .5s;\">divide to get a rate per unit<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.we11.o2 }};transform:{{ we.we11.t2 }};transition:opacity .5s, transform .5s;\">= 41 people/km²<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:30px;text-wrap:pretty;opacity:{{ we.we11.o2 }};transform:{{ we.we11.t2 }};transition:opacity .5s, transform .5s;\">always write the units<\u002Fdiv><\u002Fdiv><p style=\"flex:none;font-size:30px;line-height:1.42;margin 11.o1 }};transition:opacity .5s;\">1 km²<\u002Fdiv><p style=\"grid-column:1/-1;font-size:30px;margin:8px 0 0;text-align:center;color:var(--color-neutral-800);\">492 people shared over 12 squares = 41 in each square<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.3 Average speed\" data-screen-label=\"27 21.3 Average speed\" data-speaker-notes=\"Average speed is total distance divided by total time. Use the distance–speed–time triangle: cover the quantity you want and the other two show the calculation. Worked examples 12, 13 and 14.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Worked examples 12–14<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.3 · Speed<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">The D–S–T triangle<\u002Fh2><div style=\"flex:none;background:var(--color-accent-100);border-radius:var(--radius-lg);padding:14px 24px;font-size:31px;line-height:1.4;text-wrap:pretty;\"><b style=\"color:var(--color-accent-700);\">New word · Speed<\u002Fb>  A rate comparing distance with time, such as m/s or km/h. Average speed = total distance ÷ total time.<\u002Fdiv><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:32px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.dst.o1 }};transform:{{ we.dst.t1 }};transition:opacity .5s, transform .5s;\">Bus: 210 km in 3 h<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.dst.o1 }};transform:{{ we.dst.t1 }};transition:opacity .5s, transform .5s;\">WE12: S = D ÷ T = 70 km/h<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.dst.o2 }};transform:{{ we.dst.t2 }};transition:opacity .5s, transform .5s;\">Walk: 4.5 km/h for 2½ h<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.dst.o2 }};transform:{{ we.dst.t2 }};transition:opacity .5s, transform .5s;\">WE13: D = S × T = 11.25 km<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.dst.o3 }};transform:{{ we.dst.t3 }};transition:opacity .5s, transform .5s;\">200 km at 80 km/h<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.dst.o3 }};transform:{{ we.dst.t3 }};transition:opacity .5s, transform .5s;\">WE14: T = D ÷ S = 2.5 h = 2 h 30 min<\u002Fdiv><\u002Fdiv><div style=\"flex:none;background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;font-size:30px;line-height:1.45;text-wrap:pretty;\"><b style=\"color:var(--color-accent-2-800);\">Tip<\u002Fb>  “How fast”, “how far” and “for how long” tell you it is a speed, distance or time problem.<\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.dst.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.dst.reset }}\">Start again<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:center;background xam coach: time and units\" data-screen-label=\"28 21.3 Exam coach: time and units\" data-speaker-notes=\"Most lost marks in speed questions come from time conversions. 2 hours 15 minutes is 2.25 hours, not 2.15. To change kilometres per hour to metres per second multiply by 1000 and divide by 3600.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:72px 110px;display:flex;flex-direction:column;gap:26px;\">\n<div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exam coach<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.3 · Speed<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:60px;line-height:1.05;margin:0;text-wrap:pretty;\">Time and unit conversions<\u002Fh2><div style=\"flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;\"><div style=\"display:flex;flex-direction:column;gap:10px;min-height:0;\"><div style=\"flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:30px;row-gap:8px;align-items:baseline;font-size:32px;line-height:1.35;\"><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.tc.o1 }};transform:{{ we.tc.t1 }};transition:opacity .5s, transform .5s;\">15 min = 15/60 h = 0.25 h<\u002Fdiv><div style=\"color:var(--color-neutral-800);font-size:28px;text-wrap:pretty;opacity:{{ we.tc.o1 }};transform:{{ we.tc.t1 }};transition:opacity .5s, transform .5s;\">divide minutes by 60<\u002Fdiv><div style=\"font-weight:700;white-space:nowrap;opacity:{{ we.tc.o1 }};transform:{{ we.tc.t1 }};transition:opacity .5s, transform .5s;\">2 h 15 min = 2.25 h<\u002Fdiv><div style=\"color:var(--color-neutral-800);f font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-700);min-width:26px;\">1<\u002Fspan><span style=\"text-wrap:pretty;\">Draw the axes. Time always goes along the horizontal axis.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;font-size:30px;line-height:1.35;opacity:{{ we.bus.o2 }};transform:{{ we.bus.t2 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-700);min-width:26px;\">2<\u002Fspan><span style=\"text-wrap:pretty;\">Number the scales: 0–16 minutes, 0–8 km.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;font-size:30px;line-height:1.35;opacity:{{ we.bus.o3 }};transform:{{ we.bus.t3 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-700);min-width:26px;\">3<\u002Fspan><span style=\"text-wrap:pretty;\">Cycle: 1 km in 4 minutes.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;font-size:30px;line-height:1.35;opacity:{{ we.bus.o4 }};transform:{{ we.bus.t4 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-700);min-width:26px;\">4<\u002Fspan><span style=\"text-wrap:pretty;\">Wait 2 minutes: the line is horizontal.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;font-size:30px;line-height:1.35;opacity:{{ we.bus.o5 }};transform:{{ we.bus.t5 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-700);min-width:26px;\">5<\u002Fspan><span style=\"text-wrap:pretty;\">Bus: 7 km in 10 minutes. The steeper line shows the faster part.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;margin-top:auto;padding-top:6px;\"><button class=\"btn btn-primary\" st yle=\"text-wrap:pretty;\">Horizontal: 3 minutes at home.<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;font-size:28px;line-height:1.35;opacity:{{ we.ashraf.o6 }};transform:{{ we.ashraf.t6 }};transition:opacity .5s, transform .5s;\"><span style=\"font-family:var(--font-heading);font-size:31px;color:var(--color-accent-2-700);min-width:26px;\">6<\u002Fspan><span style=\"text-wrap:pretty;\">Runs to school.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.ashrafA.o1 }};transform:{{ we.ashrafA.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"flex:none;background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:28px;line-height:1.4;\"><b style=\"font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">a<\u002Fb><span style=\"text-wrap:pretty;\">1.5 km<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">b<\u002Fb><span style=\"text-wrap:pretty;\">it slopes downwards, back to 0 km<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">c<\u002Fb><span style=\"text-wrap:pretty;\">the 3 minutes at home<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">d<\u002Fb><span style=\"text-wrap:pretty;\">1500 m ÷ 10 min = 150 m/min<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:16px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 34px;border-radius:999px;\" sc-camel-on-click=\"{{ we.ashraf.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:32px;padding:15px 30px;border-radius:999px;\" sc-camel-on-click=\"{{ we.ashrafA.toggle }}\">{{ we.ashrafA.label }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:none;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:24px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c21-graph\" kind=\"ashraf\" step=\"{{ we.ashraf.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.4 Practice: Monica and Omar\" data-screen-label=\"34 21.4 Practice: Monica and Omar\" data-speaker-notes=\"Exercise 21.6 questions 1 and 2. Read values off the travel graphs. Omar’s brother leaves 15 minutes later and walks at 4 km/h; draw his line to find when he passes the friend’s house.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-200);color:var(--color-accent-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Exercise 21.6 · Q1, Q2<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.4 · Practice<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:48px;line-height:1.05;margin:0;text-wrap:pretty;\">Reading travel graphs<\u002Fh2><div style=\"flex:none;display:flex;flex-direction:column;gap:8px;font-size:27px;line-height:1.38;\"><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1a<\u002Fb><span style=\"text-wrap:pretty;\">How far was Monica from home at 09:06?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1b<\u002Fb><span style=\"text-wrap:pretty;\">Minutes at the library?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1c<\u002Fb><span style=\"text-wrap:pretty;\">When was she 800 m from home?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">1d<\u002Fb><span style=\"text-wrap:pretty;\">Faster going or returning?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2a<\u002Fb><span style=\"text-wrap:pretty;\">How long did Omar stay at his friend’s?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2b<\u002Fb><span style=\"text-wrap:pretty;\">When did he arrive home?<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-700);min-width:30px;\">2c<\u002Fb><span style=\"text-wrap:pretty;\">His brother left at 16:45 walking at 4 km/h. When did he pass the friend’s house?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"opacity:{{ we.moA.o1 }};transform:{{ we.moA.t1 }};transition:opacity .5s, transform .5s;display:flex;flex-direction:column;gap:12px;\"><div style=\"flex:none;background:var(--color-accent-2-100);border-radius:var(--radius-lg);padding:18px 26px;display:flex;flex-direction:column;gap:6px;font-size:28px;line-height:1.4;\"><b style=\"font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800);\">Answers<\u002Fb><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">1<\u002Fb><span style=\"text-wrap:pretty;\">a 720 m · b 7 min · c ≈ 09:07 and 09:21 · d going (120 m/min against about 92 m/min)<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:14px;align-items:baseline;\"><b style=\"color:var(--color-accent-2-800);min-width:30px;\">2<\u002Fb><span style=\"text-wrap:pretty;\">a 45 min · b 17:50 · c 2 km at 4 km/h = 30 min ⇒ 17:15<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:14px;margin-top:auto;\"><button class=\"btn btn-primary\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:13px 28px;border-radius:999px;\" sc-camel-on-click=\"{{ we.mo.next }}\">Next step →<\u002Fbutton><button class=\"btn btn-secondary\" style=\"flex:none;white-space:nowrap;font-size:30px;padding:13px 26px;border-radius:999px;\" sc-camel-on-click=\"{{ we.moA.toggle }}\">{{ we.moA.label }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-rows:1fr 1fr;gap:18px;min-height:0;\"><div style=\"flex:none;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:12px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c21-graph\" kind=\"monica\" step=\"{{ we.mo.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><div style=\"flex:none;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 2);padding:12px;display:flex;min-height:0;min-width:0;\"><x-import component-from-global-scope=\"c21-graph\" kind=\"omar\" step=\"{{ we.mo.step }}\" style=\"width:100%;height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.4 Speed from the gradient\" data-screen-label=\"35 21.4 Speed from the gradient\" data-speaker :1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">solve direct proportion problems with the unitary and ratio methods<\u002Fspan><\u002Fdiv><div style=\"flex:none;display:flex;gap:16px;align-items:baseline;font-size:38px;line-height:1.35;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent);flex:none;transform:translateY(-4px);\"><\u002Fspan><span style=\"text-wrap:pretty;\">recognise and solve inverse proportion problems<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section data-label=\"21.5 Direct proportion\" data-screen-label=\"43 21.5 Direct proportion\" data-speaker-notes=\"When two quantities are in direct proportion they increase or decrease at the same rate, and their ratio stays the same. Examples: speed and distance covered in an hour, number of items and mass, hours worked and pay. The graph is a straight line through the origin.\" style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;padding:68px 100px;display:grid;grid-template-columns:minmax(0,1fr) 940px;gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;min-height:0;\"><div style=\"flex:none;display:flex;align-items:center;gap:20px;\"><span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:10px 24px;border-radius:999px;white-space:nowrap;\">Direct proportion<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:var(--color-neutral-800);white-space:nowrap;\">21.5 · Proportion<\u002Fspan><\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.05;margin:0;text-wrap:pretty;\">Same rate, constant ratio<\u002Fh2><div style=\"flex:none;background:var(--color-accent-100);border-radius:va
